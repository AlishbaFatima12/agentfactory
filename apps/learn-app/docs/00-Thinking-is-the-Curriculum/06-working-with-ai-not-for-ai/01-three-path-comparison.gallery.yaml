    - id: "three-path-comparison-strong-1"
      label: "Strong: Bar association channel insight elevates generic GTM strategy"
      provider: "claude"
      student_fields:
        - name: "Student's problem"
          start_marker: "<<problem>>"
          end_marker: "<</problem>>"
