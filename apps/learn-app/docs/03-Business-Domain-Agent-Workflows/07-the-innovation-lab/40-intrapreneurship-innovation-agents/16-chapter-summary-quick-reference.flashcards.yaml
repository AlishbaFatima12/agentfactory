deck:
  id: "ch40-16-chapter-summary-quick-reference"
  title: "Chapter Summary and Quick Reference — Chapter 40 Lesson 16"
  version: 1

cards:
  - front: "What is the central insight of the Innovation OS?"
    back: "Innovation is about converting uncertainty into validated opportunity faster than competitors. AI eliminates execution overhead (synthesis, drafting, modelling) without replacing the entrepreneur's judgment on which ideas are good, whether to pivot, or whether customer insight is accurate."

  - front: "What does Design Thinking answer, and at what level does it operate?"
    back: "Design Thinking answers: what is the real problem worth solving? It operates at the problem level, in conditions of high uncertainty about customer needs."

  - front: "What does Lean Startup answer, and at what level does it operate?"
    back: "Lean Startup answers: is this the right solution to that problem? It operates at the solution level, in conditions of medium uncertainty."

  - front: "What does Agile answer, and at what level does it operate?"
    back: "Agile answers: how do we build and deliver this effectively? It operates at the delivery level, in conditions of lower uncertainty where you know what to build."

  - front: "Name the two Design Thinking commands."
    back: "/discovery (customer research, JTBD synthesis, HMW problem statements) and /idea (100-idea sprint, DVF scoring, pressure testing)."

  - front: "Name the two Lean Startup commands."
    back: "/hypothesis (assumption mapping, MVP scoping) and /validate (build-measure-learn analysis, pivot-or-persevere)."

  - front: "Name the Agile command."
    back: "/sprint — innovation sprint planning, assumption-linked user stories, backlog, retrospective with assumption updates."

  - front: "Name the four cross-cutting commands."
    back: "/market (competitive intelligence + sizing), /financials (unit economics + runway), /pitch (investor deck narrative), /gtm (go-to-market strategy). These apply at any DLA stage."

  - front: "Name the four innovation agents and their weekly automated task."
    back: "Idea Generator (Monday Innovation Brief), Customer Intelligence (Customer Signal Digest), Business Model Architect (Monthly Financial Health Review), Fundraising Readiness (Investor Pipeline tracking)."

  - front: "What is the intrapreneur translation for 'product-market fit'?"
    back: "Internal adoption — the organisation's own teams or existing customers adopting the innovation at the desired scale."

  - front: "What does innov.local.md do, and which section should be filled in first?"
    back: "innov.local.md provides venture context that makes every command output specific rather than generic. Fill in the venture: section first — even a rough problem statement and target customer immediately improves output quality."

  - front: "Name three things AI compresses in the innovation cycle."
    back: "Any three from: interview synthesis (weeks → hours), assumption mapping (workshops → one session), business model canvas (workshop → 20 minutes), financial modelling (days → hours), pitch deck narrative (weeks → one afternoon), competitive intelligence (incomplete → real-time)."
