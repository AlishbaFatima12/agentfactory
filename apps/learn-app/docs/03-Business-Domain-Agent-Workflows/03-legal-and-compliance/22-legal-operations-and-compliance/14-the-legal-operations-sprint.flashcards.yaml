deck:
  id: "ch22-14-legal-operations-sprint"
  title: "The Legal Operations Sprint"
  description: "Capstone sprint assembling all Legal Plugin commands, skills, and jurisdiction overlays into a timed end-to-end exercise — playbook validation, contract review sprint, NDA triage, compliance assessment, meeting prep, DSAR processing, and legal ops dashboard"
  tags: ["legal-ops", "capstone", "sprint", "chapter-22"]
  version: 1

cards:
  - id: "ch22-14-sprint-001"
    front: "What are the seven stages of the legal operations sprint capstone?"
    back: "1. Playbook validation — score contracts to detect calibration drift.\n2. Contract review sprint — review 3 contracts with redlines.\n3. NDA triage — configure and test Tier 1/2/3 system.\n4. Compliance assessment — 5x5 risk matrix for a new market.\n5. Meeting prep — briefing and /signature-request routing.\n6. DSAR response — acknowledgement within statutory window.\n7. Legal ops dashboard — vendor health, calendar, spend, and GC briefing."
    difficulty: "basic"
    tags: ["sprint-stages", "capstone"]

  - id: "ch22-14-sprint-002"
    front: "What is playbook calibration drift and how do you detect it?"
    back: "Calibration drift occurs when the playbook thresholds no longer match the organisation's actual risk tolerance — for example, flagging a limitation of liability clause as RED when the organisation accepted that same position in a recent deal. Detection method: run /review-contract against 3 recently executed contracts. If any review flags RED items that were actually accepted during negotiation, the playbook is miscalibrated and needs adjustment."
    difficulty: "intermediate"
    tags: ["calibration-drift", "playbook-validation"]

  - id: "ch22-14-sprint-003"
    front: "What are the four principles of legal AI deployment?"
    back: "1. The agent reviews; the attorney decides — pattern recognition vs judgment and strategy.\n2. The playbook is the product — the plugin is infrastructure; institutional knowledge is not.\n3. Process-level agents eliminate coordination overhead — intake, monitoring, calendar, DSAR remove chasing and tracking work.\n4. Jurisdiction-aware analysis is non-negotiable — overlays ensure every analysis reflects the applicable legal framework."
    difficulty: "intermediate"
    tags: ["four-principles", "deployment"]

  - id: "ch22-14-sprint-004"
    front: "What is the target NDA triage distribution, and what does deviation indicate?"
    back: "Target: 60% Tier 1 (auto-approve), 25% Tier 2 (counsel review), 15% Tier 3 (full review). If results diverge significantly — for example, too many NDAs landing in Tier 3 — the playbook thresholds are too aggressive and need loosening. If too many land in Tier 1, the thresholds may be too permissive and letting problematic NDAs through without review."
    difficulty: "intermediate"
    tags: ["nda-triage", "calibration"]

  - id: "ch22-14-sprint-005"
    front: "Name the seven Legal Plugin commands and their primary use."
    back: "1. /review-contract — full contract review vs playbook.\n2. /triage-nda — NDA pre-screening and tier routing.\n3. /vendor-check — obligation and status check.\n4. /brief — research, regulatory monitoring, IP analysis.\n5. /respond — DSAR, legal holds, routine responses.\n6. /compliance-check — proactive regulatory assessment.\n7. /signature-request — e-signature routing via DocuSign."
    difficulty: "basic"
    tags: ["commands", "quick-reference"]

  - id: "ch22-14-sprint-006"
    front: "Name the four Agent Factory Legal Ops Extension commands."
    back: "1. /legal-brief — extended research with jurisdiction overlays.\n2. /legal-hold — litigation hold package with custodian tracking.\n3. /contract-intake — automated classification and routing.\n4. /compliance-calendar — deadline tracking with escalation logic."
    difficulty: "basic"
    tags: ["extension-commands", "quick-reference"]

  - id: "ch22-14-sprint-007"
    front: "What six jurisdiction overlays are available in the Legal Plugin?"
    back: "1. uk-overlay — English law, UCTA, UK GDPR, Companies Act.\n2. uae-overlay — UAE Civil Code, mainland federal law.\n3. difc-overlay — DIFC law, DFSA regulations, DIFC Courts.\n4. pakistan-overlay — Contract Act 1872, PDPA, SECP requirements.\n5. saudi-overlay — Saudi law, PDPL, SAMA regulations.\n6. gcc-overlay — GCC-wide commercial registration, VAT."
    difficulty: "basic"
    tags: ["jurisdiction-overlays", "quick-reference"]

  - id: "ch22-14-sprint-008"
    front: "What is the minimum viable capstone (for 30 minutes instead of 45)?"
    back: "Exercises 1, 2, 3, and 7: validate your playbook, review 3 contracts, triage 5 NDAs, and produce the legal ops dashboard. These four cover the core loop and demonstrate the end-to-end workflow. The remaining exercises (compliance assessment, meeting prep, DSAR, full pipeline) deepen specific areas but are not required for the minimum viable demonstration."
    difficulty: "basic"
    tags: ["minimum-viable", "time-management"]

  - id: "ch22-14-sprint-009"
    front: "What three types of errors should you watch for during live sprint execution?"
    back: "1. Miscalibrated thresholds — playbook positions that flag acceptable deals as RED or miss genuinely problematic clauses.\n2. Missing jurisdiction overlays — cross-border contracts analysed under only one jurisdiction when multiple apply.\n3. Hallucinated regulatory references — the agent citing specific article numbers or regulations that do not exist, creating false confidence in compliance."
    difficulty: "advanced"
    tags: ["error-detection", "quality-control"]

  - id: "ch22-14-sprint-010"
    front: "What does the weekly GC briefing dashboard contain, and what are its constraints?"
    back: "Contents: RAG status per category (contracts, compliance, spend), items requiring GC personal attention, and emerging risks before they become urgent. Constraints: 5-minute read maximum, 1-page format, combining vendor health check, compliance calendar, and legal spend report outputs into a single executive summary."
    difficulty: "intermediate"
    tags: ["gc-briefing", "dashboard"]

  - id: "ch22-14-sprint-011"
    front: "When transferring the legal operations engine to a new organisation, what transfers directly and what requires reconfiguration?"
    back: "Transfers directly: command structure, triage methodology, dashboard framework, DSAR workflow.\nRequires reconfiguration: playbook clause positions, jurisdiction overlays, compliance calendar deadlines, risk thresholds.\nOrganisation-specific (does not transfer): unique regulatory requirements, practice area specialisations, professional conduct rules."
    difficulty: "advanced"
    tags: ["transferability", "reconfiguration"]

  - id: "ch22-14-sprint-012"
    front: "What is the core division of labour that runs through every lesson in Chapter 22?"
    back: "The agent reviews, triages, drafts, and flags. The licensed attorney advises, decides, and signs. The agent handles the 80% of legal work that is pattern recognition, research, document analysis, and first-draft preparation. The attorney handles the 20% requiring judgment, strategy, relationship management, and professional accountability. Keeping these distinct maximises the contribution of both."
    difficulty: "basic"
    tags: ["division-of-labour", "core-principle"]
