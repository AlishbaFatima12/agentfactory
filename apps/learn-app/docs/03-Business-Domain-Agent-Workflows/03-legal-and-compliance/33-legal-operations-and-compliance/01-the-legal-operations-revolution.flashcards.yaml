deck:
  id: "ch22-01-legal-operations-revolution"
  title: "The Legal Operations Revolution"
  description: "Two-layer plugin installation, first contract review with GREEN/YELLOW/RED classification, the governing principle of legal AI, five pre-AI bottlenecks, and the ATTORNEY REVIEW: REQUIRED header"
  tags: ["legal-ops", "contract-review", "plugin-installation", "chapter-22"]
  version: 1

cards:
  - id: "ch22-01-legal-ops-revolution-001"
    front: "What are the two plugin layers required for the Legal Operations chapter in Cowork?"
    back: "1. The Anthropic Legal Plugin (base) — provides nine commands for contract review, NDA triage, compliance, briefings, and templated responses.\n2. The Agent Factory Legal Ops extension — adds one agent, six skills, and six jurisdiction overlays for cross-border legal work."
    difficulty: "basic"
    tags: ["plugin-installation"]

  - id: "ch22-01-legal-ops-revolution-002"
    front: "What does the GREEN/YELLOW/RED classification system mean in the Legal Plugin's contract review output?"
    back: "GREEN — Acceptable as written, no action needed.\nYELLOW — Negotiate before signing; the clause has issues but is within a negotiable range.\nRED — Escalate to attorney; the clause carries material risk that requires licensed professional review before proceeding."
    difficulty: "basic"
    tags: ["classification", "contract-review"]

  - id: "ch22-01-legal-ops-revolution-003"
    front: "What is the governing principle that appears in the ATTORNEY REVIEW: REQUIRED header on every Legal Plugin output?"
    back: "The agent reviews, triages, drafts, and flags. The licensed attorney advises, decides, and signs. This is not a limitation of current AI capability — it is the correct architecture for legal deployment, built into the plugin itself."
    difficulty: "basic"
    tags: ["governance", "attorney-review"]

  - id: "ch22-01-legal-ops-revolution-004"
    front: "Why does the Legal Plugin's ATTORNEY REVIEW: REQUIRED header exist on every output?"
    back: "Professional conduct rules in every jurisdiction require licensed attorneys to supervise AI work product. The ABA Model Rules (US) require competence (Rule 1.1) and supervision of nonlawyer assistants including AI (Rule 5.3). The SRA Code of Conduct (England and Wales) requires solicitors to maintain competence and supervise all work. The agent assists; the licensed professional decides."
    difficulty: "intermediate"
    tags: ["governance", "professional-conduct"]

  - id: "ch22-01-legal-ops-revolution-005"
    front: "What are the five pre-AI bottlenecks in legal departments, and which plugin commands address them?"
    back: "1. Contract review queues — /review-contract\n2. NDA backlogs — /triage-nda\n3. Compliance monitoring gaps — /compliance-check\n4. Knowledge management failures — Negotiation playbook (Lesson 2)\n5. Reporting blind spots — /brief"
    difficulty: "intermediate"
    tags: ["bottlenecks", "legal-ops"]

  - id: "ch22-01-legal-ops-revolution-006"
    front: "What did ABA Formal Opinion 512 (2024) confirm about generative AI in legal practice?"
    back: "It confirmed that generative AI falls under ABA Model Rule 5.3 (supervision of nonlawyer assistants). Lawyers must review AI outputs with the same diligence they would apply to work from a junior associate."
    difficulty: "intermediate"
    tags: ["professional-conduct", "aba"]

  - id: "ch22-01-legal-ops-revolution-007"
    front: "In the CloudStack MSA review, why was the 3-month liability cap classified as RED?"
    back: "A 3-month fee cap is significantly below the market standard of 12 months. On a PKR 4.8M annual contract, it caps Provider's liability at PKR 1.2M — meaning the customer bears the bulk of any loss from vendor failure. The recommendation is to reject and negotiate to at least 12 months' fees."
    difficulty: "intermediate"
    tags: ["liability-cap", "contract-review"]

  - id: "ch22-01-legal-ops-revolution-008"
    front: "Why was the CloudStack MSA's data transfer clause ('any jurisdiction where Provider maintains facilities') classified as RED?"
    back: "The clause imposes no restrictions on where data can be transferred. This creates a potential conflict with Pakistan's PDPA 2023 for Pakistani data subjects. Cross-border data transfers require an adequacy assessment or Standard Contractual Clauses (SCCs) — neither of which the clause provides."
    difficulty: "advanced"
    tags: ["data-protection", "pdpa", "cross-border"]

  - id: "ch22-01-legal-ops-revolution-009"
    front: "What is the difference between what the agent does and what the attorney does in legal AI workflows?"
    back: "The agent: reviews contracts clause-by-clause, classifies risk as GREEN/YELLOW/RED, drafts redline suggestions, flags regulatory compliance issues, and produces briefings.\nThe attorney: makes the commercial judgment call, decides which RED items to accept, reviews and sends redlines, interprets regulatory impact, and signs off on advice to the business."
    difficulty: "basic"
    tags: ["governance", "roles"]

  - id: "ch22-01-legal-ops-revolution-010"
    front: "What MCP connector categories does the Legal Plugin support, and what is the minimum recommended setup?"
    back: "Categories: Email, Calendar, Chat, Cloud Storage, E-Signature, Project Tracker, CRM, and Office Suite. Minimum recommended: Gmail and Google Calendar — both are free and unlock meeting prep and email-based intake in later lessons."
    difficulty: "basic"
    tags: ["mcp-connectors", "setup"]

  - id: "ch22-01-legal-ops-revolution-011"
    front: "Why was the CloudStack MSA's IP ownership clause ('all IP including customisations created for Customer belongs to Provider') classified as RED?"
    back: "It means custom integrations built specifically for the customer are not owned by the customer. Combined with the data-on-termination clause (no obligation to return data), the customer loses both its IP and its data if the relationship ends. The recommendation is to carve out customer-specific configurations."
    difficulty: "advanced"
    tags: ["ip-ownership", "contract-review"]

  - id: "ch22-01-legal-ops-revolution-012"
    front: "How does the Legal Plugin transform Bilal's role at Noor Technologies?"
    back: "Without the plugin, Bilal spends 60% of his time on administrative coordination (forwarding contracts, chasing signatures, sending reminders) and only 40% on actual legal work. The plugin automates the administrative routing and triage, allowing Bilal to focus on reviewing clause language and flagging risk — inverting the ratio to what Ayesha needs."
    difficulty: "basic"
    tags: ["legal-ops", "workflow"]
