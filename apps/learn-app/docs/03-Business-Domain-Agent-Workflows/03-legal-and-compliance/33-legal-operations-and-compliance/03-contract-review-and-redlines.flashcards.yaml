deck:
  id: "ch33-03-contract-review-redlines"
  title: "Contract Review and Redlines"
  description: "CLM lifecycle, /review-contract seven-step workflow, GREEN/YELLOW/RED classification, redline format, obligation tracking with /vendor-check, and contract repository as institutional intelligence"
  tags: ["legal-ops", "contract-review", "redlines", "chapter-33"]
  version: 1

cards:
  - id: "ch33-03-contract-review-001"
    front: "What is CLM (Contract Lifecycle Management)?"
    back: "The end-to-end process of creating, negotiating, executing, storing, monitoring, and renewing or terminating contracts. In a mature CLM system, every contract is searchable, every obligation is tracked, and every renewal date triggers an alert."
    difficulty: "basic"
    tags: ["clm"]

  - id: "ch33-03-contract-review-002"
    front: "What are the seven steps of the /review-contract workflow?"
    back: "1. Accept the contract\n2. Gather context (party role, timeline, concerns)\n3. Load the playbook (legal.local.md)\n4. Clause-by-clause analysis (read entire contract before flagging)\n5. Flag deviations using three-tier classification (GREEN/YELLOW/RED)\n6. Generate redline suggestions with exact replacement text\n7. Holistic risk summary with recommended action"
    difficulty: "intermediate"
    tags: ["review-contract", "workflow"]

  - id: "ch33-03-contract-review-003"
    front: "What do the three tiers GREEN, YELLOW, and RED mean in contract review classification?"
    back: "GREEN: Acceptable, within standard position or acceptable range.\nYELLOW: Negotiate, outside standard but within acceptable range; agent provides primary redline and fallback.\nRED: Escalate, outside acceptable range; requires attorney review before proceeding."
    difficulty: "basic"
    tags: ["classification"]

  - id: "ch33-03-contract-review-004"
    front: "What six fields does each redline suggestion contain?"
    back: "1. Current text: the existing clause language\n2. Issue: what is wrong and why\n3. Redline: exact proposed replacement text\n4. Fallback: alternative position if counterparty resists\n5. Rationale: commercial justification\n6. Priority; Must-have or Nice-to-have"
    difficulty: "intermediate"
    tags: ["redline-format"]

  - id: "ch33-03-contract-review-005"
    front: "What is a redline in contract negotiation?"
    back: "A proposed change to contract language showing exactly what text to remove and what text to insert. The term comes from the historical practice of marking changes in red ink. The Legal Plugin generates redlines as exact replacement text: not vague suggestions: ready for an attorney to review and send to the counterparty."
    difficulty: "basic"
    tags: ["redline"]

  - id: "ch33-03-contract-review-006"
    front: "What is a limitation of liability clause, and why is it the most negotiated clause in commercial contracts?"
    back: "A limitation of liability clause caps the maximum amount one or both parties can claim from the other for breach of contract. It is the most negotiated because the cap directly determines financial exposure: for example, a 3-month fee cap on a PKR 4.8M contract limits recovery to PKR 1.2M regardless of actual loss. Carve-outs for IP infringement, data breaches, and confidentiality breaches are common."
    difficulty: "intermediate"
    tags: ["limitation-of-liability"]

  - id: "ch33-03-contract-review-007"
    front: "Why does the /review-contract agent read the entire contract before flagging any clause?"
    back: "Because clauses interact. An uncapped indemnity may be partially mitigated by a broad limitation of liability. An unusual IP ownership provision may be commercially reasonable given the pricing structure. Context across the full contract is needed before any individual clause can be accurately assessed."
    difficulty: "intermediate"
    why: "What would happen if the agent flagged clauses in isolation without reading the full contract first?"
    tags: ["clause-interaction"]

  - id: "ch33-03-contract-review-008"
    front: "What does the /vendor-check command produce after a contract is executed?"
    back: "1. Obligations summary: what each party must do and when\n2. Upcoming deadlines: obligations due in 30/60/90 days\n3. Overdue items: obligations with no recorded completion\n4. Renewal calendar: auto-renewal dates, notice windows, recommended action dates\n5. SLA monitoring: if connected, current performance against contractual thresholds"
    difficulty: "basic"
    tags: ["vendor-check", "obligation-tracking"]

  - id: "ch33-03-contract-review-009"
    front: "How does the contract repository function as institutional intelligence?"
    back: "Connected via MCP to the document management system, the agent searches executed contracts and returns: the range of liability caps accepted and achieved, which counterparties accepted standard positions, which required negotiation, and at what compromise position RED escalations were resolved. This transforms static storage into evidence-based negotiation data."
    difficulty: "intermediate"
    why: "Why is 'Our portfolio shows 94% of comparable vendors accept a 6-12 month mutual cap' more persuasive than a textbook negotiation position?"
    tags: ["contract-repository", "intelligence"]

  - id: "ch33-03-contract-review-010"
    front: "Why did the CloudStack MSA receive a RED classification on its data protection clause?"
    back: "The clause was a bare compliance statement ('comply with all applicable data protection laws') with no DPA attached, no data residency provisions, no breach notification timeline, and no deletion on termination: while processing personal data of Pakistani residents under PDPA 2023. A DPA is a legal requirement, not a negotiation position."
    difficulty: "intermediate"
    tags: ["data-protection", "pdpa"]

  - id: "ch33-03-contract-review-011"
    front: "What is the estimated annual cost of poor contract management according to the World Commerce & Contracting Association?"
    back: "Between 5% and 9% of annual revenue: through missed renewals, unfavourable auto-renewals, untracked obligations, and failed compliance. For a $100M business, that is $5M-$9M per year lost to administrative friction."
    difficulty: "basic"
    tags: ["clm", "business-case"]

  - id: "ch33-03-contract-review-012"
    front: "What is the governance rule for all /review-contract and /vendor-check outputs?"
    back: "The agent reviews, triages, drafts, and flags. The licensed attorney advises, decides, and signs. All outputs require review by a licensed attorney before any contractual commitment is made."
    difficulty: "basic"
    tags: ["governance"]
