deck:
  id: "ch33-02-negotiation-playbook"
  title: "The Negotiation Playbook"
  description: "Building legal.local.md with organisation profile and six clause positions, comparing generic vs playbook-calibrated contract review, MCP connector categories and the ~~category placeholder system"
  tags: ["legal-ops", "negotiation-playbook", "legal-local-md", "chapter-33"]
  version: 1

cards:
  - id: "ch33-02-negotiation-playbook-001"
    front: "What is legal.local.md and why is it called a negotiation playbook?"
    back: "legal.local.md is a configuration file that encodes an organisation's standard contractual positions, acceptable ranges, and RED escalation triggers. It transforms the Legal Plugin from a generic reviewer into an institutional knowledge system: producing output calibrated to your organisation's specific risk tolerance, regulatory obligations, and negotiation experience."
    difficulty: "basic"
    tags: ["playbook", "legal-local-md"]

  - id: "ch33-02-negotiation-playbook-002"
    front: "What are the six priority clause positions configured in the negotiation playbook?"
    back: "1. Limitation of Liability\n2. Intellectual Property Ownership\n3. Indemnification\n4. Data Protection and Privacy\n5. Termination\n6. Governing Law and Jurisdiction"
    difficulty: "basic"
    tags: ["clause-positions"]

  - id: "ch33-02-negotiation-playbook-003"
    front: "What three fields define each clause position in the playbook?"
    back: "1. STANDARD POSITION: what the organisation ideally wants\n2. ACCEPTABLE RANGE: what the organisation can live with\n3. ESCALATE (RED) IF: hard limits that require attorney review\nOptionally, a NOTES field adds jurisdiction-specific considerations."
    difficulty: "basic"
    tags: ["clause-positions", "structure"]

  - id: "ch33-02-negotiation-playbook-004"
    front: "How does a playbook-calibrated review differ from a generic review for a limitation of liability clause with a 3-month fee cap?"
    back: "Generic review: YELLOW: 'Cap appears low relative to contract value.'\nPlaybook-calibrated review: RED: 'PKR 600,000 against Noor standard of 12 months = PKR 2,400,000. 75% below floor. Recommend mutual 12-month cap.'\nThe playbook changes the classification, adds specific numbers, and provides actionable redline language matching the organisation's positions."
    difficulty: "intermediate"
    tags: ["calibration", "comparison"]

  - id: "ch33-02-negotiation-playbook-005"
    front: "What is a DPA (Data Processing Agreement) and when is it legally required?"
    back: "A DPA is a contract between a data controller and a data processor, required by data protection laws whenever one party processes personal data on behalf of another. It specifies what data is processed, for what purpose, retention periods, breach notification timelines, and deletion obligations. Under Pakistan's PDPA 2023, failure to have a DPA exposes both parties to regulatory action. Under DIFC DP Law 2020, fines reach USD 100,000."
    difficulty: "intermediate"
    tags: ["dpa", "data-protection"]

  - id: "ch33-02-negotiation-playbook-006"
    front: "What are SCCs (Standard Contractual Clauses) and why do they matter for cross-border data transfers?"
    back: "SCCs are pre-approved contractual terms for transferring personal data from a jurisdiction with strong data protection to one without an adequacy decision. The EU adopted new SCCs in June 2021; the UK has its own International Data Transfer Agreement (IDTA). DIFC and ADGM maintain separate approved transfer mechanisms. Using the wrong SCCs for your jurisdiction: or none at all: can result in regulatory enforcement."
    difficulty: "intermediate"
    tags: ["sccs", "data-transfer", "cross-border"]

  - id: "ch33-02-negotiation-playbook-007"
    front: "What are the three NDA tiers in the playbook, and what is the review SLA for each?"
    back: "Tier 1 (Auto-approve, 1 business day): Counterparty NDA on your template, no modifications, mutual obligations, standard 2-year term.\nTier 2 (Review, 2 business days): Counterparty's own form, or your template with modifications to scope/term/return provisions.\nTier 3 (Escalate to GC, 5 business days): Residual rights, non-compete restrictions, no public-info carve-outs, unilateral obligations, term exceeding 5 years, or governing law outside Pakistan/UK/DIFC."
    difficulty: "intermediate"
    tags: ["nda", "triage", "tiers"]

  - id: "ch33-02-negotiation-playbook-008"
    front: "What is the ~~category placeholder system in MCP connector categories?"
    back: "Skills in the Legal Plugin use ~~category placeholders (e.g., ~~cloud storage, ~~email) that resolve at runtime to whatever MCP server is connected. This makes the plugin provider-agnostic: swapping from Box to SharePoint requires changing the connector configuration, not modifying any skill definition."
    difficulty: "intermediate"
    tags: ["mcp-connectors", "placeholders"]

  - id: "ch33-02-negotiation-playbook-009"
    front: "Name the nine MCP connector categories supported by the Legal Plugin."
    back: "1. Calendar\n2. Chat\n3. Cloud Storage\n4. CLM (Contract Lifecycle Management)\n5. CRM\n6. Email\n7. E-Signature\n8. Office Suite\n9. Project Tracker"
    difficulty: "basic"
    tags: ["mcp-connectors"]

  - id: "ch33-02-negotiation-playbook-010"
    front: "How does the plugin's role change when MCP connectors are added?"
    back: "Without connectors, the plugin is a document reviewer: you upload contracts and paste text. With connectors, it becomes a process manager: the Contract Intake Agent monitors Gmail for incoming agreements, the compliance calendar syncs deadlines to Google Calendar, and vendor management pulls meeting context from calendar and Slack channels."
    difficulty: "intermediate"
    tags: ["mcp-connectors", "workflow"]

  - id: "ch33-02-negotiation-playbook-011"
    front: "Why does Fatima Al-Rashidi's playbook at PayGulf Technologies produce different output from Noor Technologies' playbook on the same contract?"
    back: "PayGulf is DFSA-regulated in DIFC. Fatima's playbook specifies DIFC DP Law 2020 compliance (not PDPA 2023), defaults to DIFC law and DIFC Courts (never mainland UAE law above AED 1,000,000 due to Arabic-prevails risk), and has a higher liability floor (AED 500,000) because DFSA-regulated entities require conservative postures. Same plugin, same commands: radically different output because the playbook encodes institutional knowledge, not generic standards."
    difficulty: "advanced"
    tags: ["calibration", "dfsa", "institutional-knowledge"]

  - id: "ch33-02-negotiation-playbook-012"
    front: "What is the key insight about the difference between the plugin and the playbook?"
    back: "The plugin is infrastructure: it provides the commands and skills for contract review, triage, and compliance. The playbook is the product: it encodes your organisation's risk tolerance, regulatory obligations, and negotiation experience. A playbook transforms generic observations into actionable instructions with specific numbers and replacement language."
    difficulty: "basic"
    tags: ["playbook", "institutional-knowledge"]
