deck:
  id: "ch33-06-compliance-check-risk-assessment"
  title: "Compliance Check and Legal Risk Assessment"
  description: "Proactive compliance with /compliance-check, the 5x5 severity-by-likelihood risk matrix, GREEN/YELLOW/ORANGE/RED classification, and the distinction between proactive, reactive, and monitoring compliance modes"
  tags: ["legal-ops", "compliance", "risk-assessment", "chapter-33"]
  version: 1

cards:
  - id: "ch33-06-compliance-risk-001"
    front: "What are the three compliance modes provided by the Legal Plugin, and which tool does each use?"
    back: "/review-contract; Reactive (an agreement exists and needs review).\n/brief topic:regulatory; Monitoring (tracking external regulatory changes).\n/compliance-check; Proactive (assessing a planned business action before it creates legal exposure)."
    difficulty: "basic"
    tags: ["compliance-modes"]

  - id: "ch33-06-compliance-risk-002"
    front: "What is proactive compliance?"
    back: "The practice of assessing regulatory requirements before launching a product, entering a market, or changing a business process: identifying applicable regulations and compliance gaps before any exposure is created. Proactive compliance costs hours; reactive enforcement costs millions."
    difficulty: "basic"
    tags: ["proactive-compliance"]

  - id: "ch33-06-compliance-risk-003"
    front: "What are the three possible recommendations from a /compliance-check assessment?"
    back: "1. Proceed: no significant regulatory barriers.\n2. Proceed with conditions: specific regulatory requirements must be addressed before launch.\n3. Requires review: regulatory complexity exceeds standard assessment; specialist counsel required."
    difficulty: "basic"
    tags: ["compliance-check", "recommendations"]

  - id: "ch33-06-compliance-risk-004"
    front: "What is a 5x5 risk matrix, and how is the risk score calculated?"
    back: "A framework that plots the severity of a risk (1-5) against its likelihood (1-5). The risk score is Severity multiplied by Likelihood, producing a number from 1 to 25. This transforms subjective legal judgment ('this feels risky') into quantified assessment ('this is a 12/25 ORANGE risk requiring mitigation')."
    difficulty: "intermediate"
    tags: ["risk-matrix", "5x5"]

  - id: "ch33-06-compliance-risk-005"
    front: "What are the four risk classification bands in the 5x5 matrix, and what action does each require?"
    back: "GREEN (1-4): Accept: monitor during normal operations.\nYELLOW (5-9): Monitor: include in quarterly risk review.\nORANGE (10-15): Mitigate: active risk reduction required before proceeding.\nRED (16-25): Escalate: stop and address immediately, senior counsel required."
    difficulty: "basic"
    tags: ["risk-classification"]

  - id: "ch33-06-compliance-risk-006"
    front: "What do the five severity levels (1-5) represent in the risk matrix?"
    back: "1; Negligible (<1% of relevant value): minor administrative issue.\n2; Minor (1-5%): procedural gap, correctable without external impact.\n3; Moderate (5-10%): regulatory notice likely, remediation required.\n4; Major (10-25%): enforcement action probable, material financial impact.\n5; Critical (>25%): criminal liability, licence revocation, existential threat."
    difficulty: "intermediate"
    tags: ["severity-scale"]

  - id: "ch33-06-compliance-risk-007"
    front: "What do the five likelihood levels (1-5) represent in the risk matrix?"
    back: "1; Remote (<5%): requires exceptional circumstances.\n2; Unlikely (5-20%): possible but not expected.\n3; Possible (20-50%): could occur under normal conditions.\n4; Likely (50-80%): expected to occur without intervention.\n5; Almost Certain (>80%): will occur unless actively prevented."
    difficulty: "intermediate"
    tags: ["likelihood-scale"]

  - id: "ch33-06-compliance-risk-008"
    front: "In the Noor Technologies AI document processing scenario, why did the cross-border data transfer to the US OCR provider score RED (16/25)?"
    back: "Severity 4 (Major: potential enforcement across 3 jurisdictions: Pakistan PDPA, UAE PDPL, UK GDPR) multiplied by Likelihood 4 (Likely: the transfer occurs with every document processed). Score 16 = RED, meaning it must be resolved before launch by executing a processor agreement with Standard Contractual Clauses."
    difficulty: "advanced"
    tags: ["cross-border", "data-transfer"]

  - id: "ch33-06-compliance-risk-009"
    front: "Which four regulations did /compliance-check identify for Noor Technologies' AI document processing service, and why?"
    back: "1. Pakistan PDPA 2023: processing personal data of Pakistani residents.\n2. UAE PDPL (Decree-Law No. 45/2021): processing data of UAE export partners.\n3. UK GDPR: processing data of UK export partners.\n4. Pakistan Electronic Transactions Ordinance 2002: electronic processing of commercial documents."
    difficulty: "intermediate"
    tags: ["regulations", "pdpa", "gdpr"]

  - id: "ch33-06-compliance-risk-010"
    front: "Why did the PayGulf cross-border payment scenario receive a 'Requires review' recommendation while Noor's scenario received 'Proceed with conditions'?"
    back: "PayGulf is a DFSA-regulated financial entity expanding into Saudi Arabia, triggering SAMA outsourcing rules and Saudi data localisation requirements. Two risks scored RED (SAMA approval = 20/25, Saudi data localisation = 16/25). Regulated entities face higher compliance thresholds because financial regulators enforce actively and penalties include licence revocation."
    difficulty: "advanced"
    tags: ["paygulf", "regulated-entities"]

  - id: "ch33-06-compliance-risk-011"
    front: "What is the difference between a compliance assessment and a risk matrix?"
    back: "The compliance assessment identifies what regulations apply to a planned action (qualitative: which rules, which requirements). The risk matrix quantifies how much risk each compliance gap creates (quantitative: severity x likelihood scoring). Together they transform a checklist into a prioritised action plan."
    difficulty: "intermediate"
    tags: ["assessment-vs-matrix"]

  - id: "ch33-06-compliance-risk-012"
    front: "What governance rule applies to all /compliance-check outputs?"
    back: "The agent reviews, triages, drafts, and flags. The licensed attorney advises, decides, and signs. A compliance assessment is a structured starting point for attorney review: it identifies applicable regulations and flags requirements, but the attorney confirms the analysis, verifies regulatory interpretation, and signs off on the compliance plan."
    difficulty: "basic"
    tags: ["governance"]
