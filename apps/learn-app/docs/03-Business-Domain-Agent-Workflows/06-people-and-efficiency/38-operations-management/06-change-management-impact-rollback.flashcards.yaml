deck:
  id: "ch38-06-change-management-impact-rollback"
  title: "Change Management — Impact and Rollback"
  description: "Key concepts and review questions covering change management — impact and rollback."
  tags: ["change", "management", "impact", "rollback", "chapter-38"]
  version: 1

cards:
  - id: "ch38-06-change-management-impact-rollback-001"
    front: "What are the three causes of change failure in operations management?"
    back: "1. Incomplete impact assessment — change assessed in isolation; downstream effects on connected processes, systems, and teams not mapped\n2. Insufficient communication — affected people found out too late, in the wrong format, or not at all; resistance grows from surprise, not the change itself\n3. No rollback plan — when things went wrong, nobody had a structured way to revert; rollback was improvised, creating additional problems\n"
    tags: ["change-failure", "operations-management", "causes"]
    difficulty: "basic"

  - id: "ch38-06-change-management-impact-rollback-002"
    front: "What are the four change classification levels, and what determines the classification?"
    back: "Standard: single team, limited impact, low risk → team lead approval\nSignificant: multiple teams or systems, medium risk → department head approval\nMajor: organisation-wide or multi-department, high risk → exec sponsor/COO approval\nCritical: core business systems or regulatory compliance → board/exec committee\n\nClassification is determined by scope (how much of the organisation is affected)\nand risk (what failure would mean for operations or compliance).\n\nThe most common error is under-classification — assessing a Significant change\nwith Standard-level rigour to move faster.\n"
    tags: ["change-classification", "classification-levels", "determines"]
    difficulty: "basic"

  - id: "ch38-06-change-management-impact-rollback-003"
    front: "What is the integration risk register, and why is it often incomplete?"
    back: "The integration risk register is a structured map of every system connection\nthat a change might disrupt — including: current state, action required to\nmaintain the connection, risk level, owner, and deadline.\n\nIt is often incomplete because the change owner knows their own system,\nnot every system that depends on it. Systems that receive data FROM the\nchanged system, or send data TO it, are both dependencies — and both must\nbe mapped.\n"
    tags: ["integration-risk", "risk-register", "often"]
    difficulty: "basic"

  - id: "ch38-06-change-management-impact-rollback-004"
    front: "What is the difference between a rollback plan and a rollback intention?"
    back: "A rollback intention: 'We will revert if things go wrong.'\n\nA rollback plan answers three specific questions before go-live:\n1. What is 'critical failure'? Defined as observable conditions, not vague judgements.\n2. Who has authority to pull the rollback trigger?\n3. What is actually reversible at each phase — and what is not?\n\nWithout pre-defined trigger criteria, the team faces the decision under pressure\nwith incomplete information, defaulting to waiting and hoping rather than acting.\n"
    tags: ["rollback-plan", "rollback-intention", "difference"]
    difficulty: "intermediate"

  - id: "ch38-06-change-management-impact-rollback-005"
    front: "Why should rollback trigger criteria be defined as observable conditions?"
    back: "Because under pressure, with partial information and high stakes, vague\ncriteria ('if things are bad') produce disagreement, delay, and inaction.\n\nObservable conditions ('finance month-end close cannot be completed' or\n'>30% of users cannot access core functions') have clear answers:\neither the condition is met or it is not. The decision becomes procedural\nrather than a judgment call made under stress.\n"
    tags: ["rollback-trigger", "trigger-criteria", "defined"]
    difficulty: "intermediate"

  - id: "ch38-06-change-management-impact-rollback-006"
    front: "What is the change readiness assessment and why is process readiness typically the lowest dimension?"
    back: "Change readiness has four dimensions:\n- Organisation: change fatigue, sponsor visibility, culture\n- Technology: systems and integrations tested, team has required skills\n- Process: SOPs updated to reflect post-change reality\n- Data: data quality sufficient for migration or new system requirements\n\nProcess readiness is typically lowest because SOPs are often updated\nafter go-live, not before. This means users are executing the new\nprocess without documented procedures — a risk that is rarely planned for.\n"
    tags: ["change-readiness", "readiness-assessment", "process"]
    difficulty: "intermediate"

  - id: "ch38-06-change-management-impact-rollback-007"
    front: "What should a change communication plan include that is often omitted?"
    back: "Most communication plans focus on what to say. The effective ones also specify:\n\n1. What NOT to say — at each milestone, what overclaiming, misleading framing,\n   or missing acknowledgements would create trust deficits\n2. What is being lost — not just what is being gained. Acknowledging the\n   genuine disruption and difficulty reduces resistance more than promising benefits.\n3. Channel-by-audience matching — all-staff email is not appropriate for\n   every message to every audience\n"
    tags: ["change-communication", "communication-plan", "include"]
    difficulty: "basic"

  - id: "ch38-06-change-management-impact-rollback-008"
    front: "How does the change log built in L06 connect to the change-tracker agent in L12?"
    back: "The change-tracker agent monitors the change pipeline built in L06.\nIt flags:\n- Stale approvals (approvals requested but not received)\n- Missing impact assessments (changes logged without assessment)\n- Overdue post-implementation reviews (PIR due date passed)\n- Changes in the pipeline without owners\n\nThe agent converts the manual change log into a continuously monitored\noperational intelligence output.\n"
    tags: ["change-log", "log-built", "connect"]
    difficulty: "intermediate"

  - id: "ch38-06-change-management-impact-rollback-009"
    front: "What is the risk of a Q3 go-live for an ERP migration at a company with December year-end?"
    back: "Q3 (July-September) is the period immediately before December year-end.\nFinance accuracy and system stability are critical during this window —\nfinance teams are preparing for year-end close, setting up reporting,\nand finalising accounts.\n\nA major ERP migration going live in Q3 creates compounding risk:\nthe system is new and unstable precisely when finance processes are\nunder the highest pressure. The standard recommendation is to move\ngo-live to Q2 (before year-end pressure begins) or January\n(after year-end is complete).\n"
    tags: ["erp-migration", "december-year-end", "risk"]
    difficulty: "advanced"

  - id: "ch38-06-change-management-impact-rollback-010"
    front: "How does L06 (change management) forward-connect to L10 (incident management)?"
    back: "The incident examined in L10 was caused by a poorly managed change —\na change that lacked a proper impact assessment and pre-defined rollback\ntriggers. When problems emerged post-go-live, nobody could agree on\nwhat 'bad enough to roll back' meant, so the team waited while impact\naccumulated.\n\nThis is the direct operational consequence of the three change failure\ncauses taught in L06. L10 post-mortem analysis will trace the root cause\nback to the change management failure that created the incident.\n"
    tags: ["l06-change", "change-management", "forward-connect"]
    difficulty: "intermediate"
