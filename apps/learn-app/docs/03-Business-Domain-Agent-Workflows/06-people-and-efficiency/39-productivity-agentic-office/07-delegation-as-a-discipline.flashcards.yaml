deck:
  id: "ch39-07-delegation"
  title: "Delegation as a Discipline"
  description: "Key concepts from the delegation quality standard — the 7-item checklist, delegation record format, handoff calibration, follow-up protocol, and delegation log lifecycle."
  tags: ["delegation", "delegation-quality", "agentic-office", "workplace-context"]
  version: 1

cards:
  - id: "ch39-07-delegation-001"
    front: "What is the core principle of the delegation quality standard?"
    back: "A delegation is only as good as its brief — every missing checklist item becomes a follow-up question the delegatee must ask."
    tags: ["delegation-quality", "core-principle"]
    difficulty: "basic"

  - id: "ch39-07-delegation-002"
    front: "Why does a vague delegation generate more work than doing the task yourself?"
    back: "Each missing element in the brief — deliverable, deadline, context, format — becomes a clarification question. The follow-up cycle, rework, and relationship cost exceeds the original task time in most cases."
    tags: ["delegation-quality", "vague-delegation"]
    difficulty: "intermediate"
    why: "Which checklist item, if missing, generates the most follow-up questions in practice?"

  - id: "ch39-07-delegation-003"
    front: "What are the 7 items in the delegation quality checklist?"
    back: "1. Specific deliverable\n2. Named person\n3. Specific deadline\n4. Context (purpose + audience)\n5. Format specified\n6. Delegatee's preferred style\n7. Follow-up mechanism defined"
    tags: ["delegation-checklist", "quality-standard"]
    difficulty: "basic"

  - id: "ch39-07-delegation-004"
    front: "Why is 'ASAP' an unacceptable delegation deadline?"
    back: "It produces the lowest-priority work on the delegatee's list — they have no anchor for when it is actually needed. A specific date and time is required to communicate urgency accurately."
    tags: ["deadline", "delegation-checklist"]
    difficulty: "intermediate"

  - id: "ch39-07-delegation-005"
    front: "What are the four sections of a delegation record produced by /agentic-office:delegation?"
    back: "Delegated to/by/date/due.\nDeliverable (what, format, length).\nContext (purpose, audience, key question).\nHandoff Communication + Follow-up Plan."
    tags: ["delegation-record", "output-format"]
    difficulty: "basic"

  - id: "ch39-07-delegation-006"
    front: "What four elements of a handoff message does the delegation skill calibrate from the delegatee's work.local.md person entry?"
    back: "Channel (Slack vs email).\nTone and structure (detail level).\nLead time acknowledgement (if they dislike last-minute asks).\nScope specificity (if they push back on open-ended requests)."
    tags: ["handoff-calibration", "person-entry"]
    difficulty: "intermediate"

  - id: "ch39-07-delegation-007"
    front: "The same analytics brief task is delegated to Omar (needs lead time, Slack, specific scope) and to Ayesha (new starter, prefers written briefs, needs context). How do the handoff messages differ?"
    back: "Omar's message: Slack DM, hyper-specific scope, lead time acknowledgement, offer to adjust, same-day confirmation request.\nAyesha's message: Written brief format, structured context about purpose, more background explanation, formal tone."
    tags: ["handoff-calibration", "calibration-comparison"]
    difficulty: "advanced"
    why: "What happens to delegation quality if the skill cannot find a person entry for the delegatee in work.local.md?"

  - id: "ch39-07-delegation-008"
    front: "Why does loading a delegatee's person entry change the delegation message but not the task itself?"
    back: "The task — deliverable, deadline, format, context — is fixed by the work. The person entry calibrates the wrapper: channel, tone, lead time language, scope specificity. Same content, different communication style."
    tags: ["handoff-calibration", "person-entry"]
    difficulty: "intermediate"
    why: "How would you test whether the calibration actually worked for a specific person?"

  - id: "ch39-07-delegation-009"
    front: "What is the confirmation window for a same-week delegation task?"
    back: "Confirmation by EOD the same day the delegation is sent."
    tags: ["confirmation-window", "follow-up-protocol"]
    difficulty: "basic"

  - id: "ch39-07-delegation-010"
    front: "What are the check-in cadences for delegations of different durations?"
    back: "Under 5 days: one check-in at midpoint.\n5–14 days: weekly check-in.\nOver 14 days: bi-weekly check-in."
    tags: ["check-in-cadence", "follow-up-protocol"]
    difficulty: "basic"

  - id: "ch39-07-delegation-011"
    front: "What are the three overdue handling steps for a delegation that has gone late?"
    back: "1 day: polite inquiry — any blockers?\n3 days: explicit conversation — this is affecting [downstream item].\n1 week: flag in digest; consider rerouting or taking back."
    tags: ["overdue-handling", "follow-up-protocol"]
    difficulty: "basic"

  - id: "ch39-07-delegation-012"
    front: "Why is the follow-up protocol described as early warning rather than micromanagement?"
    back: "The protocol catches misunderstandings before they compound — a 24-hour confirmation check costs seconds and surfaces ambiguities when they are still cheap to resolve. Micromanagement controls how work is done; the protocol only confirms it is happening."
    tags: ["follow-up-protocol", "confirmation-window"]
    difficulty: "intermediate"
    why: "At what point in the overdue handling sequence does the interaction shift from early warning to active intervention?"

  - id: "ch39-07-delegation-013"
    front: "What is the delegation log status lifecycle in work.local.md?"
    back: "PENDING CONFIRMATION → IN PROGRESS → COMPLETE or OVERDUE"
    tags: ["delegation-log", "status-lifecycle"]
    difficulty: "basic"

  - id: "ch39-07-delegation-014"
    front: "Why is a delegation not complete when the handoff message is sent?"
    back: "Sent means the message was delivered — not that the deliverable was received or meets the standard. The log stays open until the output is received and verified. 'Sent' and 'done' are different states."
    tags: ["delegation-log", "completion-definition"]
    difficulty: "intermediate"
    why: "What specific risk does closing a delegation at 'sent' create for the delegator?"

  - id: "ch39-07-delegation-015"
    front: "A delegation comes back with three clarifying questions. Which checklist item does each question most likely map to?"
    back: "Questions about scope → missing specific deliverable or format.\nQuestions about urgency → missing firm deadline.\nQuestions about purpose → missing context (why this matters, who sees it)."
    tags: ["delegation-checklist", "retrospective"]
    difficulty: "intermediate"
    why: "How would you rewrite the original delegation brief to eliminate all three questions before sending?"

  - id: "ch39-07-delegation-016"
    front: "Why must delegation always be to one named person rather than to 'the team'?"
    back: "One person must be accountable for the delivery. When a group is named, each member assumes another will take it — accountability diffuses and nothing is delivered."
    tags: ["delegation-checklist", "accountability"]
    difficulty: "intermediate"
    why: "How would you handle a delegation that genuinely requires multiple contributors?"

  - id: "ch39-07-delegation-017"
    front: "What command generates a delegation record with a calibrated handoff message in the agentic office system?"
    back: "/agentic-office:delegation"
    tags: ["delegation-command", "agentic-office"]
    difficulty: "intermediate"
