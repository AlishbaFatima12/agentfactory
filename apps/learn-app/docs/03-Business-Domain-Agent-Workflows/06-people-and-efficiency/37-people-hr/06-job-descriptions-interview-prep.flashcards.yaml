deck:
  id: "ch37-06-job-descriptions-interview-prep"
  title: "Job Descriptions Interview Prep"
  version: 1

cards:
  - front: "What are the four JD principles in order?"
    back: "1. Candidate perspective first (write 'you will', not 'responsible for'). 2. Lead with the work, not the requirements. 3. Calibrate requirements ruthlessly (Essential vs Beneficial, max 5 essential). 4. Inclusive language by default (apply the check automatically)"

  - front: "What is the Essential vs Beneficial test for JD requirements?"
    back: "Could a highly capable candidate do this job well without this? If yes: Beneficial. If no: Essential. Most JDs list 15 'essential' requirements — most have 3-5 genuine ones."

  - front: "What four categories does the /jd inclusive language check flag?"
    back: "Gender-coded masculine terms (rockstar, ninja, dominate), age-coded language (young and dynamic, digital native), experience specificity ('5 years of Python' instead of 'Python proficiency'), and culture-coded terms ('culture fit' without defined behaviours)"

  - front: "Which plugin provides /jd and which provides /interview-prep?"
    back: "/jd is the custom hr-operations plugin (Panaversity). /interview-prep is the official human-resources plugin (Anthropic). They work together as a hiring workflow: /jd writes the JD, /interview-prep maps it to interview competencies."

  - front: "What is a structured interview, and why does it reduce bias?"
    back: "A structured interview uses the same questions in the same order for every candidate, with scores recorded against a defined rubric before group discussion. It reduces bias by preventing different questions for different candidates and requiring evidence-based scoring rather than 'gut feeling'"

  - front: "What is competency mapping in interview preparation?"
    back: "Linking each essential JD requirement to an assessable interview competency — ensuring the interview tests exactly what the JD promised. The cross-check: every interview question maps to a JD requirement, and every JD essential requirement has at least one interview question."

  - front: "What does a 1-4 interview scoring rubric require at each level?"
    back: "Described observable behaviour at each score level — not just numbers. Level 4 describes what exceeds expectations looks like; Level 1 describes what below expectations looks like — both in terms of specific behaviours an interviewer can observe and record"

  - front: "Why is '/jd' mandatory for listing a salary range?"
    back: "Listing 'competitive' instead of a range is the most effective way to deter good candidates — it signals the organisation is hiding the number, which typically means it is below market. /jd will not produce a JD with 'competitive' — a range is mandatory output."

  - front: "What debrief structure prevents anchoring in hiring decisions?"
    back: "Interviewers record their scores and supporting evidence independently before the debrief discussion. Discussing scores before independent recording causes anchoring — later scores cluster toward the first score shared, regardless of the interviewer's actual assessment."

  - front: "What is the most common alignment failure between JD and interview process?"
    back: "The interview tests competencies not mentioned in the JD, and vice versa — requirements in the JD have no corresponding interview question. This signals organisational confusion about what the role actually needs and creates an inconsistent candidate experience."
