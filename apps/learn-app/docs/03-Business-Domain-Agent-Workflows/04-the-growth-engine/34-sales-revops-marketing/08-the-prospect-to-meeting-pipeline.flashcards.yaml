deck:
  id: "ch23-08-pipeline"
  title: "The Prospect-to-Meeting Pipeline"
  description: "End-to-end pipeline execution, config quality amplification, and time-value comparison"
  tags: ["sales", "revops", "marketing", "chapter-23", "pipeline"]
  version: 1

cards:
  - id: "ch23-08-pipeline-001"
    front: "What are the six stages of the prospect-to-meeting pipeline, in order?"
    back: "1. Research\n2. Score\n3. Outreach\n4. Sequence\n5. Pre-call brief\n6. Follow-up"
    difficulty: "basic"
    tags: ["pipeline-stages"]

  - id: "ch23-08-pipeline-002"
    front: "Why does a weak ICP produce inflated lead scores that destroy signal value?"
    back: "A weak ICP has no filtering criteria, so every prospect matches on every dimension. Scores become meaningless because nothing is filtered out — a 95/100 tells you nothing when everyone scores 95."
    difficulty: "intermediate"
    why: "How would you detect that your ICP is too broad from scoring output alone?"
    tags: ["config-amplification"]

  - id: "ch23-08-pipeline-003"
    front: "Which pipeline stage is the first to degrade when the ICP is weak, and which stage is unaffected?"
    back: "Scoring (Stage 2) is the first to degrade because it references the ICP directly. Research (Stage 1) is unaffected because prospect-research does not reference the ICP."
    difficulty: "intermediate"
    tags: ["config-amplification"]

  - id: "ch23-08-pipeline-004"
    front: "In the pipeline, what three dimensions does the lead-scoring skill evaluate?"
    back: "Fit, Timing, and Engagement."
    difficulty: "basic"
    tags: ["lead-scoring"]

  - id: "ch23-08-pipeline-005"
    front: "How long does the AI-assisted pipeline take for a single prospect compared to Farah's manual workflow?"
    back: "AI-assisted: ~10 minutes.\nManual (Farah): ~2 hours 45 minutes."
    difficulty: "basic"
    tags: ["time-comparison"]

  - id: "ch23-08-pipeline-006"
    front: "A rep runs the pipeline in 9 minutes with output quality matching Ahmed's. Why is speed alone not the value proposition?"
    back: "Ahmed's 9-minute approach skips most stages, producing generic output with no competitive advantage. The pipeline's value is Farah-quality depth in Ahmed's timeframe — speed plus quality, not speed alone."
    difficulty: "advanced"
    why: "What determines whether speed gains translate to better sales outcomes?"
    tags: ["time-comparison"]

  - id: "ch23-08-pipeline-007"
    front: "What does the pipeline quality scorecard use to rate each stage's output?"
    back: "Three ratings: READY, NEEDS EDITING, or REDO."
    difficulty: "basic"
    tags: ["quality-scorecard"]

  - id: "ch23-08-pipeline-008"
    front: "Why does personalisation decay across a six-touch outreach sequence signal a pipeline problem?"
    back: "Personalisation decay means later touches become generic templates because upstream research intelligence was not carried forward. This is a form of Context Loss — the data existed but was not used in downstream stages."
    difficulty: "intermediate"
    why: "What operational step prevents personalisation decay across a sequence?"
    tags: ["context-loss"]

  - id: "ch23-08-pipeline-009"
    front: "What is config quality amplification in the context of the prospect-to-meeting pipeline?"
    back: "A strong config at the top produces specific, actionable output at every stage. A weak config produces generic output that degrades at every downstream stage. The pipeline amplifies whatever you feed it."
    difficulty: "intermediate"
    why: "Why is ICP calibration considered the most important lesson in the chapter?"
    tags: ["config-amplification"]

  - id: "ch23-08-pipeline-010"
    front: "In Crescent Freight's pipeline run, Engagement scored 18/30. How does low Engagement change the outreach strategy?"
    back: "Low Engagement means the prospect is not looking for you. Outreach must work harder to establish relevance, because there is no inbound signal to build on."
    difficulty: "intermediate"
    tags: ["engagement-scoring"]

  - id: "ch23-08-pipeline-011"
    front: "What four things should you check in a research brief before moving to scoring?"
    back: "1. Primary buyer identification\n2. Unverifiable financial claims\n3. Technology signals\n4. Timing signals"
    difficulty: "intermediate"
    tags: ["research-review"]

  - id: "ch23-08-pipeline-012"
    front: "Why does the pre-call brief feel like a document prepared by someone following the prospect for weeks?"
    back: "The brief assembles accumulated intelligence from all upstream stages — research context, scoring rationale, outreach history, and engagement signals — converging into one preparation document."
    difficulty: "intermediate"
    why: "What would the brief look like if Stage 1 research was thin?"
    tags: ["pre-call-brief"]

  - id: "ch23-08-pipeline-013"
    front: "What is the Context Loss test for follow-up emails from Lesson 7?"
    back: "Check whether the follow-up references specific conversation points or defaults to a generic template."
    difficulty: "basic"
    tags: ["context-loss"]

  - id: "ch23-08-pipeline-014"
    front: "A pipeline produces READY output at every stage. What does this reveal about the upstream configuration?"
    back: "The ICP, brand voice, and competitive intelligence are well-calibrated. READY output at every stage means the config is feeding specific, actionable data that each skill can use effectively."
    difficulty: "advanced"
    why: "If a pipeline produces mostly REDO output, where should you investigate first?"
    tags: ["quality-scorecard"]

  - id: "ch23-08-pipeline-015"
    front: "After running the weak-ICP comparison, what must you do immediately?"
    back: "Restore sales-marketing.local.md to the validated ICP from Lesson 2."
    difficulty: "basic"
    tags: ["config-restore"]

  - id: "ch23-08-pipeline-016"
    front: "Why does comparing Meridian Logistics (score 94) to Crescent Freight (score 76) illustrate how Engagement affects pipeline difficulty?"
    back: "Meridian already had a meeting booked (high Engagement), making the pipeline easier. Crescent had no inbound signal (low Engagement), requiring outreach to create engagement from scratch — a harder pipeline to execute."
    difficulty: "advanced"
    why: "How would you prioritise pipeline execution between a high-Engagement and low-Engagement prospect?"
    tags: ["engagement-scoring"]
