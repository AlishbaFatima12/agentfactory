deck:
  id: "ch34-03-lead-scoring"
  title: "Lead Scoring"
  description: "Three-dimension scoring model, classification tiers, miscalibrated scoring, and routing rules"
  tags: ["sales", "revops", "marketing", "chapter-34"]
  version: 1

cards:
  - id: "ch34-03-lead-scoring-001"
    front: "What are the three dimensions of the lead scoring model and their point allocations?"
    back: "Fit (0-40), Timing (0-40), Engagement (0-20). Total: 0-100."
    difficulty: "basic"
    tags: ["scoring-model"]

  - id: "ch34-03-lead-scoring-002"
    front: "Why do Fit and Timing each carry 40 points while Engagement carries only 20?"
    back: "Fit and Timing are deal-breakers that you cannot easily change. Engagement carries less weight because it is the dimension you can influence most directly through outreach and marketing."
    difficulty: "intermediate"
    tags: ["scoring-weights"]

  - id: "ch34-03-lead-scoring-003"
    front: "What are the four classification tiers and their total score ranges?"
    back: "HOT (75-100), WARM (55-74), CULTIVATE (35-54), NOT YET (0-34)"
    difficulty: "basic"
    tags: ["classification-tiers"]

  - id: "ch34-03-lead-scoring-004"
    front: "A 15-person startup scored 78 on a single-dimension engagement-heavy model, then churned within two months. What went wrong?"
    back: "The single-dimension model could not distinguish interest from ability to buy. High engagement masked terrible fit: because downloading whitepapers and attending webinars do not indicate budget, team size, or implementation capacity."
    difficulty: "intermediate"
    why: "How does the three-dimension model prevent this exact failure?"
    tags: ["single-dimension-failure"]

  - id: "ch34-03-lead-scoring-005"
    front: "Three prospects each score 72/100. Prospect A has Fit 35 + Timing 35 + Engagement 2. What action does the dimension breakdown recommend?"
    back: "Awareness campaign. Great company with great timing but zero engagement: they have never heard of you."
    difficulty: "intermediate"
    tags: ["dimension-breakdown"]

  - id: "ch34-03-lead-scoring-006"
    front: "What dimension requirements must a HOT lead meet beyond a 75+ total score?"
    back: "Fit >= 25 AND Timing >= 25."
    difficulty: "basic"
    tags: ["classification-tiers"]

  - id: "ch34-03-lead-scoring-007"
    front: "Falcon Logistics matched NexaFlow's ICP perfectly but scored 22 on the old system and was ignored for six months. What signals did the old system miss?"
    back: "Timing signals visible in public data: a new COO hire, LinkedIn posts about efficiency, and investment filings. The old system only measured engagement and could not detect buying intent from external signals."
    difficulty: "intermediate"
    why: "What revenue did NexaFlow lose by ignoring a perfect-fit company for six months?"
    tags: ["single-dimension-failure"]

  - id: "ch34-03-lead-scoring-008"
    front: "What is Miscalibrated Scoring as an agent error type?"
    back: "The model weights a scoring dimension incorrectly, producing a classification that contradicts expert judgment."
    difficulty: "basic"
    tags: ["miscalibrated-scoring"]

  - id: "ch34-03-lead-scoring-009"
    front: "Al-Safa's vendor shut down with 30 days notice, but the model scored this the same as a routine system upgrade. Why is this a miscalibration?"
    back: "A forced replacement creates emergency procurement with a hard deadline, fundamentally different from a planned evaluation. The model treated both as equivalent timing signals: because it lacked a distinction between voluntary evaluation and forced replacement."
    difficulty: "advanced"
    why: "What other timing signals might need urgency sub-categories in your scoring model?"
    tags: ["miscalibrated-scoring"]

  - id: "ch34-03-lead-scoring-010"
    front: "What is the correct response when the scoring model contradicts your best rep's judgment?"
    back: "Trace the gap to a specific underweighted dimension, adjust the scoring weights, and re-score to verify the correction."
    difficulty: "intermediate"
    tags: ["calibration-fix"]

  - id: "ch34-03-lead-scoring-011"
    front: "In the routing rules, why should HOT prospects go to the best rep rather than being distributed equally?"
    back: "Equal distribution sounds fair but costs revenue. The best rep converts at a higher rate, so HOT leads allocated to them maximise close probability."
    difficulty: "intermediate"
    tags: ["routing-rules"]

  - id: "ch34-03-lead-scoring-012"
    front: "What is the SLA for HOT leads in the routing rules?"
    back: "Contact within 24 hours."
    difficulty: "basic"
    tags: ["routing-rules"]

  - id: "ch34-03-lead-scoring-013"
    front: "Why should NOT YET prospects receive zero rep time instead of occasional check-ins?"
    back: "Quarterly re-scoring catches any circumstance changes. Until then, rep time on sub-34 prospects is a misallocation that diverts effort from higher-scoring opportunities."
    difficulty: "intermediate"
    why: "How would you convince a rep to stop 'keeping the relationship warm' with a NOT YET prospect?"
    tags: ["routing-rules"]

  - id: "ch34-03-lead-scoring-014"
    front: "What action do routing rules assign to WARM (55-74) prospects?"
    back: "Nurture sequence with personalisation, first touch within 3 days."
    difficulty: "basic"
    tags: ["routing-rules"]

  - id: "ch34-03-lead-scoring-015"
    front: "Why is the dimension breakdown more useful than the composite score for deciding next steps?"
    back: "The composite score tells you where to look. The dimension breakdown tells you what to do: because the same total from different dimension combinations requires completely different actions."
    difficulty: "intermediate"
    why: "What would go wrong if a rep only saw composite scores without the breakdown?"
    tags: ["dimension-breakdown"]

  - id: "ch34-03-lead-scoring-016"
    front: "A prospect scores Fit 30, Timing 10, Engagement 32. What does the low Timing dimension indicate?"
    back: "The right company at the wrong moment. Monitor for trigger events rather than pursuing immediate outreach."
    difficulty: "intermediate"
    tags: ["dimension-diagnosis"]
