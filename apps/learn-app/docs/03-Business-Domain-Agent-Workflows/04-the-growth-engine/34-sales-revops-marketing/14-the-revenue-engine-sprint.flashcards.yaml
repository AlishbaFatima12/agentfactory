deck:
  id: "ch34-14-sprint"
  title: "The Revenue Engine Sprint"
  description: "Capstone sprint execution, Agent Output Taxonomy errors, and revenue engine transferability"
  tags: ["sales", "revops", "marketing", "chapter-34", "sprint", "capstone"]
  version: 1

cards:
  - id: "ch34-14-sprint-001"
    front: "What are the three parts of the revenue engine sprint?"
    back: "Part A: Research-to-meeting pipeline (5 prospects).\nPart B: Campaign brief + content calendar.\nPart C: Revenue dashboard."
    difficulty: "basic"
    tags: ["sprint-structure"]

  - id: "ch34-14-sprint-002"
    front: "What are the four required exercises in the Minimum Viable Capstone?"
    back: "1. Validate ICP (Exercise 1)\n2. Research and outreach sprint (Exercise 2)\n3. Full campaign brief (Exercise 4)\n4. RevOps dashboard (Exercise 7)"
    difficulty: "basic"
    tags: ["minimum-viable"]

  - id: "ch34-14-sprint-003"
    front: "Why should all five closed-won deals score above 60 when validating the ICP?"
    back: "They already bought — if the ICP scores them below 60, the scoring model penalises a dimension that does not predict buying behaviour. This is Miscalibrated Scoring: the model has drifted from reality."
    difficulty: "intermediate"
    why: "How would you recalibrate without loosening criteria so broadly that poor-fit companies also pass?"
    tags: ["miscalibrated-scoring"]

  - id: "ch34-14-sprint-004"
    front: "What are the five Agent Output Taxonomy error types?"
    back: "1. Hallucinated Data\n2. Miscalibrated Scoring\n3. Over-Automation\n4. Compliance Gap\n5. Context Loss"
    difficulty: "basic"
    tags: ["error-taxonomy"]

  - id: "ch34-14-sprint-005"
    front: "A campaign brief allocates $8,000 to a logistics trade show, but the actual booth cost is unknown. What Agent Output Taxonomy error is this?"
    back: "Hallucinated Data — the budget figure is fabricated. Every downstream decision built on that allocation inherits the error."
    difficulty: "intermediate"
    tags: ["hallucinated-data"]

  - id: "ch34-14-sprint-006"
    front: "Why does the sprint require flagging errors during live execution rather than in post-hoc review?"
    back: "In live execution, errors compound across stages — a hallucinated research finding contaminates the score, which contaminates the outreach. Catching errors in real time prevents downstream corruption that post-hoc review cannot undo."
    difficulty: "intermediate"
    why: "How does the cost of an error change depending on which pipeline stage it is caught in?"
    tags: ["error-detection"]

  - id: "ch34-14-sprint-007"
    front: "Touches 4-6 in a sequence become generic while Touches 1-3 reference specific research. What error is this?"
    back: "Context Loss — the research intelligence was consumed by early touches and not replenished for later ones, causing personalisation decay across the sequence."
    difficulty: "intermediate"
    tags: ["context-loss"]

  - id: "ch34-14-sprint-008"
    front: "How do you determine which revenue engine components are universal versus business-specific when transferring to a new industry?"
    back: "Universal: Five Laws, three-dimension scoring structure, pipeline stages, dashboard architecture. Business-specific: ICP criteria, compliance framework, content formats, research data sources."
    difficulty: "intermediate"
    why: "Why do the scoring dimensions (Fit, Timing, Engagement) transfer but the criteria within each dimension do not?"
    tags: ["transferability"]

  - id: "ch34-14-sprint-009"
    front: "What is the time target for the full sprint, and how does it break down across the three parts?"
    back: "45 minutes total. Part A (research-to-meeting): 15 minutes. Part B (campaign + calendar): 10 minutes. Part C (dashboard): 5 minutes. Remaining time for bonus exercises."
    difficulty: "basic"
    tags: ["sprint-timing"]

  - id: "ch34-14-sprint-010"
    front: "A call summary reads 'Great meeting, they have budget and a timeline' without referencing specific pain points or the champion name from research. What error is this?"
    back: "Context Loss — the intelligence from the research brief existed but the summary did not use it, producing a generic output instead of one grounded in upstream data."
    difficulty: "intermediate"
    tags: ["context-loss"]

  - id: "ch34-14-sprint-011"
    front: "What is the division of labour that runs through every lesson in Chapter 34?"
    back: "The agent researches, drafts, and recommends. The sales professional decides and sends."
    difficulty: "basic"
    tags: ["division-of-labour"]

  - id: "ch34-14-sprint-012"
    front: "Why does the gap between first and second sprint runs measure setup versus execution?"
    back: "First run includes ICP configuration, tool familiarisation, and error calibration. Second run uses a tuned ICP and familiar pipeline, so the time difference reveals how much was setup (one-time cost) versus execution (recurring cost)."
    difficulty: "advanced"
    why: "What setup investments have the highest impact on reducing sprint execution time?"
    tags: ["sprint-timing"]

  - id: "ch34-14-sprint-013"
    front: "A sequence has no exit conditions and sends Touch 5 after the prospect replied 'not interested' to Touch 3. What error is this?"
    back: "Over-Automation — the sequence continued past a negative human signal because no stop rules were defined. Exit conditions for reply, bounce, and opt-out are required."
    difficulty: "intermediate"
    tags: ["over-automation"]

  - id: "ch34-14-sprint-014"
    front: "What makes the revenue engine a sellable product for agencies and consultancies?"
    back: "Configure it for a client's ICP, connect to their CRM, tune the thresholds, and the engine runs. The plugins provide capability; configuration and diagnostic skill provide the value."
    difficulty: "intermediate"
    why: "What differentiates a revenue engine configured by an expert from one set up with default settings?"
    tags: ["sellable-product"]

  - id: "ch34-14-sprint-015"
    front: "Why is audience sizing in a campaign brief a Hallucinated Data risk?"
    back: "If the brief claims '2,400 VP Operations across three markets' without sourcing the number, CPL projections are built on fabricated denominators. LinkedIn Sales Navigator can verify; unsourced numbers cannot be trusted."
    difficulty: "advanced"
    why: "What downstream calculations break when the audience size is wrong?"
    tags: ["hallucinated-data"]

  - id: "ch34-14-sprint-016"
    front: "The sprint uses NexaFlow's clean demo pipeline. How does running against real data reveal engine fragility?"
    back: "Real pipelines have missing data, inconsistent formatting, and deals that defy standard stage progressions. Components that work with clean data but break with messy inputs reveal where the engine needs hardening — that fragility map becomes the improvement roadmap."
    difficulty: "advanced"
    why: "Which revenue engine components are most likely to be fragile when faced with real data?"
    tags: ["real-data"]
