deck:
  id: "ch34-06-sequences"
  title: "Multi-Touch Sequences and Follow-Up"
  description: "6-touch sequence design, personalisation decay, Over-Automation error type, sales vs marketing sequences, and exit conditions"
  tags: ["sales", "revops", "marketing", "chapter-34"]
  version: 1

cards:
  - id: "ch34-06-sequences-001"
    front: "What response rate does a single-touch outreach earn versus a well-constructed 6-touch sequence?"
    back: "Single-touch: ~5%. Six-touch sequence: 25-35%."
    difficulty: "basic"
    tags: ["sequence-effectiveness"]

  - id: "ch34-06-sequences-002"
    front: "What is the standard structure of a multi-touch outreach sequence in this lesson?"
    back: "6 touches across 21 days, mixing email and LinkedIn channels."
    difficulty: "basic"
    tags: ["sequence-structure"]

  - id: "ch34-06-sequences-003"
    front: "Why does each touch in a 6-touch sequence need to add something new rather than repeating the same message?"
    back: "Repetition signals that the sender has nothing more to offer. Each new value-add (case study, data point, diagnostic question) earns attention cumulatively: because the prospect replies when the accumulated value exceeds the cost of responding."
    difficulty: "intermediate"
    why: "At which touch in the Meridian sequence does new value become hardest to generate, and what does that tell you?"
    tags: ["sequence-value"]

  - id: "ch34-06-sequences-004"
    front: "What is personalisation decay in outreach sequences?"
    back: "The gradual loss of prospect-specific references as a sequence progresses, caused by the research brief's finite material being exhausted across earlier touches."
    difficulty: "intermediate"
    tags: ["personalisation-decay"]

  - id: "ch34-06-sequences-005"
    front: "What is Over-Automation as an agent error type?"
    back: "The agent continues executing when it should pause for human judgment, producing output whose quality has degraded below the threshold where sending it helps the relationship."
    difficulty: "intermediate"
    tags: ["over-automation"]

  - id: "ch34-06-sequences-006"
    front: "A sequence's Touch 5 recycles a data point from Touch 2 instead of adding new research. Why is this a signal to intervene?"
    back: "Recycled personalisation tells the prospect the sender has run out of things to say and is letting a machine keep talking. The fix is adding fresh research: a new LinkedIn post, conference talk, or mutual connection: not deleting the touch."
    difficulty: "advanced"
    why: "How would you decide whether to enhance Touch 5 with new research or end the sequence at Touch 4?"
    tags: ["personalisation-decay"]

  - id: "ch34-06-sequences-007"
    front: "What role does Touch 6 serve in the Meridian sequence?"
    back: "A graceful close that stops outreach, leaves the door open for future contact, and protects the relationship."
    difficulty: "basic"
    tags: ["sequence-structure"]

  - id: "ch34-06-sequences-008"
    front: "How does a sales sequence differ from a marketing sequence in personalisation depth?"
    back: "A sales sequence references one specific person's situation: swapping the name breaks every touch. A marketing sequence addresses a segment with shared experiences and works for any member of that segment."
    difficulty: "intermediate"
    tags: ["sales-vs-marketing"]

  - id: "ch34-06-sequences-009"
    front: "Name any 4 of the 6 exit conditions that should stop an outreach sequence."
    back: "Any 4 from: Reply, Email bounce, Unsubscribe/stop, No response after 6 touches, Out-of-office reply, Prospect forwards to colleague."
    difficulty: "intermediate"
    tags: ["exit-conditions"]

  - id: "ch34-06-sequences-010"
    front: "Why must a sequence stop immediately when a prospect replies 'stop' or unsubscribes?"
    back: "Continuing after an explicit opt-out is both unprofessional and, in most jurisdictions, illegal."
    difficulty: "basic"
    tags: ["exit-conditions"]

  - id: "ch34-06-sequences-011"
    front: "After 6 touches with zero response, what is the recommended cool-off period before re-sequencing?"
    back: "90 days. Re-sequencing sooner feels like harassment."
    difficulty: "basic"
    tags: ["exit-conditions"]

  - id: "ch34-06-sequences-012"
    front: "Why is sending Sarah Chen the same generic nurture email that 500 trial users receive a mistake?"
    back: "It signals you did not do the research that earned her attention. A marketing sequence sent to a researched prospect contradicts the personalisation the relationship was built on: because it reveals that the earlier personalised outreach was a one-time effort, not ongoing attention."
    difficulty: "advanced"
    why: "What would Sarah conclude about NexaFlow's research capabilities if she received a generic email after four personalised touches?"
    tags: ["sales-vs-marketing"]

  - id: "ch34-06-sequences-013"
    front: "What triggers a sales sequence versus a marketing sequence?"
    back: "Sales sequence: rep-initiated based on individual prospect research. Marketing sequence: lifecycle event (sign-up, webinar attendance, download)."
    difficulty: "intermediate"
    tags: ["sales-vs-marketing"]

  - id: "ch34-06-sequences-014"
    front: "When a prospect replies during a sequence, what replaces the remaining automated touches?"
    back: "The follow-up skill takes over, generating a context-aware response that references the conversation history from the sequence."
    difficulty: "intermediate"
    tags: ["follow-up"]

  - id: "ch34-06-sequences-015"
    front: "How does a context-aware follow-up differ from a generic one after a prospect replies?"
    back: "The context-aware follow-up references specific conversation points (case studies shared, questions discussed). A generic follow-up could be sent to anyone and erases 21 days of relationship-building."
    difficulty: "intermediate"
    tags: ["follow-up"]

  - id: "ch34-06-sequences-016"
    front: "What should happen when a prospect forwards your message to a colleague?"
    back: "Pause the sequence, re-research the new stakeholder, and rebuild a fresh sequence tailored to the colleague's role."
    difficulty: "intermediate"
    tags: ["exit-conditions"]
