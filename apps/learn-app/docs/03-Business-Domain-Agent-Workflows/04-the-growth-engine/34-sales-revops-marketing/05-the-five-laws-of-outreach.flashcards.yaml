deck:
  id: "ch34-05-five-laws"
  title: "The Five Laws of Outreach"
  description: "Five Laws framework, word limits by channel, banned jargon, law-by-law audit, and Compliance Gap error type"
  tags: ["sales", "revops", "marketing", "chapter-34"]
  version: 1

cards:
  - id: "ch34-05-five-laws-001"
    front: "What are the Five Laws of Outreach?"
    back: "1. Specific Verifiable Reference\n2. Lead with Prospect\n3. One Ask\n4. Hard Word Limits\n5. Zero Jargon"
    difficulty: "basic"
    tags: ["five-laws"]

  - id: "ch34-05-five-laws-002"
    front: "What is the diagnostic question for Law 1 (Specific Verifiable Reference)?"
    back: "Can the prospect verify this reference in under 30 seconds?"
    difficulty: "basic"
    tags: ["law-1"]

  - id: "ch34-05-five-laws-003"
    front: "Ahmed sends 40 LinkedIn messages a week at 2% reply rate. Farah sends 8 at 35%. What explains the difference?"
    back: "Farah follows five practices Ahmed does not: verified specific references, prospect-first framing, single ask, brevity, and jargon-free language. The gap is message quality, not volume: because 8 personalised messages outperform 40 templates."
    difficulty: "intermediate"
    why: "Why does increasing Ahmed's volume to 80 messages per week not solve his reply rate problem?"
    tags: ["outreach-quality"]

  - id: "ch34-05-five-laws-004"
    front: "What are the hard word limits for cold email, LinkedIn DM, and WhatsApp B2B?"
    back: "Cold email: 150 words\nLinkedIn DM: 100 words\nWhatsApp B2B: 75 words"
    difficulty: "intermediate"
    tags: ["law-4"]

  - id: "ch34-05-five-laws-005"
    front: "Why does Law 2 require the first sentence to be about the prospect, not your product?"
    back: "Inbox scanning takes 3-7 seconds. A sentence about the prospect triggers 'someone who understands my business.' A sentence about you triggers 'another vendor pitch': and the message gets deleted."
    difficulty: "intermediate"
    tags: ["law-2"]

  - id: "ch34-05-five-laws-006"
    front: "An outreach message contains three asks: a call, a whitepaper, and a conference meetup. Why does Law 3 flag this?"
    back: "Every additional ask reduces the probability of response. One clear ask gives the prospect one binary decision. Multiple asks create decision paralysis."
    difficulty: "intermediate"
    tags: ["law-3"]

  - id: "ch34-05-five-laws-007"
    front: "Name any 5 of the 17 banned words in Law 5 (Zero Jargon)."
    back: "Any 5 from: synergy, leverage, paradigm, holistic, scalable, best-in-class, world-class, cutting-edge, next-generation, disruptive, innovative, groundbreaking, seamless, robust, ecosystem, unlock, empower."
    difficulty: "basic"
    tags: ["law-5"]

  - id: "ch34-05-five-laws-008"
    front: "What is the 'grandmother test' for Law 5?"
    back: "Read the message aloud. Every time you hit a word that would confuse a non-technical person, stop and replace it with a concrete description."
    difficulty: "basic"
    tags: ["law-5"]

  - id: "ch34-05-five-laws-009"
    front: "An outreach message for a Karachi prospect passes all Five Laws but uses formal British English, a UK case study reference, and LinkedIn DM as the channel. What error type is this?"
    back: "Compliance Gap: the message content is high quality by the laws' standards but is culturally mismatched for the recipient's market."
    difficulty: "intermediate"
    tags: ["compliance-gap"]

  - id: "ch34-05-five-laws-010"
    front: "Why is the Compliance Gap described as the most dangerous of the agent error types?"
    back: "It is invisible to content-level review. A message can pass all five laws and still be wrong to send: because cultural and legal compliance operates on a different dimension than content quality."
    difficulty: "advanced"
    why: "How would you build a systematic check for Compliance Gaps into your outreach review process?"
    tags: ["compliance-gap"]

  - id: "ch34-05-five-laws-011"
    front: "What are the three agent error types discovered before this lesson?"
    back: "Hallucinated Data (L01), Miscalibrated Scoring (L03), and Compliance Gap is added in this lesson."
    difficulty: "basic"
    tags: ["error-taxonomy"]

  - id: "ch34-05-five-laws-012"
    front: "A cold email opens with 'At NexaFlow Technologies, we help companies like yours scale logistics operations.' Which law does this violate and why?"
    back: "Law 2 (Lead with Prospect). The first word is the sender's company name: the entire sentence is about the seller, dressed up to look like it is about the prospect."
    difficulty: "intermediate"
    tags: ["law-2"]

  - id: "ch34-05-five-laws-013"
    front: "Why is the word 'seamless' banned from outreach?"
    back: "Nothing is seamless, and prospects know this. It erodes credibility. The fix is to name the specific integration points."
    difficulty: "intermediate"
    tags: ["law-5"]

  - id: "ch34-05-five-laws-014"
    front: "Why do word limits function as a proxy for respect in outreach?"
    back: "A 400-word cold email says 'I value my message more than your time.' A 150-word email says 'I distilled this because your attention is scarce': brevity signals that you prioritise the recipient's time over your own talking points."
    difficulty: "intermediate"
    why: "How does the word limit change between a cold email and a warm email, and why?"
    tags: ["law-4"]

  - id: "ch34-05-five-laws-015"
    front: "What should you do when an agent-generated outreach message passes all Five Laws but is culturally wrong for the prospect's market?"
    back: "Run a separate compliance audit checking tone, channel, cultural framing, and legal requirements for the recipient's jurisdiction: then revise or rebuild the message."
    difficulty: "advanced"
    why: "Why can't the Five Laws themselves catch cultural mismatches?"
    tags: ["compliance-gap"]

  - id: "ch34-05-five-laws-016"
    front: "What is the word limit for a follow-up email?"
    back: "100 words."
    difficulty: "basic"
    tags: ["law-4"]
