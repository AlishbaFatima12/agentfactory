deck:
  id: "ch34-09-content-brand"
  title: "Content Creation and Brand Voice"
  description: "Brand voice configuration, cornerstone content, content multiplication, and interactive sales assets"
  tags: ["sales", "revops", "marketing", "chapter-34", "content"]
  version: 1

cards:
  - id: "ch34-09-content-brand-001"
    front: "What is a cornerstone article in content marketing?"
    back: "The single source piece of thinking that feeds every distribution channel."
    difficulty: "basic"
    tags: ["cornerstone-content"]

  - id: "ch34-09-content-brand-002"
    front: "What three parameters define NexaFlow's brand voice configuration?"
    back: "1. Tone (direct, practical, operator-level)\n2. Content pillars (3 topics)\n3. Persona-specific voice (VP Ops, CFO, CEO)"
    difficulty: "basic"
    tags: ["brand-voice"]

  - id: "ch34-09-content-brand-003"
    front: "Why should you iterate on the brand voice config rather than the article when tone feels too generic?"
    back: "The article is a symptom of the config. Fixing the article produces one better piece; fixing the config improves every future asset generated from it."
    difficulty: "intermediate"
    why: "How would you diagnose whether a tone problem is a config issue or a one-off generation issue?"
    tags: ["brand-voice"]

  - id: "ch34-09-content-brand-004"
    front: "What does the /brand-review command evaluate?"
    back: "Brand consistency, tone alignment, pillar coverage, and persona match."
    difficulty: "basic"
    tags: ["brand-review"]

  - id: "ch34-09-content-brand-005"
    front: "What consistency score should the cornerstone article reach before content multiplication?"
    back: "Above 90 on the /brand-review scale."
    difficulty: "basic"
    tags: ["brand-review-threshold"]

  - id: "ch34-09-content-brand-006"
    front: "How does the /seo-audit command check an article's discoverability?"
    back: "It evaluates primary keyword placement, keyword density, readability (Flesch-Kincaid), heading structure, and meta description quality."
    difficulty: "intermediate"
    tags: ["seo-audit"]

  - id: "ch34-09-content-brand-007"
    front: "Why do short-form assets like ad copy and subject lines lose brand nuance during content multiplication?"
    back: "Compression strips context. A 15-word headline cannot carry the same operator depth as a 1,200-word article, so brand-specific tone gets lost when content is compressed."
    difficulty: "intermediate"
    why: "What strategy compensates for brand voice loss in short-form content?"
    tags: ["content-multiplication"]

  - id: "ch34-09-content-brand-008"
    front: "Name any 4 of the 10 derivative asset types in the content multiplication tree?"
    back: "CEO social posts, newsletter excerpt, social media carousel, cold email hook, sales one-pager, ad copy, email subject lines, webinar outline, FAQ post."
    difficulty: "intermediate"
    tags: ["content-multiplication"]

  - id: "ch34-09-content-brand-009"
    front: "How does the interactive one-pager from create-an-asset differ from the text-based one-pager from content multiplication?"
    back: "Interactive: prospect-specific metrics, expandable HTML sections, embedded calculations.\nText: generic, PDF-ready, works for any logistics company."
    difficulty: "intermediate"
    tags: ["create-an-asset"]

  - id: "ch34-09-content-brand-010"
    front: "Zara writes better than LogiTrack's team but LogiTrack outpublishes NexaFlow. Why is the gap not about quality of thinking?"
    back: "The gap is production capacity. Zara cannot outproduce a team of four by working harder: she needs a different operating model that multiplies one piece of thinking into many assets."
    difficulty: "intermediate"
    why: "What changes when you measure content output per hour of original thinking versus per hour of production?"
    tags: ["production-capacity"]

  - id: "ch34-09-content-brand-011"
    front: "Which asset types typically pass brand voice on first generation, and which typically need iteration?"
    back: "READY on first gen: newsletter, FAQ post, LinkedIn article.\nNEEDS EDITING or REDO: CEO social posts, ad copy, subject lines."
    difficulty: "intermediate"
    tags: ["brand-consistency"]

  - id: "ch34-09-content-brand-012"
    front: "Why is brand voice to content what ICP is to the pipeline?"
    back: "Both are upstream configurations that determine downstream quality. Getting brand voice right once improves every asset, just as getting the ICP right once improves every pipeline stage."
    difficulty: "advanced"
    why: "What happens to a 10-asset tree when the brand voice config is vague?"
    tags: ["config-amplification"]

  - id: "ch34-09-content-brand-013"
    front: "What five checks should you run on a cornerstone article before multiplication?"
    back: "1. Tone (operator vs brochure)\n2. Content pillar alignment\n3. Persona voice match\n4. Specificity (benchmarks vs vague)\n5. Length (within 10% of target)"
    difficulty: "intermediate"
    tags: ["cornerstone-review"]

  - id: "ch34-09-content-brand-014"
    front: "When should Farah use the text one-pager versus the interactive one-pager?"
    back: "Text one-pager: volume play for every prospect in the pipeline. Interactive one-pager: precision play for high-value enterprise prospects in shortlist evaluations."
    difficulty: "basic"
    tags: ["asset-selection"]

  - id: "ch34-09-content-brand-015"
    front: "Why do CEO social posts drift from brand voice more than newsletters?"
    back: "CEO voice is personal and strategic, distinct from the company brand voice which is operational. The agent defaults to company brand voice, so CEO posts need explicit persona instructions to shift to strategic, forward-looking tone."
    difficulty: "advanced"
    why: "How would you configure the agent to handle multiple distinct voices within one brand?"
    tags: ["persona-voice"]

  - id: "ch34-09-content-brand-016"
    front: "What does the /seo-audit check for in keyword density?"
    back: "Primary keyword used 3-5 times without stuffing."
    difficulty: "basic"
    tags: ["seo-keyword-density"]
