deck:
  id: "ch23-10-campaign-strategy"
  title: "Campaign Strategy and the Content Calendar"
  description: "Campaign briefs, channel allocation, email nurture tracks, content calendars, and measurement frameworks"
  tags: ["sales", "revops", "marketing", "chapter-23", "campaign"]
  version: 1

cards:
  - id: "ch23-10-campaign-strategy-001"
    front: "What is NexaFlow's concrete Q2 campaign goal?"
    back: "50 HOT-scored leads (score 60+) in 12 weeks from VP Ops and COO at 3PL operators in Pakistan, UAE, and UK."
    difficulty: "basic"
    tags: ["campaign-goal"]

  - id: "ch23-10-campaign-strategy-002"
    front: "Why does the /campaign-plan command need structured inputs rather than a vague goal like 'get more leads'?"
    back: "Vague goals produce vague briefs. Structured inputs (lead count, persona, markets, budget, timeline, constraints) force the agent to produce specific channel allocations and measurable KPIs."
    difficulty: "intermediate"
    why: "How does a missing constraint like 'no events budget' change the entire channel mix?"
    tags: ["campaign-plan"]

  - id: "ch23-10-campaign-strategy-003"
    front: "What four components does this lesson build for a complete campaign?"
    back: "1. Campaign brief with channel allocation\n2. Email nurture sequence\n3. 12-week content calendar\n4. Measurement framework with thresholds"
    difficulty: "basic"
    tags: ["campaign-components"]

  - id: "ch23-10-campaign-strategy-004"
    front: "LinkedIn CPM in Pakistan is $3-4 while UK CPM is $45-65. How does this affect campaign budget allocation?"
    back: "The same budget buys far fewer impressions in the UK. The brief splits LinkedIn Ads into separate PK/UAE and UK line items with different budgets and different CPL thresholds to account for market-specific costs."
    difficulty: "intermediate"
    why: "Why would applying a single global CPL target across all markets lead to bad decisions?"
    tags: ["budget-allocation"]

  - id: "ch23-10-campaign-strategy-005"
    front: "Why is WhatsApp allocated budget for Pakistan but not the UK in the campaign brief?"
    back: "WhatsApp is a standard B2B channel in Pakistan but not in the UK. Allocating WhatsApp budget to the UK would waste money on a channel that does not match UK B2B communication norms."
    difficulty: "intermediate"
    tags: ["channel-allocation"]

  - id: "ch23-10-campaign-strategy-006"
    front: "What three questions should you ask when evaluating a campaign brief?"
    back: "1. Is the channel mix appropriate for each market?\n2. Does the team have capacity to execute?\n3. Are the KPIs leading indicators or vanity metrics?"
    difficulty: "intermediate"
    tags: ["brief-evaluation"]

  - id: "ch23-10-campaign-strategy-007"
    front: "How does the extension's email sequence differ from the base plugin's in cultural calibration?"
    back: "The extension adds a relationship opener for Pakistan/UAE prospects (South Asian norm) but not for UK prospects. The base plugin applies the same tone regardless of market."
    difficulty: "intermediate"
    tags: ["base-vs-extension"]

  - id: "ch23-10-campaign-strategy-008"
    front: "Name any 3 of the 6 differences between base and extension email sequences?"
    back: "Personalisation (generic vs per-prospect), case study matching (one for all vs market-matched), ROI calculator (generic link vs pre-filled), exit conditions (2 vs 4), compliance (none vs Five Laws), cultural calibration (none vs market-specific)."
    difficulty: "intermediate"
    tags: ["base-vs-extension"]

  - id: "ch23-10-campaign-strategy-009"
    front: "What is the difference between a pause threshold and a reallocation threshold in the measurement framework?"
    back: "Pause threshold: stop spending on an underperforming channel (e.g., CPL > $400 for 2 weeks). Reallocation threshold: increase budget on an overperforming channel (e.g., CPL < $200 for 2 weeks)."
    difficulty: "basic"
    tags: ["measurement-thresholds"]

  - id: "ch23-10-campaign-strategy-010"
    front: "A campaign's LinkedIn follower growth target is 300. Is this a leading indicator or a vanity metric?"
    back: "Vanity metric — it measures awareness, not pipeline quality or revenue impact."
    difficulty: "basic"
    tags: ["vanity-metrics"]

  - id: "ch23-10-campaign-strategy-011"
    front: "Why does UK LinkedIn have a higher CPL pause threshold ($750) than PK/UAE LinkedIn ($400)?"
    back: "The UK market has higher advertising costs. A $500 CPL is normal in the UK but signals overspending in Pakistan. Market-specific thresholds prevent pausing channels that are performing well by local standards."
    difficulty: "intermediate"
    why: "What would happen if you applied Pakistan's $400 threshold to UK LinkedIn?"
    tags: ["measurement-thresholds"]

  - id: "ch23-10-campaign-strategy-012"
    front: "The campaign brief calls for 18 content pieces in 2 weeks with one content marketer. How do you evaluate this?"
    back: "Assess whether the content engine from L09 (multiplying cornerstones into derivatives) makes 18 pieces feasible, or whether the sprint needs 3 weeks instead of 2 given one person's capacity."
    difficulty: "advanced"
    why: "What is the relationship between content multiplication and team capacity planning?"
    tags: ["team-capacity"]

  - id: "ch23-10-campaign-strategy-013"
    front: "What three things should you evaluate in a content calendar?"
    back: "1. Volume vs team capacity (sustainable weekly output)\n2. Persona balance (VP Ops vs COO coverage)\n3. Market-specific content (local regulatory and operational hooks)"
    difficulty: "intermediate"
    tags: ["content-calendar-evaluation"]

  - id: "ch23-10-campaign-strategy-014"
    front: "Why does the measurement framework connect to Lesson 13's RevOps dashboard?"
    back: "The metrics and thresholds defined here become the automated data feeds and alerts in the revenue dashboard, replacing manual weekly checks with agent-driven monitoring."
    difficulty: "intermediate"
    why: "What changes when a human checks thresholds weekly versus an agent checks them daily?"
    tags: ["revops-connection"]

  - id: "ch23-10-campaign-strategy-015"
    front: "What does 'cost per lead' measure as a campaign KPI, and why is it a leading indicator?"
    back: "CPL measures how much budget is spent to acquire each lead. It is a leading indicator because it reveals whether campaign economics work before reaching the final lead count target."
    difficulty: "basic"
    tags: ["kpi-leading-indicator"]

  - id: "ch23-10-campaign-strategy-016"
    front: "When should you use the extension email sequence versus the base plugin sequence?"
    back: "Use the extension when you have CRM enrichment data and deal size justifies per-prospect personalisation. Use the base when sending to a large list where individual personalisation is not cost-effective."
    difficulty: "advanced"
    why: "What data must exist in the CRM for the extension to outperform the base?"
    tags: ["base-vs-extension"]
