deck:
  id: ch25-07-seven-domains
  title: The Seven Domains
  description: Seven enterprise deployment domains where institutional knowledge is hardest to encode and where connector infrastructure supports production deployment.
  tags:
    - enterprise-domains
    - institutional-knowledge
    - domain-expertise
    - knowledge-lock-in
  version: 2

cards:
  - id: ch25-07-seven-domains-001
    front: What are the seven enterprise deployment domains addressed in Part 3?
    back: "1. Finance and Banking (Ch 28--21)\n2. Sales, RevOps & Marketing (Ch 33)\n3. Supply Chain & Procurement (Ch 34)\n4. Product Management (Ch 24)\n5. People & Organisational Operations (Ch 25--27)\n6. Legal & Compliance (Ch 28)\n7. Innovation & Intrapreneurship (Ch 29)"
    tags:
      - seven-domains
      - recall
    difficulty: basic

  - id: ch25-07-seven-domains-002
    front: What common problem do all seven professional domains share?
    back: Institutional knowledge lock-in -- valuable expertise locked inside individual professionals and unavailable to the organisation as a whole.
    tags:
      - institutional-knowledge
      - common-problem
    difficulty: basic

  - id: ch25-07-seven-domains-003
    front: Why were these specific seven domains chosen over other possible domains?
    back: They represent the clearest cases where three conditions converge -- the domain expertise is highly specific, encoding that expertise is currently difficult, and the connector infrastructure supports production deployment today.
    tags:
      - domain-selection
      - selection-criteria
    difficulty: intermediate
    why: Does this mean other domains cannot benefit from agent deployment, or just that these seven have the most mature infrastructure?

  - id: ch25-07-seven-domains-004
    front: In Finance and Banking, what is the expertise at risk that goes beyond running financial models?
    back: The senior analyst's understanding of which data sources to trust under which conditions, the banker's calibration for which risk signals actually predict credit events, and the CFO's judgment about which regulatory requirements are material.
    tags:
      - finance
      - domain-expertise
    difficulty: intermediate
    why: Why does this judgment take years to develop when the tools themselves can be learned in weeks?

  - id: ch25-07-seven-domains-005
    front: Why is Finance and Banking the largest section in Part 3?
    back: It spans five chapters (17--21) covering foundational finance, intent-driven financial architecture, CA/CPA practice, Islamic finance across seven jurisdictions, and banking-specific regulation (IFRS 9, Basel III/IV, AML/KYC).
    tags:
      - finance
      - section-structure
    difficulty: intermediate

  - id: ch25-07-seven-domains-006
    front: What is the expertise at risk in Legal and Compliance?
    back: The experienced lawyer's understanding of which clause patterns are genuinely dangerous in which contexts and jurisdictions -- a standard clause might be enforceable in one jurisdiction and meaningless in another.
    tags:
      - legal
      - jurisdictional-knowledge
    difficulty: intermediate

  - id: ch25-07-seven-domains-007
    front: What is the expertise at risk in Sales, RevOps and Marketing?
    back: The top performer's qualification logic -- the signals, heuristics, and pattern recognitions that distinguish a prospect worth pursuing from one that will consume resources without converting.
    tags:
      - sales
      - qualification-logic
    difficulty: intermediate
    why: Why is this knowledge particularly hard to document compared to other domain expertise?

  - id: ch25-07-seven-domains-008
    front: In People and Organisational Operations, why does the written policy sometimes give a different answer than the experienced HR professional?
    back: Because the experienced HR professional understands the intent behind policies, the exceptions routinely granted, and the human context that formal documentation never captures.
    tags:
      - hr-operations
      - policy-intent
    difficulty: intermediate
    why: What risks arise when an agent encodes the informal exceptions without the judgment about when those exceptions are appropriate?

  - id: ch25-07-seven-domains-009
    front: What role does Chapter 28 (Productivity and The Agentic Office) play in the People and Efficiency section?
    back: It is the integration chapter that connects all domain agents from Chapters 17 through 27 into a coherent agentic office -- a workplace AI layer that knows the organisation's people, projects, terminology, and priorities.
    tags:
      - agentic-office
      - integration
    difficulty: intermediate

  - id: ch25-07-seven-domains-010
    front: What are the five steps of the cross-domain deployment methodology?
    back: "1. Identify the institutional knowledge at risk\n2. Encode that knowledge into agent instructions (SKILL.md files)\n3. Connect the agent to domain-specific data sources via connectors\n4. Deploy with appropriate governance\n5. Validate against the expertise of the professional whose knowledge was encoded"
    tags:
      - deployment-methodology
      - cross-domain
    difficulty: basic

  - id: ch25-07-seven-domains-011
    front: What does Innovation and Intrapreneurship (Chapter 29) combine to create AI-accelerated ventures?
    back: It combines Lean Startup methodology, Design Thinking, and Agile with AI-accelerated execution -- drawing on domain agents from across the entire curriculum to show how an AI-native startup differs structurally from a traditional one.
    tags:
      - innovation
      - intrapreneurship
    difficulty: intermediate

  - id: ch25-07-seven-domains-012
    front: If your professional work spans multiple domains, how should you approach the domain sections (Chapters 17--29)?
    back: Read the section closest to your primary expertise first. The deployment patterns learned there transfer to any adjacent domain because the methodology is consistent across all seven.
    tags:
      - cross-domain
      - reading-strategy
    difficulty: basic
