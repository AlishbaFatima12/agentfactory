deck:
  id: "ch20-06-sukuk"
  title: "Sukuk -- Global Islamic Capital Markets"
  description: "Key concepts on sukuk structures, the SPPI test, issuer derecognition, purchase undertaking controversy, AAOIFI FAS 25 classification, and Draft Standard 62."
  tags: ["islamic-finance", "sukuk", "capital-markets"]
  version: 1

cards:
  - id: "ch20-06-sukuk-001"
    front: "What is a sukuk, and how does it differ from a conventional bond?"
    back: "A sukuk represents certificates of ownership in underlying assets with returns generated by those assets. A bond is a debt obligation with interest. Sukuk = asset ownership; bond = debt claim."
    tags: ["sukuk", "definition"]
    difficulty: "basic"

  - id: "ch20-06-sukuk-002"
    front: "What are the five main sukuk types?"
    back: "1. Ijarah (sale-and-leaseback)\n2. Musharakah (joint venture)\n3. Mudarabah (profit-sharing)\n4. Wakala (agency investment)\n5. Murabaha (receivable portfolio)"
    tags: ["sukuk-types", "classification"]
    difficulty: "basic"

  - id: "ch20-06-sukuk-003"
    front: "What are the four steps in the ijarah sukuk structure?"
    back: "1. Originator sells assets to SPV\n2. SPV issues certificates to investors\n3. SPV leases assets back to originator\n4. Originator repurchases assets at maturity"
    tags: ["ijarah-sukuk", "structure"]
    difficulty: "intermediate"

  - id: "ch20-06-sukuk-004"
    front: "Why does the purchase undertaking cause the issuer to fail IFRS 9 derecognition for the underlying sukuk assets?"
    back: "The issuer promises to repurchase assets at face value regardless of market value, meaning the issuer still bears value risk. Since risks and rewards have not transferred, derecognition fails and assets stay on the issuer's balance sheet."
    tags: ["purchase-undertaking", "derecognition"]
    difficulty: "intermediate"
    why: "What would need to change structurally for the issuer to achieve derecognition?"

  - id: "ch20-06-sukuk-005"
    front: "Under IAS 32, why are most ijarah sukuk classified as financial liabilities rather than equity?"
    back: "The issuer has contractual obligations to pay periodic cash distributions (rental) and repay face value at maturity (purchase undertaking). Contractual obligation to deliver cash = financial liability."
    tags: ["ias-32", "liability-classification"]
    difficulty: "intermediate"

  - id: "ch20-06-sukuk-006"
    front: "What are the two steps of the IFRS 9 investor classification for sukuk?"
    back: "Step 1: Business model test (HTC, HTCS, or other)\nStep 2: SPPI test (do cash flows represent solely principal and return?)"
    tags: ["sppi-test", "ifrs-9-classification"]
    difficulty: "basic"

  - id: "ch20-06-sukuk-007"
    front: "Why does an ijarah sukuk typically pass the SPPI test while musharakah and mudarabah sukuk fail?"
    back: "Ijarah sukuk have fixed periodic distributions and fixed maturity redemption via purchase undertaking, resembling a basic lending arrangement. Musharakah and mudarabah returns depend on variable venture profit, making cash flows equity-linked rather than solely principal and return."
    tags: ["sppi-test", "sukuk-classification"]
    difficulty: "intermediate"
    why: "How does the SPPI result affect income statement volatility for the investor?"

  - id: "ch20-06-sukuk-008"
    front: "What are the three investor classification categories under AAOIFI FAS 25?"
    back: "1. Held-to-maturity (amortised cost)\n2. Trading (fair value through P&L)\n3. Available-for-sale (fair value through OCI)"
    tags: ["aaoifi-fas-25", "investor-classification"]
    difficulty: "intermediate"

  - id: "ch20-06-sukuk-009"
    front: "What would AAOIFI Draft Standard 62 change about the global sukuk market if adopted?"
    back: "It would shift sukuk from asset-based (unsecured claim on originator) to asset-backed (secured claim on specific assets only). Most existing sukuk would need restructuring because investors would lose recourse to the originator beyond the asset pool."
    tags: ["standard-62", "asset-backed"]
    difficulty: "advanced"
    why: "Why would originators resist genuine asset-backed structures?"

  - id: "ch20-06-sukuk-010"
    front: "What was the approximate global sukuk issuance in 2024, and which country leads?"
    back: "Approximately $200 billion. Malaysia leads with 35-40% of global volume."
    tags: ["sukuk-market", "issuance-volume"]
    difficulty: "basic"

  - id: "ch20-06-sukuk-011"
    front: "The purchase undertaking is contested from three different perspectives. How do IFRS, Shariah, and Draft Standard 62 each view it?"
    back: "IFRS: makes sukuk economically equivalent to a bond. Shariah (Standard 17): permitted for ijarah sukuk but prohibited for equity-based sukuk because it violates risk-sharing. Standard 62: current purchase undertakings may not satisfy the proposed asset-backed requirement."
    tags: ["purchase-undertaking", "controversy"]
    difficulty: "advanced"
    why: "Why is the purchase undertaking prohibited for musharakah sukuk but permitted for ijarah sukuk?"

  - id: "ch20-06-sukuk-012"
    front: "How does the same sukuk certificate get classified differently across Bahrain, Malaysia, and the UK?"
    back: "Bahrain uses AAOIFI FAS 25 (held-to-maturity, trading, or AFS). Malaysia uses MFRS 9 (amortised cost, FVOCI, or FVTPL via SPPI test). UK uses IFRS 9 (same framework as Malaysia but different labels and disclosure requirements). Three different classification systems for one certificate."
    tags: ["multi-jurisdiction", "sukuk-classification"]
    difficulty: "advanced"
    why: "What practical challenge does this create for a fund manager holding the same sukuk across multiple jurisdictions?"
