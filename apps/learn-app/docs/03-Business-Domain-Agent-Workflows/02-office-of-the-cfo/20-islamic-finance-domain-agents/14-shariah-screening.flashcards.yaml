deck:
  id: "ch20-14-shariah-screening"
  title: "Shariah Portfolio Screening"
  description: "Four global Shariah screening methodologies, financial ratio thresholds, NPI rules, purification obligations, and screening divergence analysis."
  tags: ["shariah-screening", "islamic-finance", "portfolio-compliance"]
  version: 1

cards:
  - id: "ch20-14-shariah-screening-001"
    front: "What are the four major Shariah equity screening methodologies?"
    back: "SC Malaysia, Tadawul, AAOIFI Standard 21, and MSCI Islamic Index."
    tags: ["shariah-screening", "methodologies"]
    difficulty: "basic"

  - id: "ch20-14-shariah-screening-002"
    front: "A company's debt is 32% of total assets but 35% of its declining market cap. Why does this create screening divergence?"
    back: "SC Malaysia/MSCI use total assets (stable), while Tadawul/AAOIFI use market cap (volatile). The company passes total-assets screens but fails market-cap screens because the denominator shrank, not because debt changed."
    tags: ["screening-divergence", "denominator"]
    difficulty: "intermediate"
    why: "How does a trailing average market cap approach address this volatility problem?"

  - id: "ch20-14-shariah-screening-003"
    front: "Name any 4 hard-exclusion sectors under Shariah screening?"
    back: "Conventional banking, alcohol, gambling, pork, tobacco, conventional insurance, adult entertainment, WMD."
    tags: ["hard-exclusions", "sector-screens"]
    difficulty: "basic"

  - id: "ch20-14-shariah-screening-004"
    front: "What NPI threshold do all four Shariah screening methodologies apply?"
    back: "5% of total revenue — above 5% means exclusion."
    tags: ["npi", "screening-threshold"]
    difficulty: "basic"

  - id: "ch20-14-shariah-screening-005"
    front: "How is the purification amount calculated for a Shariah-compliant portfolio?"
    back: "Dividend received times the holding's NPI percentage, summed across all holdings."
    tags: ["purification", "calculation"]
    difficulty: "intermediate"

  - id: "ch20-14-shariah-screening-006"
    front: "A stock passes SC Malaysia screening but fails MSCI Islamic on environmental criteria. Why does this divergence occur?"
    back: "SC Malaysia applies only Shariah criteria, while MSCI overlaps environmental screening with its Islamic methodology. The exclusion is methodology-based, not Shariah-based, showing that frameworks embed different values beyond core prohibitions."
    tags: ["screening-divergence", "esg-shariah"]
    difficulty: "advanced"
    why: "Is the ESG-Shariah overlap large enough to support a single combined product?"

  - id: "ch20-14-shariah-screening-007"
    front: "What distinguishes a hard exclusion from a soft exclusion in Shariah screening?"
    back: "Hard: zero tolerance, any involvement disqualifies. Soft: proceeds to the NPI income screen."
    tags: ["hard-exclusions", "soft-exclusions"]
    difficulty: "basic"

  - id: "ch20-14-shariah-screening-008"
    front: "Why does a Shariah compliance breach in a fund holding require immediate attention rather than waiting for quarterly review?"
    back: "Continued holding after a known breach is itself a Shariah violation. The 30-day divestment window is a concession, not a comfort zone, because the fund's mandate is ethical compliance."
    tags: ["compliance-breach", "divestment"]
    difficulty: "intermediate"
    why: "What escalation rule should apply when a non-compliant holding exceeds 3% of fund NAV?"

  - id: "ch20-14-shariah-screening-009"
    front: "Which denominator does each screening methodology use for the debt screen?"
    back: "SC Malaysia and MSCI: total assets.\nTadawul and AAOIFI SS21: market capitalisation."
    tags: ["debt-screen", "denominator"]
    difficulty: "intermediate"

  - id: "ch20-14-shariah-screening-010"
    front: "A company passes the NPI screen at 4.2%. How does this affect the fund's dividend income?"
    back: "The company is compliant but not fully clean. The fund must donate 4.2% of dividends received from that company to charity as purification — it cannot retain or offset this amount."
    tags: ["npi", "purification"]
    difficulty: "intermediate"
    why: "Why can the purification amount not be offset against the fund's management expenses?"

  - id: "ch20-14-shariah-screening-011"
    front: "Why might a fund's SSB choose the conservative screening approach over the selective approach?"
    back: "The conservative approach (exclude if any methodology excludes) minimises Shariah risk by defaulting to the strictest standard. The selective approach allows more holdings but requires a documented justification for why the chosen methodology is sufficient."
    tags: ["resolution", "screening-divergence"]
    difficulty: "intermediate"
    why: "What is the tradeoff in portfolio diversification when choosing conservative over selective?"

  - id: "ch20-14-shariah-screening-012"
    front: "How does a quarterly SSB compliance report differ from a conventional fund's compliance report?"
    back: "It includes Shariah-specific items: portfolio compliance status, newly non-compliant stocks requiring divestment, purification calculation, screening divergence cases under review, and SSB-recommended actions."
    tags: ["ssb-report", "compliance"]
    difficulty: "intermediate"
    why: "Why must the SSB report include divergence cases even when the fund's primary methodology shows compliance?"

  - id: "ch20-14-shariah-screening-013"
    front: "Why does market-cap-based screening produce more portfolio turnover during downturns?"
    back: "Falling share prices shrink the denominator, pushing debt ratios above thresholds and triggering forced divestment even though actual debt is unchanged. This creates transaction costs driven by market volatility, not fundamental changes."
    tags: ["market-cap", "volatility", "screening"]
    difficulty: "advanced"
    why: "What is the Shariah argument for and against using a volatile denominator?"

  - id: "ch20-14-shariah-screening-014"
    front: "What are the five required sections in a quarterly SSB compliance report?"
    back: "1. Compliance status\n2. Prior-quarter changes\n3. Purification calculation\n4. Stocks under SSB review\n5. Recommended actions"
    tags: ["ssb-report", "quarterly"]
    difficulty: "basic"
