deck:
  id: "ch20-16-cross-border-consolidation"
  title: "Cross-Border Islamic Banking Consolidation"
  description: "Consolidation challenges unique to Islamic banking groups spanning AAOIFI and IFRS jurisdictions, IAH fund reclassification, intra-group murabaha elimination, and transfer pricing for mudarib fees."
  tags: ["consolidation", "islamic-banking", "multi-jurisdiction"]
  version: 1

cards:
  - id: "ch20-16-cross-border-consolidation-001"
    front: "What three consolidation problems are unique to Islamic banking groups?"
    back: "1. IAH fund classification\n2. Intra-group murabaha substance\n3. Cross-jurisdiction Shariah compliance gaps"
    tags: ["consolidation", "unique-problems"]
    difficulty: "basic"

  - id: "ch20-16-cross-border-consolidation-002"
    front: "Why is the IAH fund reclassification in consolidation conceptual rather than presentational?"
    back: "AAOIFI says depositors bear investment risk (separate category), while IFRS treats funds as liabilities because banks practically guarantee returns. The reclassification reflects a judgment about economic substance, not a label swap."
    tags: ["iah", "consolidation", "substance"]
    difficulty: "advanced"
    why: "What audit evidence would determine which view better reflects economic substance?"

  - id: "ch20-16-cross-border-consolidation-003"
    front: "When a Bahrain AAOIFI parent consolidates IFRS subsidiaries, which framework governs the group?"
    back: "IFRS primary, with AAOIFI supplementary disclosures."
    tags: ["group-framework", "consolidation"]
    difficulty: "intermediate"

  - id: "ch20-16-cross-border-consolidation-004"
    front: "Why is intra-group murabaha an SSB judgment rather than an accounting decision?"
    back: "If both parties are Islamic banks and know the asset purchase is merely funding, whether it satisfies real-asset-backing requirements is a genuine Shariah question that qualified scholars must resolve."
    tags: ["intra-group-murabaha", "shariah", "ssb"]
    difficulty: "intermediate"
    why: "How does this differ from a conventional inter-company loan that is simply eliminated?"

  - id: "ch20-16-cross-border-consolidation-005"
    front: "How can a Shariah compliance gap arise within a banking group?"
    back: "The parent's SSB may approve a product the subsidiary's local Shariah authority rejects."
    tags: ["shariah-compliance", "group"]
    difficulty: "intermediate"

  - id: "ch20-16-cross-border-consolidation-006"
    front: "Why do transfer pricing rules for mudarib fees between group entities create dual compliance requirements?"
    back: "The fee must satisfy both Shariah compliance (legitimate mudarib arrangement) and tax authority requirements (arm's-length pricing under Pakistan FBR rules), plus applicable withholding tax under bilateral treaties."
    tags: ["transfer-pricing", "mudarib-fee", "pakistan"]
    difficulty: "intermediate"
    why: "Why is documenting arm's-length pricing harder for an Islamic fee than a conventional management fee?"

  - id: "ch20-16-cross-border-consolidation-007"
    front: "What are the top five adjustments when consolidating an AAOIFI parent with IFRS subsidiaries?"
    back: "1. IAH classification\n2. Ijarah treatment\n3. Income labelling\n4. Impairment method\n5. Instrument classification"
    tags: ["consolidation-adjustments", "aaoifi-ifrs"]
    difficulty: "basic"

  - id: "ch20-16-cross-border-consolidation-008"
    front: "Why is eliminating intra-group murabaha harder than eliminating a conventional inter-company loan?"
    back: "A conventional loan is clearly funding. Intra-group murabaha involves an actual asset purchase, raising whether it has real substance or is funding with an Islamic label — putting both Shariah validity and accounting at stake."
    tags: ["intra-group-murabaha", "consolidation"]
    difficulty: "advanced"
    why: "What arguments would each side of the SSB debate present?"

  - id: "ch20-16-cross-border-consolidation-009"
    front: "How does the Al Baraka Banking Group illustrate the dual-framework challenge?"
    back: "Headquartered in Bahrain (AAOIFI mandatory) with subsidiaries in IFRS jurisdictions, requiring satisfaction of both frameworks."
    tags: ["al-baraka", "dual-framework"]
    difficulty: "intermediate"

  - id: "ch20-16-cross-border-consolidation-010"
    front: "How does the IAH reclassification journal entry work in AAOIFI-to-IFRS consolidation?"
    back: "Debit Equity of IAH, credit Financial Liabilities — moving IAH funds from AAOIFI's separate category into IFRS liabilities in consolidated statements."
    tags: ["iah", "journal-entry", "consolidation"]
    difficulty: "intermediate"
    why: "What supplementary disclosure must be added for the Bahrain regulator after reclassification?"

  - id: "ch20-16-cross-border-consolidation-011"
    front: "Why does a multi-jurisdiction Islamic banking group face consolidation challenges beyond those of single-jurisdiction groups?"
    back: "Each subsidiary may use a different framework, classify instruments differently, and operate under different Shariah authorities — requiring both accounting alignment and Shariah harmonisation simultaneously."
    tags: ["multi-jurisdiction", "consolidation"]
    difficulty: "advanced"
    why: "How does this complexity scale as more jurisdictions are added?"

  - id: "ch20-16-cross-border-consolidation-012"
    front: "What must consolidated Islamic banking group statements include beyond standard IFRS outputs?"
    back: "AAOIFI supplementary disclosures, dual-framework accounting policy note, and SSB referral documentation."
    tags: ["consolidated-outputs", "dual-framework"]
    difficulty: "intermediate"
