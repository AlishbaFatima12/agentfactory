deck:
  id: "ch21-09-aml-three-lines"
  title: "AML/KYC -- The Three Lines of Defence"
  description: "Key concepts from the three lines of defence model, CDD and EDD requirements, PEP screening, beneficial ownership, and the AI agent boundary in AML compliance."
  tags: ["aml", "kyc", "three-lines-of-defence", "cdd", "edd", "pep"]
  version: 1

cards:
  - id: "ch21-09-aml-three-lines-001"
    front: "In the three lines of defence model, what function does each line perform in AML?"
    back: "1st: Customer-facing business (onboarding, CDD)\n2nd: Financial crime compliance (framework, TM, SARs)\n3rd: Internal audit (independent assurance)"
    tags: ["three-lines-of-defence", "aml"]
    difficulty: "basic"

  - id: "ch21-09-aml-three-lines-002"
    front: "Why must the third line of defence report to the Board Audit Committee rather than to the Head of Compliance?"
    back: "If internal audit reported to the second line, it would be reviewing its own colleagues' work, creating a conflict of interest. Independence from both business and compliance is essential because audit must objectively test whether both lines are functioning."
    tags: ["three-lines-of-defence", "independence", "audit"]
    difficulty: "intermediate"
    why: "What specific failures become invisible when audit lacks independence from the functions it reviews?"

  - id: "ch21-09-aml-three-lines-003"
    front: "What are the four elements of standard Customer Due Diligence (CDD)?"
    back: "1. Identity verification\n2. Nature and purpose of relationship\n3. Source of funds\n4. Risk rating (Low/Medium/High)"
    tags: ["cdd", "aml"]
    difficulty: "basic"

  - id: "ch21-09-aml-three-lines-004"
    front: "Name any 4 of the 5 triggers that require Enhanced Due Diligence (EDD) instead of standard CDD?"
    back: "1. Politically Exposed Person (PEP)\n2. High-risk jurisdiction (FATF grey/black list)\n3. Correspondent banking\n4. Complex ownership structures\n5. High-value or unusual transactions"
    tags: ["edd", "risk-triggers"]
    difficulty: "intermediate"

  - id: "ch21-09-aml-three-lines-005"
    front: "Why does PEP status require enhanced scrutiny even though it does not mean the person is a criminal?"
    back: "A PEP's prominent public position creates elevated corruption and bribery risk. The enhanced scrutiny addresses the opportunity for abuse, not evidence of wrongdoing, because the position itself increases the probability of illicit fund flows."
    tags: ["pep", "edd", "risk-rationale"]
    difficulty: "intermediate"
    why: "How should a bank balance AML compliance with financial inclusion when deciding whether to bank a PEP?"

  - id: "ch21-09-aml-three-lines-006"
    front: "What is the typical regulatory threshold for identifying a beneficial owner of a legal entity?"
    back: "25% of shares, voting rights, or control through other means."
    tags: ["beneficial-ownership", "aml"]
    difficulty: "basic"

  - id: "ch21-09-aml-three-lines-007"
    front: "A company has three layers of holding companies across multiple jurisdictions. Why does this complicate beneficial ownership identification?"
    back: "Each layer can obscure the natural person who ultimately controls the entity. Multiple jurisdictions have different disclosure rules, therefore the bank must trace through every layer to find anyone holding 25% or more, or identify whoever exercises control by other means."
    tags: ["beneficial-ownership", "complex-structures"]
    difficulty: "intermediate"
    why: "At what point should complexity itself be treated as a red flag rather than just a compliance challenge?"

  - id: "ch21-09-aml-three-lines-008"
    front: "Who has personal criminal liability for SAR filing decisions within a bank?"
    back: "The Money Laundering Reporting Officer (MLRO)."
    tags: ["sar", "mlro", "criminal-liability"]
    difficulty: "basic"

  - id: "ch21-09-aml-three-lines-009"
    front: "Why does the MLRO carry personal criminal liability for SAR decisions rather than the institution alone?"
    back: "Personal liability ensures an identifiable individual is accountable for each filing decision. Without it, institutions could diffuse responsibility across committees, because no single person would face consequences for failing to file when indicators are present."
    tags: ["mlro", "criminal-liability", "sar"]
    difficulty: "advanced"
    why: "How does personal liability change an MLRO's behaviour compared to purely institutional penalties?"

  - id: "ch21-09-aml-three-lines-010"
    front: "What is the PEP definition's scope beyond the individual officeholder?"
    back: "It extends to family members (spouse, children, parents, siblings) and close associates (business partners, joint beneficial owners)."
    tags: ["pep", "family-associates"]
    difficulty: "intermediate"

  - id: "ch21-09-aml-three-lines-011"
    front: "In AML compliance, what can an AI agent automate versus what requires human judgment?"
    back: "AI automates: screening (PEP, sanctions, adverse media), data gathering, risk scoring, identity verification.\nHumans decide: risk acceptance/rejection, EDD conclusions, SAR filing, overriding risk scores, exiting relationships."
    tags: ["agent-boundary", "aml", "ai-compliance"]
    difficulty: "intermediate"

  - id: "ch21-09-aml-three-lines-012"
    front: "Why must an AI agent never make the final decision to accept or reject a high-risk AML customer?"
    back: "Risk acceptance decisions require contextual judgment that weighs regulatory, reputational, and commercial factors. These decisions carry personal and institutional liability, therefore a human must own the outcome and be accountable for the reasoning."
    tags: ["agent-boundary", "risk-acceptance"]
    difficulty: "intermediate"
    why: "What specific harms could result if an AI agent autonomously declined all customers from FATF grey-listed jurisdictions?"

  - id: "ch21-09-aml-three-lines-013"
    front: "Under UK POCA 2002 s333A, what act is a criminal offence related to SARs?"
    back: "Tipping-off -- informing anyone that a SAR has been or may be filed."
    tags: ["tipping-off", "sar", "poca"]
    difficulty: "basic"

  - id: "ch21-09-aml-three-lines-014"
    front: "HSBC paid $1.9 billion in AML fines in 2012. Why is inadequate CDD cited as the root cause behind most AML enforcement actions?"
    back: "CDD is the first barrier against financial crime. If identity, source of funds, and risk rating are not verified at onboarding, every downstream control (transaction monitoring, SAR filing) operates on incomplete information, therefore the entire framework fails."
    tags: ["cdd", "enforcement", "hsbc"]
    difficulty: "advanced"
    why: "How does a failure at the CDD stage cascade through transaction monitoring and SAR filing?"

  - id: "ch21-09-aml-three-lines-015"
    front: "What effect does FATF grey-listing have on a country's banking relationships?"
    back: "Banks worldwide apply EDD to all transactions involving grey-listed jurisdictions, slowing trade finance and increasing compliance costs."
    tags: ["fatf", "grey-list", "edd"]
    difficulty: "intermediate"

  - id: "ch21-09-aml-three-lines-016"
    front: "How does the UNODC estimate the scale of global money laundering?"
    back: "Between 2% and 5% of global GDP annually -- approximately $800 billion to $2 trillion."
    tags: ["money-laundering", "scale", "unodc"]
    difficulty: "basic"
