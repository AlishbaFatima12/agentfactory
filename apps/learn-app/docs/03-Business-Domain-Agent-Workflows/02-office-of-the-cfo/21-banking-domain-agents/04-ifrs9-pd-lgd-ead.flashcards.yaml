deck:
  id: "ch21-04-ifrs9-pd-lgd-ead"
  title: "PD, LGD, and EAD -- Building the ECL Components"
  description: "Key concepts from PD calibration (TTC to PIT), downturn LGD with forced sale values, EAD with credit conversion factors, and how the three components combine into facility-level ECL."
  tags: ["pd", "lgd", "ead", "ecl-components", "ifrs9"]
  version: 1

cards:
  - id: "ch21-04-ifrs9-pd-lgd-ead-001"
    front: "What is the difference between TTC PD and PIT PD?"
    back: "TTC (Through-the-Cycle) averages default rates across full economic cycles. PIT (Point-in-Time) adjusts for current economic conditions."
    tags: ["ttc-pd", "pit-pd", "pd-calibration"]
    difficulty: "basic"

  - id: "ch21-04-ifrs9-pd-lgd-ead-002"
    front: "A bank uses TTC PDs for its IFRS 9 ECL calculation during a recession. Why does this understate provisions?"
    back: "TTC PDs average across cycles, so they are below actual default rates during recessions. IFRS 9 requires PIT PDs that reflect current conditions. Using TTC without a credit cycle adjustment understates provisions when the economy is worse than the long-run average."
    tags: ["ttc-pd", "pit-pd", "ifrs9-compliance"]
    difficulty: "intermediate"
    why: "How would the same error affect provisions during an expansion?"

  - id: "ch21-04-ifrs9-pd-lgd-ead-003"
    front: "What formula converts TTC PD to PIT PD using the Credit Cycle Adjustment?"
    back: "PIT PD = TTC PD x CCA."
    tags: ["cca", "pd-calibration", "formula"]
    difficulty: "basic"

  - id: "ch21-04-ifrs9-pd-lgd-ead-004"
    front: "Why does IFRS 9 require downturn LGD rather than current-market LGD for ECL calculations?"
    back: "Defaults cluster in economic downturns when collateral values are simultaneously depressed. Using current-market LGD during good times would understate loss severity that materialises during the downturn when defaults actually occur."
    tags: ["downturn-lgd", "ifrs9", "collateral"]
    difficulty: "intermediate"
    why: "How did the 2008 property crash demonstrate the danger of using current-market LGD?"

  - id: "ch21-04-ifrs9-pd-lgd-ead-005"
    front: "What is the formula for marginal PD given cumulative PDs?"
    back: "Marginal PD(t) = (Cumulative PD(t) - Cumulative PD(t-1)) / (1 - Cumulative PD(t-1))."
    tags: ["marginal-pd", "pd-term-structure", "formula"]
    difficulty: "intermediate"

  - id: "ch21-04-ifrs9-pd-lgd-ead-006"
    front: "What does EAD measure, and why does it often exceed the current drawn balance?"
    back: "EAD is the total amount owed at the moment of default, including expected future drawdowns. For revolving facilities, distressed borrowers typically draw down available credit before defaulting, so EAD = drawn + (CCF x undrawn) exceeds the current balance."
    tags: ["ead", "ccf", "revolving-facilities"]
    difficulty: "intermediate"
    why: "Why do construction facilities have even higher CCFs (80-100%) than revolving credit?"

  - id: "ch21-04-ifrs9-pd-lgd-ead-007"
    front: "What is the EAD formula for a facility with both drawn and undrawn components?"
    back: "EAD = Drawn Balance + (CCF x Undrawn Commitment)."
    tags: ["ead", "ccf", "formula"]
    difficulty: "basic"

  - id: "ch21-04-ifrs9-pd-lgd-ead-008"
    front: "A residential mortgage has EAD of $400,000 and current property value of $500,000. With a 25% forced sale discount, what is the LGD?"
    back: "6.25%. Forced Sale Value = $500,000 x 0.75 = $375,000. LGD = ($400,000 - $375,000) / $400,000 = 6.25%."
    tags: ["lgd", "mortgage", "forced-sale"]
    difficulty: "intermediate"
    why: "How does a further 20% property value decline change this LGD?"

  - id: "ch21-04-ifrs9-pd-lgd-ead-009"
    front: "What is the typical LGD range for unsecured consumer exposures (credit cards, personal loans)?"
    back: "65-85%, driven by no collateral and recovery through collections only."
    tags: ["lgd", "unsecured-consumer", "asset-class"]
    difficulty: "basic"

  - id: "ch21-04-ifrs9-pd-lgd-ead-010"
    front: "How do cure rates affect LGD estimation?"
    back: "Cured facilities have zero loss, so the effective LGD = (1 - Cure Rate) x Loss Severity on non-cured defaults. Without cure rate adjustment, LGD is overstated because it ignores borrowers who resume payment."
    tags: ["cure-rate", "lgd", "effective-lgd"]
    difficulty: "intermediate"
    why: "Why might cure rates be lower during a recession than during normal times?"

  - id: "ch21-04-ifrs9-pd-lgd-ead-011"
    front: "What is the typical CCA range during a recession, and what effect does it have on PIT PD?"
    back: "CCA range of 1.3-2.5 during recession; PIT PD is higher than TTC PD."
    tags: ["cca", "recession", "pd-calibration"]
    difficulty: "basic"

  - id: "ch21-04-ifrs9-pd-lgd-ead-012"
    front: "A revolving credit facility has $5M drawn and $15M undrawn with a 60% CCF. Why is the ECL based on $14M, not $5M?"
    back: "EAD = $5M + (0.60 x $15M) = $14M. Distressed borrowers typically draw down available credit before defaulting. Using only the $5M drawn balance would understate the bank's true exposure by nearly 3x for this facility type."
    tags: ["ead", "ccf", "revolving"]
    difficulty: "intermediate"
    why: "What CCF would the bank apply if the facility were unconditionally cancellable instead?"

  - id: "ch21-04-ifrs9-pd-lgd-ead-013"
    front: "What is the typical CCF range for committed revolving credit facilities?"
    back: "Typically 50-75% for committed revolving credit facilities."
    tags: ["ccf", "revolving-credit"]
    difficulty: "basic"

  - id: "ch21-04-ifrs9-pd-lgd-ead-014"
    front: "How does the forced sale discount affect LGD sensitivity during property downturns?"
    back: "The forced sale discount compounds with property value declines. A 25% decline combined with a 25% forced sale discount means realised collateral is only 56% of original value, so LGD escalates non-linearly -- a 30% property decline can quadruple LGD."
    tags: ["forced-sale-discount", "lgd", "property-downturn"]
    difficulty: "advanced"
    why: "Why do commercial real estate exposures have higher LGD ranges than residential mortgages?"

  - id: "ch21-04-ifrs9-pd-lgd-ead-015"
    front: "What is the LGD formula for a mortgage using forced sale value?"
    back: "LGD = MAX(0, (EAD - Forced Sale Value)) / EAD."
    tags: ["lgd", "mortgage", "formula"]
    difficulty: "basic"

  - id: "ch21-04-ifrs9-pd-lgd-ead-016"
    front: "Why is PD described as the starting input that cascades through both IFRS 9 and Basel pillars?"
    back: "PD feeds into every ECL calculation (IFRS 9 provision) and every Basel capital charge (risk-weighted assets). Getting PD wrong overstates or understates both the accounting provision and the regulatory capital requirement simultaneously."
    tags: ["pd", "cross-pillar", "cascading-error"]
    difficulty: "advanced"
    why: "How would a PD overestimate affect a bank differently from a PD underestimate?"
