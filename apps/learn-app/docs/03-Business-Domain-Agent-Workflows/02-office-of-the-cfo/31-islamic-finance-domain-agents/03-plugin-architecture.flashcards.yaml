deck:
  id: "ch31-03-plugin-architecture"
  title: "The Plugin Architecture -- Router, Product Skills, Jurisdiction Overlays"
  description: "Key concepts from the three-layer skill architecture including the global router, product skills, jurisdiction overlays, universal rules, and the fundamental limitation boundary."
  tags: ["islamic-finance", "plugin-architecture", "routing"]
  version: 1

cards:
  - id: "ch31-03-plugin-architecture-001"
    front: "What are the three layers in the Islamic finance agent architecture stack, from bottom to top?"
    back: "1. Base Finance Plugin (journal-entry, reconciliation)\n2. Product Skills (accounting mechanics)\n3. Jurisdiction Overlays (labels, presentation, disclosure)"
    tags: ["three-layer-stack", "architecture"]
    difficulty: "basic"

  - id: "ch31-03-plugin-architecture-002"
    front: "A query mentions BHD currency and a murabaha transaction. How does the router process this in its four steps?"
    back: "Step 1: Identify jurisdiction (Bahrain via BHD). Step 2: Identify product (murabaha). Step 3: Load Bahrain overlay. Step 4: Apply product skill first, then overlay modifications."
    tags: ["routing-protocol", "four-steps"]
    difficulty: "intermediate"
    why: "Why must the product skill be applied before the overlay, not the other way around?"

  - id: "ch31-03-plugin-architecture-003"
    front: "Why does the global router never default to IFRS when no jurisdiction is specified?"
    back: "Defaulting to any framework produces wrong output in every other framework. The cost of asking one clarifying question is far lower than the cost of a non-compliant financial statement."
    tags: ["router", "no-default"]
    difficulty: "intermediate"
    why: "What signals does the router use to identify the jurisdiction when the country name is not stated explicitly?"

  - id: "ch31-03-plugin-architecture-004"
    front: "What four sections does every product skill file follow?"
    back: "1. Shariah structure verification\n2. Recognition rules\n3. Income labels by regime\n4. Impairment rules"
    tags: ["product-skill", "anatomy"]
    difficulty: "basic"

  - id: "ch31-03-plugin-architecture-005"
    front: "What three categories of modifications does a jurisdiction overlay provide?"
    back: "1. Mandatory income labels\n2. Balance sheet presentation rules\n3. Regulatory requirements (e.g., CBB rulebook)"
    tags: ["jurisdiction-overlay", "anatomy"]
    difficulty: "basic"

  - id: "ch31-03-plugin-architecture-006"
    front: "Why are product skills and jurisdiction overlays separated into different files instead of combined?"
    back: "Separation of concerns enables adding new jurisdictions without modifying existing product logic. Arithmetic lives in product files; labels and disclosures live in overlays. This makes the architecture extensible."
    tags: ["separation-of-concerns", "extensibility"]
    difficulty: "intermediate"
    why: "How would you add Turkey without changing any existing skill files?"

  - id: "ch31-03-plugin-architecture-007"
    front: "Name the four prohibited terms that must never appear in any Islamic finance agent output."
    back: "1. \"Interest income\"\n2. \"Loans and advances\" (in AAOIFI jurisdictions)\n3. \"Interest expense\"\n4. \"Net interest margin\""
    tags: ["prohibited-terms", "universal-rules"]
    difficulty: "basic"

  - id: "ch31-03-plugin-architecture-008"
    front: "The Islamic finance agent architecture has a fundamental limitation. What is it?"
    back: "The agent automates execution (journal entries, schedules, disclosures) but does not make Shariah compliance judgments. The Shariah Supervisory Board judges; the agent executes."
    tags: ["fundamental-limitation", "ssb"]
    difficulty: "advanced"
    why: "Why is this boundary non-negotiable rather than something the agent could learn to handle?"

  - id: "ch31-03-plugin-architecture-009"
    front: "Name any 3 of the 4 conditions that trigger Shariah compliance escalation to the SSB."
    back: "1. New product structure without existing fatwa\n2. Shariah structural requirements may not be met\n3. Non-Shariah income requiring charity treatment\n4. Interest-based instrument proposed as Islamic"
    tags: ["escalation", "shariah-compliance"]
    difficulty: "intermediate"

  - id: "ch31-03-plugin-architecture-010"
    front: "How does the router-product-overlay pattern transfer to domains outside Islamic finance?"
    back: "Any domain where the same transaction has different outputs by jurisdiction can use it. The router identifies the jurisdiction, the product skill provides universal mechanics, and the overlay applies local rules. Tax, employment law, and healthcare regulation all fit this pattern."
    tags: ["transferable-pattern", "multi-jurisdiction"]
    difficulty: "advanced"
    why: "What would the router check in a multi-country tax domain?"

  - id: "ch31-03-plugin-architecture-011"
    front: "A bank submits a murabaha query without specifying any jurisdiction. What would go wrong if the agent processed it anyway?"
    back: "The agent would apply one framework's labels and classifications, producing output that is non-compliant in every other jurisdiction. The router is designed to ask rather than assume, because compliance depends on jurisdiction-specific labels."
    tags: ["router", "compliance-risk"]
    difficulty: "intermediate"
    why: "How does this design principle compare to a conventional finance agent that can default to one standard?"
