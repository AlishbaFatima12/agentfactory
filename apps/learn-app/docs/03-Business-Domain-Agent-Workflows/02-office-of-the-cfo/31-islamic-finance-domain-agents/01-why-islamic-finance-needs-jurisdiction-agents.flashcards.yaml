deck:
  id: "ch20-01-why-islamic-finance-needs-jurisdiction-agents"
  title: "Why Islamic Finance Needs Jurisdiction-Aware Agents"
  description: "Core concepts on why Islamic finance demands jurisdiction-aware AI agents, the three prohibitions and principles, and the three accounting regimes."
  tags: ["islamic-finance", "jurisdiction-agents", "accounting-regimes"]
  version: 1

cards:
  - id: "ch20-01-why-islamic-finance-needs-jurisdiction-agents-001"
    front: "What is the approximate total asset size and country reach of the global Islamic finance industry?"
    back: "Approximately $4.5 trillion across 80+ countries."
    tags: ["islamic-finance", "industry-scale"]
    difficulty: "basic"

  - id: "ch20-01-why-islamic-finance-needs-jurisdiction-agents-002"
    front: "A bank executes an identical murabaha in Bahrain, Malaysia, and the UK. The numbers match but regulators in each country reject the output. Why?"
    back: "Each jurisdiction requires different income labels and receivable classifications. AAOIFI uses \"Murabaha Income\" and \"Murabaha Receivables\"; Malaysia uses \"Profit from Islamic Financing\"; the UK uses IFRS 9 terminology. Wrong labels = compliance violation."
    tags: ["murabaha", "jurisdiction-variation"]
    difficulty: "intermediate"
    why: "How does this label-vs-arithmetic distinction shape the agent architecture?"

  - id: "ch20-01-why-islamic-finance-needs-jurisdiction-agents-003"
    front: "What are the three prohibitions in Islamic finance?"
    back: "1. Riba (interest)\n2. Gharar (excessive uncertainty)\n3. Maysir (speculation/gambling)"
    tags: ["three-pillars", "prohibitions"]
    difficulty: "basic"

  - id: "ch20-01-why-islamic-finance-needs-jurisdiction-agents-004"
    front: "What are the three principles that every Islamic finance product must satisfy?"
    back: "1. Asset-backing\n2. Risk-sharing\n3. Ethical screening"
    tags: ["three-pillars", "principles"]
    difficulty: "basic"

  - id: "ch20-01-why-islamic-finance-needs-jurisdiction-agents-005"
    front: "Why do generic single-framework finance agents fail when applied to Islamic finance?"
    back: "Islamic finance has multiple frameworks governing the same product, labels are compliance requirements not preferences, and a single banking group may span jurisdictions simultaneously. A generic agent defaults to one framework and produces non-compliant output everywhere else."
    tags: ["generic-agents", "multi-jurisdiction"]
    difficulty: "advanced"
    why: "What architectural solution resolves the multi-framework problem?"

  - id: "ch20-01-why-islamic-finance-needs-jurisdiction-agents-006"
    front: "Name the three accounting regimes that govern Islamic finance globally."
    back: "1. AAOIFI Primary\n2. IFRS with Islamic guidance\n3. Local standards"
    tags: ["accounting-regimes", "three-regimes"]
    difficulty: "basic"

  - id: "ch20-01-why-islamic-finance-needs-jurisdiction-agents-007"
    front: "What approximate share of total Islamic banking financing does murabaha represent?"
    back: "An estimated 40-60%."
    tags: ["murabaha", "market-share"]
    difficulty: "intermediate"

  - id: "ch20-01-why-islamic-finance-needs-jurisdiction-agents-008"
    front: "What are the three layers of the router-to-product-skill-to-jurisdiction-overlay architecture?"
    back: "1. Router (identifies jurisdiction and product)\n2. Product skill (accounting mechanics)\n3. Jurisdiction overlay (labels, disclosures, presentation)"
    tags: ["plugin-architecture", "routing"]
    difficulty: "intermediate"

  - id: "ch20-01-why-islamic-finance-needs-jurisdiction-agents-009"
    front: "Using \"Interest Income\" instead of \"Murabaha Income\" in a Bahrain financial statement seems like a minor label swap. Why is it actually a compliance violation?"
    back: "The CBB rulebook prohibits interest-based terminology in IFI financial statements. Labels in AAOIFI jurisdictions are mandated by the regulator, not stylistic choices. Using the wrong label constitutes a regulatory breach."
    tags: ["compliance", "bahrain", "labels"]
    difficulty: "intermediate"
    why: "What other types of label errors could trigger compliance findings across regimes?"

  - id: "ch20-01-why-islamic-finance-needs-jurisdiction-agents-010"
    front: "How does the router-product-overlay pattern apply beyond Islamic finance?"
    back: "Any domain with jurisdictional variation (tax, legal, healthcare) can use the same pattern, because the architecture separates universal mechanics from jurisdiction-specific labels and rules."
    tags: ["plugin-architecture", "transferability"]
    difficulty: "advanced"
    why: "What makes Islamic finance a particularly good teaching case for this pattern?"
