deck:
  id: "ch31-13-global-zakat"
  title: "Global Zakat Accounting"
  description: "Zakat calculation methodologies across four jurisdictions, ZATCA vs Hanafi formulas, deduction-at-source mechanics, and non-Shariah income purification."
  tags: ["zakat", "islamic-finance", "multi-jurisdiction"]
  version: 1

cards:
  - id: "ch31-13-global-zakat-001"
    front: "What is zakat in Islamic finance?"
    back: "Obligatory alms payment — 2.5% of qualifying wealth above nisab, per lunar year."
    tags: ["zakat", "definition"]
    difficulty: "basic"

  - id: "ch31-13-global-zakat-002"
    front: "A bank has identical balance sheet data in Saudi Arabia and Bahrain. Why might its zakat obligation differ?"
    back: "Saudi Arabia uses the ZATCA equity-based formula starting from shareholders' equity, while Bahrain uses the Hanafi liquid-assets formula. Different starting points produce different zakat bases from identical data."
    tags: ["zakat", "zatca", "hanafi"]
    difficulty: "intermediate"
    why: "Which formula would produce the higher obligation for a bank with large long-term investments?"

  - id: "ch31-13-global-zakat-003"
    front: "Why does the ZATCA formula subtract fixed assets and long-term investments from the equity base?"
    back: "These assets are not held for trade and are not liquid wealth. Zakat targets surplus wealth available for circulation, so non-zakatable productive assets must be removed from the equity-derived base."
    tags: ["zatca", "zakat-formula"]
    difficulty: "intermediate"
    why: "How would a bank with minimal fixed assets be affected by this deduction?"

  - id: "ch31-13-global-zakat-004"
    front: "Under the Hanafi/AAOIFI GS9 zakat methodology, what is the zakat base formula?"
    back: "Zakatable Assets minus Current Liabilities (if result exceeds nisab)."
    tags: ["hanafi", "aaoifi", "zakat-formula"]
    difficulty: "basic"

  - id: "ch31-13-global-zakat-005"
    front: "How does the accounting treatment of zakat differ between Saudi Arabia and Pakistan?"
    back: "In Saudi Arabia, zakat is a P&L expense replacing income tax. In Pakistan, the bank collects as agent (wakeel) — a pass-through that never hits the bank's income statement."
    tags: ["zakat", "accounting-treatment"]
    difficulty: "intermediate"
    why: "What journal entry difference results from treating zakat as a P&L expense versus a pass-through?"

  - id: "ch31-13-global-zakat-006"
    front: "Under Pakistan's Zakat and Ushr Ordinance 1980, when does zakat deduction occur?"
    back: "First day of Ramadan, from savings and PLS accounts exceeding nisab."
    tags: ["pakistan", "zakat-ushr"]
    difficulty: "basic"

  - id: "ch31-13-global-zakat-007"
    front: "How is zakat/tax split for a Saudi IFI with mixed Saudi and foreign ownership?"
    back: "Saudi-owned portion pays zakat at 2.5%. Foreign-owned portion pays income tax at 20%."
    tags: ["zatca", "mixed-ownership"]
    difficulty: "intermediate"

  - id: "ch31-13-global-zakat-008"
    front: "Why does the Hanafi methodology focus on liquid trade assets while ZATCA starts from equity?"
    back: "The Hanafi approach taxes wealth held for trade because zakat targets tradeable surplus, not productive assets. ZATCA starts from equity and removes non-zakatable items, reaching a similar concept from the opposite direction."
    tags: ["hanafi", "zatca", "zakat-philosophy"]
    difficulty: "advanced"
    why: "For a conglomerate with both financial and agricultural holdings, which methodology captures more?"

  - id: "ch31-13-global-zakat-009"
    front: "Name any 3 of the 6 zakatable asset types under the Hanafi/AAOIFI methodology?"
    back: "1. Cash/near-cash\n2. Trade receivables\n3. Trading inventory\n4. Short-term investments\n5. Mudaraba/musharaka\n6. Salam receivables"
    tags: ["hanafi", "zakatable-assets"]
    difficulty: "basic"

  - id: "ch31-13-global-zakat-010"
    front: "What must an IFI do with income from non-Shariah-compliant sources?"
    back: "Donate it to charity (sadaqah) — cannot retain or offset against zakat."
    tags: ["purification", "non-shariah-income"]
    difficulty: "basic"

  - id: "ch31-13-global-zakat-011"
    front: "Why is zakat voluntary in Malaysia and Bahrain but mandatory in Saudi Arabia?"
    back: "Saudi Arabia enforces zakat through ZATCA as a tax-replacement obligation for Saudi-owned entities. Malaysia and Bahrain leave institutional zakat as a discretionary act endorsed by the SSB, because their regulators do not mandate it."
    tags: ["zakat", "malaysia", "bahrain", "saudi"]
    difficulty: "intermediate"
    why: "How does the voluntary/mandatory status affect the accounting treatment in the financial statements?"

  - id: "ch31-13-global-zakat-012"
    front: "Why is routing logic critical in a global zakat SKILL.md for an AI agent?"
    back: "Without routing, the agent might apply the wrong formula — using the Hanafi formula for a Saudi IFI or booking Pakistan's pass-through zakat as the bank's expense. Each jurisdiction requires a different formula and accounting treatment."
    tags: ["skill-md", "routing", "zakat"]
    difficulty: "advanced"
    why: "What routing decisions beyond the formula must the SKILL.md encode?"

  - id: "ch31-13-global-zakat-013"
    front: "What is the nisab threshold in zakat accounting?"
    back: "The minimum wealth level above which zakat becomes obligatory."
    tags: ["zakat", "nisab"]
    difficulty: "basic"

  - id: "ch31-13-global-zakat-014"
    front: "Why can non-Shariah income purification not be deducted from an IFI's zakat base?"
    back: "Purification and zakat are separate obligations. Non-Shariah income was never legitimately the bank's, so donating it does not reduce zakatable wealth — they serve different Shariah purposes."
    tags: ["purification", "zakat", "shariah"]
    difficulty: "advanced"
    why: "What internal controls should a bank implement to prevent recurring non-Shariah income?"
