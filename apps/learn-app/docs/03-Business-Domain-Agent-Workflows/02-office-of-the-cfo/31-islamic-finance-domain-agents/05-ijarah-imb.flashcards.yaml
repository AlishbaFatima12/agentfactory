deck:
  id: "ch31-05-ijarah-imb"
  title: "Ijarah and IMB -- Four-Jurisdiction Lease Accounting"
  description: "Key concepts on ijarah and ijarah muntahia bittamleek, the fundamental AAOIFI FAS 32 vs IFRS 16 divergence, lessor and lessee accounting, and the balance sheet impact across jurisdictions."
  tags: ["islamic-finance", "ijarah", "imb", "lease-accounting"]
  version: 1

cards:
  - id: "ch31-05-ijarah-imb-001"
    front: "What does ijarah mean, and what does the lessee pay for?"
    back: "Ijarah is an Islamic lease. The lessee pays for usufruct (the right to use the asset), not for the asset itself."
    tags: ["ijarah", "usufruct"]
    difficulty: "basic"

  - id: "ch31-05-ijarah-imb-002"
    front: "What is ijarah muntahia bittamleek (IMB)?"
    back: "A lease ending in ownership transfer, either by gift (hibah) or nominal sale. It is the Islamic equivalent of a finance lease."
    tags: ["imb", "ownership-transfer"]
    difficulty: "basic"

  - id: "ch31-05-ijarah-imb-003"
    front: "Why must the promise of ownership transfer in an IMB be a separate document from the lease contract?"
    back: "Combining them in one document may invalidate the Shariah structure because it conflates a lease with a sale."
    tags: ["imb", "shariah-requirement"]
    difficulty: "intermediate"

  - id: "ch31-05-ijarah-imb-004"
    front: "How does AAOIFI FAS 32 treat the leased asset on the lessor's balance sheet compared to IFRS 16?"
    back: "AAOIFI FAS 32: asset stays on lessor's books always (no finance lease concept). IFRS 16: lessor may derecognise the asset and recognise a net investment in lease (finance lease)."
    tags: ["aaoifi-fas-32", "ifrs-16", "divergence"]
    difficulty: "intermediate"
    why: "What Shariah principle drives AAOIFI to reject the finance lease concept entirely?"

  - id: "ch31-05-ijarah-imb-005"
    front: "Why does AAOIFI reject the finance lease concept for ijarah while IFRS 16 accepts it?"
    back: "AAOIFI's Shariah Board holds that the lessor owns the asset throughout, so it stays on the owner's books. IFRS 16 applies substance-over-form analysis: if risks and rewards transferred to the lessee, the asset is derecognised."
    tags: ["shariah-vs-ifrs", "substance-over-form"]
    difficulty: "advanced"
    why: "Which approach better reflects economic reality, and does it matter if the answer differs by jurisdiction?"

  - id: "ch31-05-ijarah-imb-006"
    front: "Under AAOIFI FAS 32, is an IMB asset depreciated over the lease term or the useful life of the asset?"
    back: "Over the useful life of the asset, not the lease term."
    tags: ["aaoifi-fas-32", "depreciation"]
    difficulty: "basic"

  - id: "ch31-05-ijarah-imb-007"
    front: "An IMB has a 7-year lease on an asset with a 20-year useful life. Under AAOIFI, the bank depreciates over 20 years, creating a book loss at transfer. Why does AAOIFI require this?"
    back: "AAOIFI reflects the Shariah position that the lessor genuinely owns the asset and must depreciate it as an owner would. The transfer loss is deliberate; total economics over the lease term (rental income minus depreciation and loss) are still profitable."
    tags: ["depreciation", "transfer-loss", "shariah-ownership"]
    difficulty: "advanced"
    why: "How would total profitability differ if depreciation used the lease term instead?"

  - id: "ch31-05-ijarah-imb-008"
    front: "Under IFRS 16, how does a lessee initially recognise an IMB?"
    back: "Dr: Right-of-Use Asset (PV of future payments)\nCr: Lease Liability (PV of future payments)"
    tags: ["ifrs-16", "lessee", "rou-asset"]
    difficulty: "intermediate"

  - id: "ch31-05-ijarah-imb-009"
    front: "An Islamic bank has $5 billion in IMB assets. How does the AAOIFI/IFRS framework choice affect regulatory capital?"
    back: "Under AAOIFI, the $5B sits as physical Ijarah Assets, risk-weighted at the full asset value. Under IFRS 16 finance lease, it converts to a Net Investment in Lease (receivable), which carries different risk weighting. This affects capital ratios and the bank's capacity to write new business."
    tags: ["regulatory-capital", "balance-sheet-impact"]
    difficulty: "advanced"
    why: "Why would a banking group with subsidiaries in both regimes face consolidation challenges?"

  - id: "ch31-05-ijarah-imb-010"
    front: "How does IFRS 16 lessor accounting differ from AAOIFI FAS 32 for an IMB classified as a finance lease?"
    back: "IFRS 16: lessor derecognises the asset and recognises a net investment in lease (receivable), with income via effective interest on net investment. AAOIFI FAS 32: asset remains on books, depreciated, with straight-line rental income."
    tags: ["lessor-accounting", "ifrs-16", "aaoifi-fas-32"]
    difficulty: "intermediate"
    why: "How does this difference affect the income statement pattern over the lease term?"

  - id: "ch31-05-ijarah-imb-011"
    front: "Why is the AAOIFI/IFRS ijarah divergence considered the single largest balance sheet difference in global Islamic finance?"
    back: "Billions of dollars of IMB assets appear as physical assets in AAOIFI jurisdictions but as financial receivables in IFRS jurisdictions. When a banking group consolidates across both, the group statements must reconcile fundamentally different balance sheet structures."
    tags: ["balance-sheet-divergence", "consolidation"]
    difficulty: "intermediate"
    why: "What specific consolidation adjustments are needed when the group reports under IFRS?"
