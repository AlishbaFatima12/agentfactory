deck:
  id: "ch30-14-cross-domain-capstones"
  title: "Cross-Domain Capstone Exercises"
  description: "New client onboarding across all five CA/CPA domains and a three-session annual audit cycle from planning through ISA 700 opinion formation"
  tags: ["ca-cpa", "capstone", "cross-domain", "audit-cycle", "isa-700"]
  version: 1
  lesson: 14
  chapter: 30

cards:
  - id: "ch30-14-cross-domain-capstones-001"
    front: "What are the two capstone exercises in Lesson 14, and how long does each take?"
    back: "Exercise 22: New client onboarding — Alpha Textiles (Pvt) Ltd, all 5 domains (60 min). Exercise 23: Annual audit cycle across 3 sessions of 25 min each."
    tags: ["capstone-overview", "exercise-22", "exercise-23"]
    difficulty: "basic"

  - id: "ch30-14-cross-domain-capstones-002"
    front: "Which ISA governs engagement risk assessment in Exercise 22's client onboarding?"
    back: "ISA 220 (Quality Management for an Audit of Financial Statements) — governs engagement acceptance and continuance decisions."
    tags: ["exercise-22", "isa-220", "engagement-risk"]
    difficulty: "basic"

  - id: "ch30-14-cross-domain-capstones-003"
    front: "Which ISA governs the engagement letter produced in Exercise 22?"
    back: "ISA 210 (Agreeing the Terms of Audit Engagements) — defines the required terms of engagement including scope, objectives, and responsibilities."
    tags: ["exercise-22", "isa-210", "engagement-letter"]
    difficulty: "basic"

  - id: "ch30-14-cross-domain-capstones-004"
    front: "What three materiality thresholds does Exercise 23 Session 1 calculate for the annual audit?"
    back: "Planning materiality: 5% of pre-tax profit or 1% of revenue (whichever is lower). Performance materiality: 75% of planning materiality. Clearly trivial: 5% of planning materiality."
    tags: ["exercise-23", "materiality", "isa-315"]
    difficulty: "intermediate"

  - id: "ch30-14-cross-domain-capstones-005"
    front: "Which ISA governs the risk identification procedures in Exercise 23 Session 1?"
    back: "ISA 315 (Identifying and Assessing the Risks of Material Misstatement) — requires analytical procedures and understanding of the entity to identify audit risk areas."
    tags: ["exercise-23", "isa-315", "risk-assessment"]
    difficulty: "basic"

  - id: "ch30-14-cross-domain-capstones-006"
    front: "What document does Session 3 of Exercise 23 require, and what structure does it follow?"
    back: "A management letter following the 5-C structure: Condition, Criteria, Cause, Consequence, and Corrective action."
    tags: ["exercise-23", "management-letter", "5-c-structure"]
    difficulty: "intermediate"

  - id: "ch30-14-cross-domain-capstones-007"
    front: "Which ISA governs audit opinion formation in Exercise 23 Session 3?"
    back: "ISA 700 (Forming an Opinion and Reporting on Financial Statements)."
    tags: ["exercise-23", "isa-700", "audit-opinion"]
    difficulty: "basic"

  - id: "ch30-14-cross-domain-capstones-008"
    front: "Why is the ISA 700 audit opinion described as the professional judgment boundary that no AI system crosses?"
    back: "The opinion carries the auditor's legal signature and professional liability. BECAUSE the CA/CPA is legally responsible for the opinion — an AI system has no licence, no regulatory standing, and cannot bear professional liability."
    tags: ["exercise-23", "professional-judgment", "liability"]
    difficulty: "intermediate"
    why: "How does an auditor's liability for an AI-assisted opinion differ from liability for a manually prepared opinion?"

  - id: "ch30-14-cross-domain-capstones-009"
    front: "Why does Exercise 22's onboarding require extensions from all five domains rather than just the audit domain?"
    back: "A new client relationship requires understanding their tax obligations, management accounting structure, GRC framework, and financial reporting simultaneously. BECAUSE siloed domain setup would miss the interdependencies that affect engagement risk and scope."
    tags: ["exercise-22", "cross-domain", "five-domains"]
    difficulty: "intermediate"
    why: "What engagement risk could be missed if the GRC domain assessment is skipped during onboarding?"

  - id: "ch30-14-cross-domain-capstones-010"
    front: "How does Exercise 23's three-session structure mirror a real annual audit cycle?"
    back: "Session 1: Planning (risk assessment, materiality, audit plan). Session 2: Fieldwork (revenue testing, PPE testing, working papers). Session 3: Completion (misstatements, management letter, opinion)."
    tags: ["exercise-23", "audit-cycle", "three-sessions"]
    difficulty: "basic"

  - id: "ch30-14-cross-domain-capstones-011"
    front: "What does AI handle versus what does the CA/CPA decide in Exercise 23's audit cycle?"
    back: "AI executes: analytical procedures, sample selection, documentation formatting, working paper population. CA/CPA decides: materiality thresholds, risk significance, misstatement materiality, and the audit opinion."
    tags: ["exercise-23", "ai-vs-professional-judgment", "audit-cycle"]
    difficulty: "intermediate"

  - id: "ch30-14-cross-domain-capstones-012"
    front: "Why is Exercise 22's client meeting agenda described as AI-augmented narrative rather than AI-generated output?"
    back: "The agent structures the agenda and populates standard items, but the CA/CPA must review and add context about the specific client relationship. THEREFORE the output requires professional knowledge the agent cannot hold — the client's history and the practitioner's judgment about priorities."
    tags: ["exercise-22", "client-meeting", "ai-augmented"]
    difficulty: "advanced"
    why: "What client relationship context would a CA/CPA typically add that no extension could encode?"
