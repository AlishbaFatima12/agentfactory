deck:
  id: "ch19-08-jurisdiction-entity-extensions"
  title: "Building Jurisdiction and Entity Extensions"
  description: "The institutional knowledge gap, jurisdiction tax Cowork skills, chart of accounts encoding, and the When/action instruction format"
  tags: ["ca-cpa", "extensions", "cowork-skill", "jurisdiction", "pakistan-tax"]
  version: 1
  lesson: 8
  chapter: 19

cards:
  - id: "ch19-08-jurisdiction-entity-extensions-001"
    front: "What is the institutional knowledge gap in generic finance plugins?"
    back: "Generic plugins apply default IFRS/US GAAP and generic account descriptions — they do not know jurisdiction tax rates, filing deadlines, or an organisation's chart of accounts structure."
    tags: ["institutional-knowledge-gap", "generic-plugins"]
    difficulty: "basic"

  - id: "ch19-08-jurisdiction-entity-extensions-002"
    front: "What is the building block format for every Cowork skill instruction?"
    back: "\"When [condition], [action]\" — the condition defines when the agent applies the knowledge; the action defines what it does."
    tags: ["when-action-format", "cowork-skill"]
    difficulty: "basic"

  - id: "ch19-08-jurisdiction-entity-extensions-003"
    front: "What corporate tax rate applies to a private (unlisted) company under Pakistan's ITO 2001?"
    back: "29% on taxable income."
    tags: ["pakistan-tax", "ito-2001", "corporate-rate"]
    difficulty: "basic"

  - id: "ch19-08-jurisdiction-entity-extensions-004"
    front: "What is the deadline for a corporate income tax return under Pakistan ITO 2001 Section 114?"
    back: "September 30 of the year following the tax year."
    tags: ["pakistan-tax", "filing-deadlines", "section-114"]
    difficulty: "basic"

  - id: "ch19-08-jurisdiction-entity-extensions-005"
    front: "What penalty applies for late filing of a tax return under Pakistan ITO 2001 Section 182?"
    back: "PKR 40,000 or 0.1% of the tax payable for each day of default, whichever is higher."
    tags: ["pakistan-tax", "penalties", "section-182"]
    difficulty: "intermediate"

  - id: "ch19-08-jurisdiction-entity-extensions-006"
    front: "What is the difference between a jurisdiction extension and a chart of accounts extension?"
    back: "Jurisdiction extension: tax rules applying to all clients in that jurisdiction (rates, deadlines, penalties). Chart of accounts extension: entity-specific account codes, documentation requirements, and approval rules."
    tags: ["extension-types", "jurisdiction-vs-entity"]
    difficulty: "basic"

  - id: "ch19-08-jurisdiction-entity-extensions-007"
    front: "What happens when both the chart of accounts extension and the jurisdiction extension include escalation rules in the same computation?"
    back: "Both escalation flags fire and the engagement partner receives a consolidated alert — the layered extensions combine their restrictions rather than overriding each other."
    tags: ["extension-layering", "escalation"]
    difficulty: "intermediate"

  - id: "ch19-08-jurisdiction-entity-extensions-008"
    front: "What three categories of institutional knowledge must a CA add to a generic plugin via extensions?"
    back: "Jurisdiction's tax law (rates, deadlines, penalties), chart of accounts (account codes, categories), and documentation standards (supporting documents, approval requirements per account)."
    tags: ["extension-categories", "institutional-knowledge"]
    difficulty: "intermediate"

  - id: "ch19-08-jurisdiction-entity-extensions-009"
    front: "Why is precision in the condition clause of a \"When [condition], [action]\" instruction critical?"
    back: "Too broad: the extension fires on irrelevant work. THEREFORE too narrow: it misses cases it should handle. Correct scoping determines whether the extension activates reliably."
    tags: ["when-action-format", "condition-precision"]
    difficulty: "intermediate"
    why: "Give an example of a condition clause that is too broad and rewrite it with correct scoping."

  - id: "ch19-08-jurisdiction-entity-extensions-010"
    front: "What withholding tax rate applies to dividend payments to a non-filer resident shareholder in Pakistan?"
    back: "30% under Section 150 of the ITO 2001 (compared to 15% for filers)."
    tags: ["pakistan-tax", "withholding-tax", "section-150"]
    difficulty: "intermediate"

  - id: "ch19-08-jurisdiction-entity-extensions-011"
    front: "In the Lahore Manufacturing chart of accounts extension, which accounts are restricted and require partner approval before posting?"
    back: "Accounts 3010 (Share Capital), 3020 (Share Premium), and 9010 (Extraordinary Items) — the agent must generate a DRAFT and flag for review rather than produce a final entry."
    tags: ["restricted-accounts", "chart-of-accounts"]
    difficulty: "intermediate"

  - id: "ch19-08-jurisdiction-entity-extensions-012"
    front: "How does an SME benefit from Pakistan's reduced corporate tax rate under ITO 2001?"
    back: "SMEs meeting the criteria under Section 2(59A) of ITO 2001 apply a reduced rate of 20% instead of the standard 29% corporate tax rate."
    tags: ["pakistan-tax", "sme-rate", "section-2-59a"]
    difficulty: "intermediate"

  - id: "ch19-08-jurisdiction-entity-extensions-013"
    front: "Why are extensions described as augmenting plugins rather than replacing them?"
    back: "Extensions add institutional knowledge (jurisdiction-specific rules, entity-specific accounts) on top of the plugin's framework capability. BECAUSE the plugin provides the structural accounting intelligence; extensions make it practice-ready."
    tags: ["extension-principle", "plugin-augmentation"]
    difficulty: "intermediate"
    why: "What would happen if a CA tried to encode all institutional knowledge in global instructions instead of a Cowork skill?"
