deck:
  id: "ch28-01-the-assistant-and-the-agent"
  title: "The Assistant and the Agent"
  description: "The architectural distinction between Claude in Excel (embedded assistant) and Cowork with Excel (orchestrating agent), the two layers of Claude in Excel, and data connector scope."
  tags: ["claude-in-excel", "cowork", "finance-domain", "assistant-vs-agent", "data-connectors", "agent-skills"]
  version: 1

cards:
  - id: "ch28-01-claude-in-excel-001"
    front: "What is Claude in Excel?"
    back: "A standalone Microsoft Excel add-in that embeds an AI assistant directly in a workbook sidebar. It reads all sheets, formulas, and data to answer questions, trace dependencies, debug errors, and — through pre-built Agent Skills — produce professional financial deliverables. When configured with data connectors, it can incorporate market data. It does not require Cowork."
    tags: ["claude-in-excel", "definition"]
    difficulty: "basic"

  - id: "ch28-01-cowork-excel-002"
    front: "What is Cowork with Excel?"
    back: "An AI agent that orchestrates across multiple applications using the Cowork platform. Excel is one node in a multi-step autonomous workflow — the agent can analyse data in Excel, then carry context forward to build a presentation in PowerPoint without manual copy-paste. It requires a Team or Enterprise subscription."
    tags: ["cowork", "definition"]
    difficulty: "basic"

  - id: "ch28-01-core-distinction-003"
    front: "What is the core architectural distinction between Claude in Excel and Cowork with Excel?"
    back: "Claude in Excel is an AI assistant embedded in one application (single-workbook scope). Cowork with Excel is an AI agent orchestrating across multiple applications (multi-app scope). They share the same data connectors — the difference is scope, not capability."
    tags: ["assistant-vs-agent", "architecture"]
    difficulty: "basic"

  - id: "ch28-01-two-layers-004"
    front: "What are the two layers of Claude in Excel?"
    back: "Layer 1 is general workbook intelligence — always active, reads all sheets and formulas, traces dependencies, debugs errors, builds models from descriptions. Layer 2 is the pre-built Agent Skills — specialist financial workflows that produce industry-standard deliverables and can incorporate market data when configured with appropriate connectors."
    tags: ["claude-in-excel", "two-layers"]
    difficulty: "basic"

  - id: "ch28-01-agent-skills-005"
    front: "Name the pre-built Agent Skills in Claude in Excel."
    back: "1. 3-Statement Financial Modelling, 2. Comparable Company Analysis, 3. Competitive Landscape Analysis, 4. Discounted Cash Flow Model, 5. Due Diligence Data Pack, 6. Earnings Analysis, 7. Initiating Coverage Report, 8. Strip Profile / Business Overview, 9. Pitch Deck Creation, 10. PPT Template Creator, 11. Presentation Quality Checker."
    tags: ["agent-skills", "claude-in-excel"]
    difficulty: "intermediate"

  - id: "ch28-01-connectors-shared-006"
    front: "Do Claude in Excel and Cowork use separate data connector ecosystems?"
    back: "They share a single data connector ecosystem. Any connector configured in your Claude settings works in both environments automatically. The difference is scope: Claude in Excel uses connectors to serve analysis within one workbook, while Cowork uses the same connectors to serve workflows spanning multiple applications."
    tags: ["data-connectors", "shared-ecosystem"]
    difficulty: "intermediate"
    why: "Tests whether student understands the corrected connector narrative — same connectors, different scope"

  - id: "ch28-01-plan-requirement-007"
    front: "Which Claude subscription plans support Claude in Excel?"
    back: "Pro, Max, Team, and Enterprise (currently in beta). Pro was added in January 2026."
    tags: ["plan-requirement", "access"]
    difficulty: "basic"

  - id: "ch28-01-supported-platforms-008"
    front: "Which platforms support Claude in Excel?"
    back: "Excel on the web, Excel on Windows (Microsoft 365, build 16.0.13127.20296+), Excel on Mac (version 16.46+), and Excel on iPad (version 2.51+). The keyboard shortcut to open the Claude panel is Control+Option+C (Mac) or Control+Alt+C (Windows)."
    tags: ["platforms", "claude-in-excel"]
    difficulty: "basic"

  - id: "ch28-01-security-risk-009"
    front: "What security risk should finance professionals be aware of when using Claude in Excel with spreadsheets from untrusted sources?"
    back: "Prompt injection. Claude reads cell values, formulas, and comments — malicious instructions hidden in these elements can trick Claude into extracting sensitive information, modifying critical records, or performing destructive actions. Claude shows confirmation pop-ups for external data fetching functions as a protection."
    tags: ["security", "prompt-injection"]
    difficulty: "intermediate"
    why: "Tests awareness of a real operational risk particularly relevant in finance where spreadsheets are routinely shared between organisations"

  - id: "ch28-01-chapter-structure-010"
    front: "What are the three parts of Chapter 28 and what does each cover?"
    back: "Part One covers Claude in Excel (the embedded assistant — general workbook intelligence and pre-built Agent Skills). Part Two covers Cowork finance plugins (the orchestrating agent — domain plugins, data connectors, cross-app orchestration). Part Three covers enterprise extensions (custom SKILL.md files applying the Knowledge Extraction Method from Chapter 27)."
    tags: ["chapter-structure", "roadmap"]
    difficulty: "basic"
