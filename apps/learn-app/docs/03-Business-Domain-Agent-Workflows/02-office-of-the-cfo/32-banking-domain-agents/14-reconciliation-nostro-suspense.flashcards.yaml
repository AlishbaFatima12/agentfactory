deck:
  id: "ch32-14-reconciliation-nostro-suspense"
  title: "Bank Reconciliation -- Nostro, Suspense, and GL-to-Risk"
  description: "How banks reconcile across five categories using a matching hierarchy, classify breaks, apply ageing SLAs, and automate reconciliation with AI -- including the four-way IFRS 9 provision reconciliation."
  tags: ["reconciliation", "nostro", "suspense", "GL-to-risk", "banking-operations"]
  version: 1

cards:
  - id: "ch32-14-reconciliation-nostro-suspense-001"
    front: "What is a nostro account in banking?"
    back: "A bank's own account held at another bank (the correspondent) in a foreign currency or for access to a foreign payment system."
    tags: ["nostro", "correspondent-banking"]
    difficulty: "basic"

  - id: "ch32-14-reconciliation-nostro-suspense-002"
    front: "What is a suspense account and why must it be cleared within strict timelines?"
    back: "A temporary holding account for transactions that cannot be immediately allocated. Aged suspense items can hide errors, fraud, or unbooked losses that distort the bank's financial position."
    tags: ["suspense", "ageing-SLA"]
    difficulty: "basic"

  - id: "ch32-14-reconciliation-nostro-suspense-003"
    front: "What are the five categories of bank reconciliation?"
    back: "1. Nostro\n2. Suspense\n3. Inter-company\n4. Securities/Trade\n5. Regulatory"
    tags: ["reconciliation", "categories"]
    difficulty: "basic"

  - id: "ch32-14-reconciliation-nostro-suspense-004"
    front: "What are the five levels of the matching hierarchy in reconciliation, from highest to lowest priority?"
    back: "1. Exact match\n2. Fuzzy match (tolerance)\n3. Date tolerance\n4. Partial sum pool\n5. Unmatched residual"
    tags: ["matching-hierarchy", "reconciliation"]
    difficulty: "intermediate"

  - id: "ch32-14-reconciliation-nostro-suspense-005"
    front: "Name the five break classification types in bank reconciliation?"
    back: "Mirror-only, statement-only, amount mismatch, duplicate, and timing."
    tags: ["break-classification", "reconciliation"]
    difficulty: "basic"

  - id: "ch32-14-reconciliation-nostro-suspense-006"
    front: "What is the ageing SLA escalation path for unresolved reconciliation breaks?"
    back: "0-2 days: monitor (analyst)\n3-5 days: investigate (team lead)\n6-15 days: escalate (head of ops)\n16-30 days: CFO notification\nOver 30 days: write-off assessment (CFO + Audit committee)"
    tags: ["ageing-SLA", "escalation"]
    difficulty: "intermediate"

  - id: "ch32-14-reconciliation-nostro-suspense-007"
    front: "Why does a suspense item exceeding 30 days trigger a cross-pillar impact beyond just the operations team?"
    back: "A write-off reduces retained earnings and therefore CET1 capital, connecting the reconciliation break to the Basel capital framework. What starts as an operational issue becomes a regulatory capital event through the same cascade mechanism as any provision charge."
    tags: ["ageing-SLA", "cross-pillar", "CET1"]
    difficulty: "advanced"
    why: "At what suspense balance would a write-off become material enough to affect the CET1 ratio?"

  - id: "ch32-14-reconciliation-nostro-suspense-008"
    front: "What four sources must agree in an IFRS 9 four-way provision reconciliation?"
    back: "1. ECL Model\n2. Risk System\n3. General Ledger\n4. Regulatory Disclosure"
    tags: ["four-way-recon", "IFRS-9", "provision"]
    difficulty: "basic"

  - id: "ch32-14-reconciliation-nostro-suspense-009"
    front: "What is the provision movement formula used in reconciliation?"
    back: "Opening Provision + New Charges - Write-offs + Recoveries +/- FX Translation = Closing Provision."
    tags: ["provision-movement", "reconciliation"]
    difficulty: "intermediate"

  - id: "ch32-14-reconciliation-nostro-suspense-010"
    front: "How do model rerun timing, booking lags, and rounding conventions each cause four-way provision breaks?"
    back: "Timing: ECL model runs before latest staging update, so risk system disagrees. Booking lag: risk system updated but GL journal not posted. Rounding: regulatory disclosure rounds figures differently than the GL. Each break has a logical explanation rooted in how data flows between systems."
    tags: ["four-way-recon", "break-causes"]
    difficulty: "intermediate"
    why: "Which of these break types would you prioritise resolving first before filing regulatory returns?"

  - id: "ch32-14-reconciliation-nostro-suspense-011"
    front: "What are the three AI automation levels for bank reconciliation?"
    back: "Level 1: Auto-matching (70-85% of items)\nLevel 2: Exception intelligence (hypothesis generation)\nLevel 3: Continuous reconciliation (real-time monitoring)"
    tags: ["AI-automation", "reconciliation"]
    difficulty: "intermediate"

  - id: "ch32-14-reconciliation-nostro-suspense-012"
    front: "A GBP 2.1M suspense item is 1 day old. A GBP 250 item is 35 days old. The ageing SLA treats both identically at their age bands. Why is this a flawed approach?"
    back: "A flat ageing SLA ignores materiality. The GBP 2.1M item poses far greater risk to the bank's financial position than the GBP 250 item, yet the age-only SLA would not escalate it faster. An amount-weighted SLA would prioritise large items for earlier investigation regardless of age."
    tags: ["ageing-SLA", "materiality", "risk-based"]
    difficulty: "advanced"
    why: "How would you design escalation thresholds that combine both amount and age?"

  - id: "ch32-14-reconciliation-nostro-suspense-013"
    front: "What percentage of items does Level 1 auto-matching typically handle in bank reconciliation?"
    back: "70-85% of items in a typical reconciliation cycle."
    tags: ["AI-automation", "auto-matching"]
    difficulty: "basic"
