deck:
  id: "ch32-01-three-pillars"
  title: "The Three Regulatory Pillars of Modern Banking"
  description: "Key concepts from the three regulatory pillars governing banking — Accounting (IFRS 9), Solvency (Basel III/IV), and Financial Crime (AML/KYC) — and why cross-pillar AI architecture matters."
  tags: ["banking-regulation", "three-pillars", "ifrs9", "basel", "aml"]
  version: 1

cards:
  - id: "ch32-01-three-pillars-001"
    front: "What are the three regulatory pillars that simultaneously govern every banking institution worldwide?"
    back: "1. Accounting (IFRS 9)\n2. Solvency (Basel III/IV)\n3. Financial Crime (AML/KYC)"
    tags: ["three-pillars", "banking-regulation"]
    difficulty: "basic"

  - id: "ch32-01-three-pillars-002"
    front: "A bank discovers fraud in a $50M loan. The AML team files a SAR, but the IFRS 9 team does nothing. Why is this response incomplete?"
    back: "Fraud evidence triggers SICR, migrating the loan from Stage 1 to Stage 3. ECL jumps from 12-month to lifetime (5-10x increase), and the higher provision then reduces CET1 capital. Ignoring the cascade understates losses."
    tags: ["cross-pillar", "cascade"]
    difficulty: "intermediate"
    why: "How would delayed IFRS 9 staging after a fraud discovery affect reported earnings?"

  - id: "ch32-01-three-pillars-003"
    front: "What question does the IFRS 9 (Accounting) pillar ask about a bank's loan portfolio?"
    back: "How much should the bank provision for expected credit losses?"
    tags: ["ifrs9", "accounting-pillar"]
    difficulty: "basic"

  - id: "ch32-01-three-pillars-004"
    front: "Why did IAS 39's incurred loss model fail during the 2008 financial crisis?"
    back: "Banks could only recognise losses after objective evidence appeared. Portfolios losing billions were reported at full value because losses had occurred but not been formally recognised -- described as 'too little, too late.'"
    tags: ["ias39", "financial-crisis", "ifrs9"]
    difficulty: "intermediate"
    why: "How does IFRS 9's forward-looking model specifically prevent the same failure?"

  - id: "ch32-01-three-pillars-005"
    front: "What question does the Basel III/IV (Solvency) pillar ask about a bank's loan portfolio?"
    back: "Does the bank hold enough capital to absorb unexpected losses?"
    tags: ["basel", "solvency-pillar"]
    difficulty: "basic"

  - id: "ch32-01-three-pillars-006"
    front: "How does a cross-pillar fraud cascade flow through all three regulatory pillars in sequence?"
    back: "AML activates first (SAR filing, risk escalation). Then IFRS 9 reacts (SICR triggers stage migration, ECL increases 5-10x). Finally Basel absorbs the impact (reduced retained earnings lower CET1 capital ratio)."
    tags: ["cross-pillar", "cascade", "three-pillars"]
    difficulty: "advanced"
    why: "Why can't the three pillar responses run independently instead of sequentially?"

  - id: "ch32-01-three-pillars-007"
    front: "What is the CET1 ratio, and what is its minimum regulatory threshold under Basel III?"
    back: "Common Equity Tier 1 capital divided by Risk-Weighted Assets; minimum 4.5% (buffers typically bring effective minimum to 10-13%)."
    tags: ["basel", "cet1", "capital-adequacy"]
    difficulty: "intermediate"

  - id: "ch32-01-three-pillars-008"
    front: "A bank builds an AI agent that only handles IFRS 9 provisioning. A regulator asks about capital adequacy after a provision increase. Why does this agent fail?"
    back: "A single-pillar agent cannot trace the provision's impact on CET1 capital because it lacks Basel pillar logic. It calculates the provision correctly but misses the capital ratio reduction -- delivering one-third of the answer."
    tags: ["single-pillar", "cross-pillar", "architecture"]
    difficulty: "intermediate"
    why: "What architectural pattern solves the single-pillar limitation?"

  - id: "ch32-01-three-pillars-009"
    front: "Which international body governs IFRS 9, and how many countries have adopted it?"
    back: "IASB (International Accounting Standards Board); 140+ countries."
    tags: ["iasb", "ifrs9", "global-regulation"]
    difficulty: "basic"

  - id: "ch32-01-three-pillars-010"
    front: "Why does the United States use CECL under ASC 326 instead of IFRS 9 for credit loss provisioning?"
    back: "The US does not adopt IASB standards. CECL is the US-specific lifetime expected loss model, effective 2020. While both are forward-looking, their mechanics differ, so IFRS 9 skills do not apply to US banks."
    tags: ["cecl", "ifrs9", "us-regulation"]
    difficulty: "intermediate"
    why: "How would a banking plugin handle a portfolio with both US and non-US counterparties?"

  - id: "ch32-01-three-pillars-011"
    front: "What are the three levels of the Banking AI Hierarchy in the banking plugin?"
    back: "Level 1: Calculation (deterministic formulas)\nLevel 2: Analytical (judgment-assisted)\nLevel 3: Autonomous (cross-pillar orchestration)"
    tags: ["banking-ai", "hierarchy"]
    difficulty: "basic"

  - id: "ch32-01-three-pillars-012"
    front: "What question does the AML/KYC (Financial Crime) pillar ask about a bank's loan portfolio?"
    back: "Is the bank being used for money laundering, terrorist financing, or sanctions evasion?"
    tags: ["aml", "kyc", "financial-crime"]
    difficulty: "basic"

  - id: "ch32-01-three-pillars-013"
    front: "Why does regulatory density make banking uniquely demanding for AI agents compared to other industries?"
    back: "A single loan portfolio is simultaneously subject to IFRS 9, Basel III, AML, liquidity, leverage, and stress testing. No other industry requires this many frameworks governing the same underlying asset, so agents must handle cross-framework interactions."
    tags: ["regulatory-density", "banking"]
    difficulty: "intermediate"
    why: "How does model risk discipline add a further constraint that other industries don't face?"

  - id: "ch32-01-three-pillars-014"
    front: "Which international body publishes the FATF 40 Recommendations, and how many jurisdictions do they cover?"
    back: "FATF (Financial Action Task Force); 200+ jurisdictions."
    tags: ["fatf", "aml", "global-regulation"]
    difficulty: "basic"

  - id: "ch32-01-three-pillars-015"
    front: "How does a $200M IFRS 9 provision increase cascade into the Basel pillar?"
    back: "The provision reduces pre-tax profit by $200M. After tax, retained earnings fall, reducing CET1 capital. The CET1 ratio drops because the numerator (capital) decreases while RWA in the denominator may stay the same or increase."
    tags: ["cross-pillar", "ifrs9", "basel", "cet1"]
    difficulty: "advanced"
    why: "Why might the loan's risk weight also increase simultaneously with the provision?"
