deck:
  id: "ch35-vendor-classification-kraljic"
  title: "Vendor Classification; The Kraljic Matrix"
  description: "Recall and reasoning cards covering the two-axis Kraljic framework, four vendor tiers, KIFTL worked example, and the bottleneck trap."
  tags: ["supply-chain", "kraljic", "vendor-classification", "bottleneck", "strategic-vendor"]
  version: 2

cards:
  - id: "ch35-vendor-classification-kraljic-001"
    front: "What are the two axes of the Kraljic matrix?"
    back: "Supply risk (how difficult it is to replace this vendor) and profit impact (how much this vendor affects your financial performance)."
    tags: ["kraljic", "classification"]
    difficulty: "basic"

  - id: "ch35-vendor-classification-kraljic-002"
    front: "Who introduced the Kraljic framework and when?"
    back: "Peter Kraljic, in 1983 in the Harvard Business Review."
    tags: ["kraljic", "attribution"]
    difficulty: "basic"

  - id: "ch35-vendor-classification-kraljic-003"
    front: "Match each Kraljic tier to its management model."
    back: "Tier 1 Strategic → Partnership\nTier 2 Tactical → Leverage\nTier 3 Commodity → Efficiency\nTier 4 Bottleneck → Risk mitigation"
    tags: ["kraljic", "tiers"]
    difficulty: "basic"

  - id: "ch35-vendor-classification-kraljic-004"
    front: "What is the defining characteristic of a Bottleneck vendor (Tier 4)?"
    back: "High supply risk combined with low profit impact: low spend, but sole-source or near-sole-source dependency with no qualified alternatives."
    tags: ["bottleneck", "tier-4"]
    difficulty: "basic"

  - id: "ch35-vendor-classification-kraljic-005"
    front: "Why are Bottleneck vendors (Tier 4) reviewed quarterly despite their low spend?"
    back: "Because supply risk, not spend, drives review frequency. A sole-source Bottleneck vendor whose failure halts production is more operationally dangerous than a high-spend Tactical vendor with multiple alternatives."
    tags: ["bottleneck", "review-frequency"]
    difficulty: "intermediate"

  - id: "ch35-vendor-classification-kraljic-006"
    front: "KIFTL supplies $30,000/year of production-critical fasteners with no qualified alternative. What is its Kraljic classification and why?"
    back: "Tier 4; Bottleneck. Low spend = low profit impact. Sole-source dependency = high supply risk. Spend does not determine risk."
    tags: ["bottleneck", "kiftl-example"]
    difficulty: "basic"

  - id: "ch35-vendor-classification-kraljic-007"
    front: "How long does qualifying an alternative supplier for complex or technical goods typically take?"
    back: "60–120 days (or longer for technically complex items like KIFTL's fasteners: 90+ days minimum)."
    tags: ["bottleneck", "qualification-timeline"]
    difficulty: "intermediate"

  - id: "ch35-vendor-classification-kraljic-008"
    front: "A high-spend vendor with many alternatives: Strategic or Tactical?"
    back: "Tactical (Tier 2). High profit impact but low supply risk. The key differentiator is alternatives, not spend."
    tags: ["tactical", "tier-2", "discrimination"]
    difficulty: "basic"

  - id: "ch35-vendor-classification-kraljic-009"
    front: "When should a vendor's Kraljic classification be updated?"
    back: "At least annually, and always after a significant supply market change: new alternatives qualify or existing ones exit, strategic priorities shift, or supply risk changes."
    tags: ["classification", "dynamic"]
    difficulty: "basic"

  - id: "ch35-vendor-classification-kraljic-010"
    front: "How does vendor classification determine assessment depth in /vendor-assess?"
    back: "Strategic and Bottleneck vendors receive full six-dimension assessment at maximum depth. Tactical vendors receive Commercial, Operational, and Financial at standard depth. Commodity vendors receive Commercial and Operational only."
    tags: ["classification", "vendor-assess"]
    difficulty: "intermediate"

  - id: "ch35-vendor-classification-kraljic-011"
    front: "A Tactical vendor's two largest competitors merge, leaving only one market alternative with capacity constraints. What is the new classification?"
    back: "Strategic (Tier 1). Profit impact was already high; now supply risk has risen because alternatives have collapsed. Both axes are now high."
    tags: ["tactical", "strategic", "reclassification"]
    difficulty: "advanced"
    why: "What immediate actions should procurement take when reclassifying a vendor from Tactical to Strategic?"

  - id: "ch35-vendor-classification-kraljic-012"
    front: "Why does using spend alone as a risk proxy create a systematic blind spot for Bottleneck vendors?"
    back: "Spend measures financial exposure, not operational vulnerability. Low-spend sole-source vendors are overlooked because the spend signal gives no warning: but their failure halts production, making them more dangerous than high-spend vendors with multiple alternatives."
    tags: ["bottleneck", "spend-vs-risk"]
    difficulty: "advanced"
    why: "What question better captures operational risk than 'how much do we spend with this vendor'?"
