- front: "What are the two axes of the Kraljic matrix used to classify vendors?"
  back: "Supply risk (how difficult it is to replace the vendor) and profit impact (how much the vendor affects your financial performance). Together they produce four quadrants: Strategic, Tactical, Commodity, and Bottleneck."

- front: "What defines a Strategic vendor (Tier 1) in the Kraljic framework?"
  back: "High supply risk and high profit impact. These are your most important and hardest-to-replace suppliers — typically single-source or near-sole-source with deep technical integration, requiring quarterly reviews and partnership-level management."

- front: "What defines a Tactical vendor (Tier 2) in the Kraljic framework?"
  back: "Low supply risk and high profit impact. Significant spend, but multiple qualified alternatives exist. Management approach is competitive leverage — rebidding each contract cycle and benchmarking against alternatives."

- front: "What defines a Commodity vendor (Tier 3) in the Kraljic framework?"
  back: "Low supply risk and low profit impact. Standard goods or services available from many providers. Management goal is efficiency — minimise transaction costs, automate ordering, review annually."

- front: "Why are Bottleneck vendors (Tier 4) considered the most dangerous quadrant?"
  back: "They have high supply risk but low profit impact, which means procurement teams overlook them because spend is small. Yet their failure can halt production because no qualified alternative exists. They require quarterly reviews despite low spend."

- front: "How does vendor classification determine assessment depth and review frequency?"
  back: "Strategic and Bottleneck vendors get quarterly reviews with full six-dimension assessments. Tactical vendors get bi-annual reviews. Commodity vendors get annual reviews. Classification drives the depth of due diligence, not just timing."

- front: "What is the correct classification for a $30,000/year sole-source vendor that is production-critical with no qualified alternative?"
  back: "Tier 4 — Bottleneck. Despite the low spend, the sole-source dependency and production criticality create high supply risk. Low spend does not mean low risk."

- front: "When should a vendor's Kraljic classification be updated?"
  back: "At least annually, and always after a significant supply market change — such as a competitor exiting the market, a new alternative being qualified, or a shift in your own strategic priorities. Classification is not permanent."

- front: "What immediate action does the Kraljic framework recommend for a Bottleneck vendor?"
  back: "Qualify at least one alternative supplier (typically targeting 90 days), build safety stock to bridge a supply disruption, and request financial visibility (audited accounts) to assess vendor viability."

- front: "How does the /vendor-assess skill use the Kraljic framework?"
  back: "It classifies the vendor into a Kraljic tier as Phase 1 of the assessment workflow, using the vendor details you provide (spend, dependency, alternatives). The classification then determines the depth and scope of the six-dimension assessment in Phase 2."

- front: "What causes a vendor to migrate from Tactical to Strategic in the Kraljic framework?"
  back: "An increase in supply risk — for example, if competitors exit the market, reducing the number of qualified alternatives. The vendor's profit impact was already high (Tactical); now supply risk has risen too, making them Strategic."

- front: "Why does the Kraljic framework use supply risk rather than spend as the primary risk indicator?"
  back: "Spend measures financial exposure, but supply risk measures operational vulnerability. A low-spend sole-source vendor whose failure stops production is more dangerous than a high-spend vendor with multiple alternatives. The framework corrects the common bias of equating spend with risk."
