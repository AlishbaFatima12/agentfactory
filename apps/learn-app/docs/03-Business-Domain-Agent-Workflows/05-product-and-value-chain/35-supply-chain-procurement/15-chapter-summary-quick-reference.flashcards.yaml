deck:
  id: "ch35-chapter-summary-quick-reference"
  title: "Chapter Summary and Quick Reference"
  description: "Recall and reasoning cards covering the central insight, all eight commands, all five agents, default performance thresholds, the exercise dependency chain, and what remains human responsibility."
  tags: ["supply-chain", "quick-reference", "chapter-summary", "plugin-commands", "persistent-agents", "performance-thresholds"]
  version: 2

cards:
  - id: "ch35-chapter-summary-quick-reference-001"
    front: "What is the central insight of Chapter 35 about supply chain problems?"
    back: "Every supply chain problem is an information problem before it is an operational problem. Invoice exceptions, supply disruptions, logistics overpayments, and stock-outs all trace back to information gaps: not absent data, but scattered data that exceeds human attention capacity to connect."
    tags: ["central-insight"]
    difficulty: "basic"

  - id: "ch35-chapter-summary-quick-reference-002"
    front: "Name all eight supply-chain plugin commands and their one-line purpose."
    back: "/vendor-assess (classification and assessment), /supplier-risk (continuous risk monitoring brief), /invoice-reconcile (three-way match reconciliation), /vendor-communicate (dispute and exit communications), /logistics-brief (carrier performance review), /spend-analysis (spend analytics and benchmarking), /supply-chain-brief (weekly executive dashboard), /supply-network-design (network scenario modelling)."
    tags: ["plugin-commands"]
    difficulty: "basic"

  - id: "ch35-chapter-summary-quick-reference-003"
    front: "What are the default OTD thresholds by vendor tier in the chapter?"
    back: "Strategic vendors: ≥ 95% OTD. Tactical vendors: ≥ 90% OTD. Commodity vendors: ≥ 85% OTD. These defaults apply across chapter exercises and should be overridden in supply-chain.local.md for your organisation."
    tags: ["otd-thresholds", "performance-thresholds"]
    difficulty: "basic"

  - id: "ch35-chapter-summary-quick-reference-004"
    front: "What are the default invoice tolerance thresholds in the supply-chain plugin?"
    back: "Standard tolerance: 2% or £50, whichever is less. Strategic vendor tolerance: 1% (tighter). Auto-approve discrepancies below £25. Escalate discrepancies above £500 for manager approval. All thresholds configurable in supply-chain.local.md."
    tags: ["invoice-tolerance", "performance-thresholds"]
    difficulty: "intermediate"

  - id: "ch35-chapter-summary-quick-reference-005"
    front: "What are all five persistent agents and their default monitoring schedules?"
    back: "vendor-health-monitor (daily), invoice-reconciliation-agent (on receipt / hourly), spend-intelligence-agent (weekly), procurement-calendar-agent (daily), logistics-intelligence-agent (weekly)."
    tags: ["five-agents", "schedules"]
    difficulty: "basic"

  - id: "ch35-chapter-summary-quick-reference-006"
    front: "What is the exercise dependency chain in Chapter 35?"
    back: "Exercise 1 (L03/L04: classification) feeds Exercise 6 (L05: tolerance rules) and Exercise 8 (L13: vendor exit). Exercise 2 (L06: reconciliation sprint) feeds Exercise 6 (new rules tested on Ex 2 data). Exercises 3, 4, 5 are independent. Exercise 7 (L12: agent dashboard) aggregates all agent configs. Capstone (L14) integrates all 8 exercises."
    tags: ["exercise-dependency"]
    difficulty: "intermediate"

  - id: "ch35-chapter-summary-quick-reference-007"
    front: "Which three commands were renamed from their original spec names: and what are the correct names?"
    back: "Use /invoice-reconcile (not /reconcile), /vendor-communicate (not /communicate), /supply-network-design (not /network-design). All three were renamed to avoid collision with Anthropic-owned command surfaces."
    tags: ["command-naming", "renamed-commands"]
    difficulty: "basic"

  - id: "ch35-chapter-summary-quick-reference-008"
    front: "What financial risk and quality risk thresholds trigger automatic alerts in the chapter's supplier risk monitoring?"
    back: "Financial risk alert: credit score drop > 15 points within a 90-day window. Quality risk alert: defect rate exceeding 3% in a rolling 90-day window. Both trigger escalation before the weekly review."
    tags: ["risk-thresholds", "alert-triggers"]
    difficulty: "intermediate"

  - id: "ch35-chapter-summary-quick-reference-009"
    front: "Which supply chain tasks remain human responsibilities even with all eight commands and five agents deployed?"
    back: "Supplier relationships, commercial negotiations, judgment calls requiring deep operational understanding, and crisis responses requiring improvisation. The plugin surfaces intelligence and manages routine exceptions; people make relationships and handle situations requiring contextual judgment."
    tags: ["human-responsibilities"]
    difficulty: "basic"

  - id: "ch35-chapter-summary-quick-reference-010"
    front: "How does supply-chain.local.md make the plugin organisation-specific?"
    back: "supply-chain.local.md encodes the organisation's currency, vendor tier counts, invoice tolerance thresholds, risk review frequencies, key contacts, and MCP connection status. Every skill uses these values instead of generic defaults: making the same command produce different outputs tailored to different organisational policies."
    tags: ["local-config", "supply-chain-local-md"]
    difficulty: "intermediate"

  - id: "ch35-chapter-summary-quick-reference-011"
    front: "What seven capabilities did Chapter 35 build: as a summary?"
    back: "1. Vendor lifecycle management (onboarding to exit). 2. Invoice reconciliation toward straight-through processing. 3. Supplier risk monitoring across five dimensions with Tier 2 visibility. 4. Logistics optimisation including network design. 5. Spend analytics and market benchmarking. 6. Vendor communications for disputes and exits. 7. Five persistent agents running the intelligence layer continuously."
    tags: ["chapter-summary", "seven-capabilities"]
    difficulty: "basic"

  - id: "ch35-chapter-summary-quick-reference-012"
    front: "Which 2-3 commands would most organisations start with: and why not all eight at once?"
    back: "Start with the commands that address the organisation's worst current failure: typically /invoice-reconcile (if exception rate is high) or /supplier-risk (if a disruption recently occurred). All eight commands require data infrastructure; starting focused allows MCP connections to be proven before scaling. Expand from demonstrated value, not from full deployment."
    tags: ["deployment-strategy"]
    difficulty: "intermediate"
