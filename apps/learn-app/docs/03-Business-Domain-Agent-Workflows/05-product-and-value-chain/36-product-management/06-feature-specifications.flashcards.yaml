- question: "What are the two failure modes for feature specifications?"
  answer: "The Vague Spec (under-specified — engineers make product decisions) and the Over-Specified Spec (over-specified — PM makes engineering decisions). The craft is in the middle: complete on what matters, silent on what doesn't."

- question: "What are the five mandatory sections of a feature spec?"
  answer: "1. The Problem (user pain with evidence), 2. The Solution (user flows + scope boundary), 3. Acceptance Criteria (numbered, testable), 4. Edge Cases and Error States (table), 5. Open Questions (with owner and due date)."

- question: "What is the scope boundary in a feature spec, and why is it required?"
  answer: "An explicit IN/OUT OF SCOPE list in the Solution section. Every OUT OF SCOPE line prevents a scope creep conversation. Non-goals are as important as goals for keeping engineering focused."

- question: "What is the first of the four acceptance criteria rules?"
  answer: "Independently testable — each AC must be verifiable on its own without another AC being true first."

- question: "Why is 'and' not allowed in a single acceptance criterion?"
  answer: "A compound AC hides two requirements as one. If only one passes in the test suite, you cannot determine whether the feature is ready to ship. Always split compound ACs."

- question: "What is the 'behavior not implementation' AC rule?"
  answer: "ACs must describe what must be true from the user's perspective, not how to achieve it. 'Export completes within 10 seconds' is behavior. 'Use async job queue with Redis' is implementation — it belongs in an engineering ticket, not a spec."

- question: "What does 'measurable thresholds' mean as an AC rule?"
  answer: "Vague quality language ('fast', 'easy', 'intuitive') must be replaced with specific, testable numbers. 'Export completes within 10 seconds for up to 10 charts' is measurable. 'Export is fast' is not."

- question: "What are the four spec status tags and what do they mean?"
  answer: "DRAFT = working document, not ready for estimation. REVIEW = all sections complete, open questions have owners. REFINED = all questions resolved, effort estimated. SHIPPED = feature live, metrics tracked."

- question: "When is a spec over-specified?"
  answer: "When it tells engineers how to implement something — database schema, component names, algorithm choice. The spec should answer every product question and none of the engineering questions."

- question: "How does the /write-spec command from the official product-management plugin work?"
  answer: "It accepts a feature name, problem statement, or user request. It gathers context (user problem, target users, constraints, prior art), pulls from connected tools if available, and generates a structured PRD/spec with Problem Statement, Goals, Non-Goals, User Stories, Requirements, Success Metrics, Open Questions, and Timeline Considerations."

- question: "What is the relationship between L06's spec and L07's PRD?"
  answer: "The L06 feature spec describes one feature (trigger configuration) for one team. The L07 PRD wraps this spec and others into a multi-team initiative document (Workflow Builder) that covers commercial context, all features in scope, non-functional requirements, GTM plan, and dependencies."

- question: "What is the signal that a spec is over-specified?"
  answer: "If the spec mentions database schema, API endpoints, service names, or algorithm choices in the acceptance criteria — these are implementation details that belong in engineering tickets, not the spec."

- question: "What should the Open Questions section include for every question?"
  answer: "A number, the question text, the owner (by role: Eng lead, PM, Design, Legal), and a due date. Undated questions without owners do not get resolved."
