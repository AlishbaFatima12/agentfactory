deck:
  id: "ch36-01-pms-cognitive-load-problem"
  title: "Pms Cognitive Load Problem"
  description: "Key concepts and review questions covering pms cognitive load problem."
  tags: ["pms", "cognitive", "load", "problem", "chapter-36"]
  version: 1

cards:
  - id: "ch36-01-pms-cognitive-load-problem-001"
    front: "What are the five simultaneous cognitive roles a product manager occupies?"
    back: "Researcher (synthesising user data), Writer (producing specs and PRDs), Strategist (maintaining the roadmap), Communicator (translating decisions for different audiences), and Decision-maker (prioritising the backlog under competing pressures)."
    tags: ["simultaneous-cognitive", "cognitive-roles", "product"]
    difficulty: "basic"

  - id: "ch36-01-pms-cognitive-load-problem-002"
    front: "What is the 'document gap' in product management?"
    back: "The structural mismatch between the volume of writing required to PM well and the time available to PM well. It is not a skill gap or a laziness problem — it is a capacity constraint."
    tags: ["document-gap", "product-management"]
    difficulty: "basic"

  - id: "ch36-01-pms-cognitive-load-problem-003"
    front: "What is the most common failure mode caused by a rushed feature spec?"
    back: "Engineers build the wrong thing because the spec was ambiguous — they fill in the gaps using their own assumptions rather than the PM's intent."
    tags: ["failure-mode", "mode-caused", "rushed"]
    difficulty: "advanced"

  - id: "ch36-01-pms-cognitive-load-problem-004"
    front: "What is the observable difference between a high-quality acceptance criterion and a poor one?"
    back: "A high-quality AC is independently testable and does not contain 'and'. A poor AC describes UI appearance or uses subjective language like 'the feature should work correctly'."
    tags: ["observable-difference", "high-quality-acceptance", "high-quality"]
    difficulty: "intermediate"

  - id: "ch36-01-pms-cognitive-load-problem-005"
    front: "What does a high-quality stakeholder update do that a mediocre one does not?"
    back: "It is written for a specific audience's concerns, shows honest delta against the plan, names risks with impact and mitigation, and requests specific decisions with options and a recommendation."
    tags: ["high-quality-stakeholder", "stakeholder-update", "high-quality"]
    difficulty: "basic"

  - id: "ch36-01-pms-cognitive-load-problem-006"
    front: "What is the central thesis of Chapter 36 about AI and PM work?"
    back: "The PM's job is judgment. AI agents remove the bottleneck between that judgment and the documentation that expresses it. The agent writes the first draft; the PM reviews, directs, and refines."
    tags: ["central-thesis"]
    difficulty: "advanced"

  - id: "ch36-01-pms-cognitive-load-problem-007"
    front: "What distinguishes a high-quality research synthesis from a mediocre one?"
    back: "It distinguishes behavioral observations from stated preferences, grounds each insight with source count and quotes, includes an explicit 'what NOT to build' section, and connects findings directly to roadmap decisions."
    tags: ["high-quality-research", "research-synthesis", "distinguishes"]
    difficulty: "intermediate"

  - id: "ch36-01-pms-cognitive-load-problem-008"
    front: "What are the two plugins used in Chapter 36, and what does each cover?"
    back: "Layer 1 (official product-management plugin): foundational commands — write-spec, roadmap-update, synthesize-research, stakeholder-update, competitive-brief, metrics-review. Layer 2 (custom product-strategy plugin): workflow gap commands — brief, interview, prd, stories, prioritise, retro."
    tags: ["plugins", "cover"]
    difficulty: "basic"

  - id: "ch36-01-pms-cognitive-load-problem-009"
    front: "Why are the five PM roles described as 'simultaneous' rather than 'sequential'?"
    back: "A PM operates in all five modes at the same time. Drafting a spec requires strategic context, an update requires knowing what researchers found, prioritisation requires understanding the roadmap. None of the roles can be paused while another is active."
    tags: ["roles-described", "simultaneous", "sequential"]
    difficulty: "intermediate"

  - id: "ch36-01-pms-cognitive-load-problem-010"
    front: "What is the quality signal for the 'out of scope' section of a feature spec?"
    back: "High quality: explicit list with reasoning for each exclusion. Mediocre: partial list or implied scope. Poor: not addressed at all."
    tags: ["quality-signal", "scope-section", "feature"]
    difficulty: "advanced"

  - id: "ch36-01-pms-cognitive-load-problem-011"
    front: "What does the custom product-strategy plugin add that the official plugin does not cover?"
    back: "Discovery briefs, interview guides, PRDs, user stories, backlog prioritisation, and retrospectives — plus three agents for automating recurring PM intelligence work."
    tags: ["custom-product-strategy", "product-strategy-plugin", "product-strategy"]
    difficulty: "intermediate"

  - id: "ch36-01-pms-cognitive-load-problem-012"
    front: "According to the quality signal table, what is the most common failure in a 'problem statement' for a feature spec?"
    back: "The problem statement describes what to build (a solution) instead of describing observable user pain with supporting evidence."
    tags: ["quality-signal", "signal-table", "according"]
    difficulty: "advanced"
