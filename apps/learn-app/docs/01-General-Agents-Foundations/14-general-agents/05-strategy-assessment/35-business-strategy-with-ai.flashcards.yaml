deck:
  id: ch03-35-business-strategy-with-ai
  title: 'Business Strategy with AI: 10 MBA Frameworks'
  description: Flashcards covering Porter's Five Forces, Christensen disruption, Business Model Canvas, financial statements, BATNA/ZOPA, Jobs-to-be-Done, TAM/SAM/SOM, generic strategies, and the StratArts plugin.
  tags:
  - business-strategy
  - MBA-frameworks
  - porters-five-forces
  - disruption
  - financial-analysis
  - leadership
  version: 1
cards:
- id: ch03-35-business-strategy-001
  difficulty: basic
  front: Name Porter's Five Forces.
  back: '1. Threat of new entrants, 2. Bargaining power of suppliers, 3. Bargaining power of buyers, 4. Threat of substitutes, 5. Competitive rivalry among existing firms.'
  tags:
  - porters-five-forces
  - competitive-strategy
- id: ch03-35-business-strategy-002
  difficulty: intermediate
  front: What are Porter's three generic strategies for competing in an industry?
  back: 'BECAUSE no company can be everything to everyone, THEREFORE choose one: Cost Leadership (lowest cost), Differentiation (unique value), or Focus (niche market). Being "stuck in the middle" — trying all three — leads to below-average profitability.'
  why: Understanding generic strategies prevents the common mistake of trying to compete on every dimension simultaneously.
  tags:
  - porters-five-forces
  - generic-strategies
- id: ch03-35-business-strategy-003
  difficulty: basic
  front: What is "Jobs-to-be-Done" (JTBD) in Christensen's disruption theory?
  back: 'Customers do not buy products — they "hire" them to do a job. A milkshake''s job is not "be a dairy product" but "give me something to do during my boring commute." Understanding the real job reveals opportunities competitors miss.'
  tags:
  - disruption
  - jobs-to-be-done
- id: ch03-35-business-strategy-004
  difficulty: intermediate
  front: What is the Innovator's Dilemma?
  back: 'BECAUSE successful companies focus on their best customers and build features those customers request, THEREFORE they over-serve the mainstream market while ignoring simpler/cheaper alternatives that satisfy most customers — opening the door for disruptors who start low-end and move upmarket.'
  why: Explains why market leaders like Kodak, Blockbuster, and Nokia failed despite being well-managed.
  tags:
  - disruption
  - innovators-dilemma
- id: ch03-35-business-strategy-005
  difficulty: basic
  front: What are the three financial statements and what story does each tell?
  back: 'Income statement: how the business makes or loses money. Balance sheet: what the company owns vs what it owes. Cash flow statement: where real money moves.'
  tags:
  - financial-statements
  - accounting
- id: ch03-35-business-strategy-006
  difficulty: intermediate
  front: Why can a profitable company still go bankrupt?
  back: 'BECAUSE profit is an accounting concept (revenue minus expenses under accrual rules) while cash is actual money available, THEREFORE a company can show profits on the income statement but run out of cash if customers pay late, inventory ties up capital, or debt payments consume operating cash.'
  why: This distinction between profit and cash flow is the single most important concept in financial literacy.
  tags:
  - financial-statements
  - cash-vs-profit
- id: ch03-35-business-strategy-007
  difficulty: basic
  front: What do TAM, SAM, and SOM stand for?
  back: 'TAM = Total Addressable Market (entire market). SAM = Serviceable Addressable Market (portion you can reach). SOM = Serviceable Obtainable Market (realistic share you can capture). SOM is what matters for business planning.'
  tags:
  - market-sizing
  - tam-sam-som
- id: ch03-35-business-strategy-008
  difficulty: basic
  front: What are BATNA and ZOPA in negotiation?
  back: 'BATNA = Best Alternative to a Negotiated Agreement (your walk-away option). ZOPA = Zone of Possible Agreement (the range where both parties'' acceptable outcomes overlap).'
  tags:
  - negotiation
  - batna-zopa
- id: ch03-35-business-strategy-009
  difficulty: intermediate
  front: What are the 9 components of a Business Model Canvas?
  back: 'Key Partners, Key Activities, Key Resources, Value Propositions, Customer Relationships, Channels, Customer Segments, Cost Structure, Revenue Streams. The canvas forces you to articulate every component — gaps become visible immediately.'
  tags:
  - business-model-canvas
  - stratarts
- id: ch03-35-business-strategy-010
  difficulty: basic
  front: What does the Harvard Case Study Method teach that reading a textbook does not?
  back: 'Judgment. By analyzing a real company''s dilemma before knowing the outcome, you practice making decisions under uncertainty with incomplete information — the core skill of strategic thinking.'
  tags:
  - case-study-method
  - harvard
- id: ch03-35-business-strategy-011
  difficulty: basic
  front: How do you install the StratArts business strategy plugin in Claude Code?
  back: '`/plugin install stratarts@maigent` — gives you 27 business strategy skills including business-model-designer, competitive-intelligence, financial-model-architect, and go-to-market-planner.'
  tags:
  - stratarts
  - plugin-install
- id: ch03-35-business-strategy-012
  difficulty: intermediate
  front: When should you use a disruption analysis vs a Five Forces analysis?
  back: 'BECAUSE Five Forces maps current competitive pressure while disruption analysis identifies emerging threats from below, THEREFORE use Five Forces to understand the current industry structure and disruption analysis to evaluate whether that structure is about to change. Both are needed for a complete competitive picture.'
  why: Tests understanding of framework selection — the meta-skill of strategic analysis.
  tags:
  - framework-selection
  - porters-five-forces
  - disruption
