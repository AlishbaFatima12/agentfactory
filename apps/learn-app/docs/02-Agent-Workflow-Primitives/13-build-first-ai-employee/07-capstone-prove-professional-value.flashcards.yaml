deck:
  id: "ch13-07-prove-value"
  title: "Capstone: Prove Professional Value"
  description: "Key concepts from Chapter 13 Lesson 7 — autonomous reporting, data synthesis, multi-group architecture, and professional quality evaluation"
  tags: ["nanoclaw", "capstone", "reporting", "multi-group", "architecture"]
  version: 1

cards:
  - id: "ch13-07-prove-value-001"
    type: "thinking"
    front: "Why must an autonomous report contain a proactive recommendation, not just a summary?"
    back: "Summaries restate known information. Recommendations demonstrate analytical value — the employee spotted something the professional had not explicitly asked about. This is the difference between an employee that saves time reading data and one that generates new insight."
    tags: ["proactive-recommendation", "value"]
    difficulty: "intermediate"
    why: "How do you evaluate whether a recommendation is genuinely useful versus obvious?"

  - id: "ch13-07-prove-value-002"
    type: "recall"
    front: "What four Silver acceptance criteria must the autonomous report meet?"
    back: "1. Runs on schedule, delivered via channel\n2. Reads from 2+ data sources\n3. Contains proactive recommendation\n4. Professional quality (shareable with boss/client)"
    tags: ["silver", "acceptance-criteria"]
    difficulty: "intermediate"

  - id: "ch13-07-prove-value-003"
    type: "thinking"
    front: "Why does cross-referencing two data sources create more value than reading each separately?"
    back: "Individual sources show facts. Cross-referencing reveals patterns invisible in either alone — bank data shows spending, invoices show receivables, but combining them reveals cash flow risk two weeks before it hits. Synthesis creates insight that neither source provides alone."
    tags: ["data-synthesis", "cross-reference"]
    difficulty: "intermediate"
    why: "What makes two data sources complementary versus redundant?"

  - id: "ch13-07-prove-value-004"
    type: "recall"
    front: "What three groups does the Gold multi-group architecture require?"
    back: "1. `main` (admin and control)\n2. Professional work group (domain tasks)\n3. Client-facing group (limited scope, restricted data)"
    tags: ["gold", "multi-group"]
    difficulty: "basic"

  - id: "ch13-07-prove-value-005"
    type: "thinking"
    front: "Why is demonstrated isolation more important than configured isolation in the Gold tier?"
    back: "Configuration states intent but does not prove enforcement. Demonstrating that a non-admin group cannot perform admin actions proves the boundaries actually work. In security, untested controls are assumed broken — only tested isolation provides real confidence."
    tags: ["isolation", "testing"]
    difficulty: "advanced"
    why: "How would you test isolation between NanoClaw groups?"

  - id: "ch13-07-prove-value-006"
    type: "recall"
    front: "What additional deliverables does Gold tier require beyond Silver?"
    back: "1. Three groups with distinct CLAUDE.md files\n2. Isolation test results\n3. System architecture diagram"
    tags: ["gold", "deliverables"]
    difficulty: "intermediate"

  - id: "ch13-07-prove-value-007"
    type: "thinking"
    front: "Why does the professional quality criterion ask 'would you share this with your boss?'"
    back: "This question forces honest evaluation against real standards. A report you would edit before sharing has identifiable defects. A report you would share means the AI employee's output has reached the minimum bar for professional trust — the threshold where automation delivers actual value."
    tags: ["quality-standard", "professional-trust"]
    difficulty: "intermediate"
    why: "How does the 'would you share it' test differ from a technical correctness check?"

  - id: "ch13-07-prove-value-008"
    type: "thinking"
    front: "Why does the Gold architecture separate admin from professional work rather than giving all groups full access?"
    back: "Separation prevents privilege escalation. A client-facing group with admin access could leak internal data or modify system configuration. Isolation ensures that each context has only the minimum capabilities it needs, mirroring how real organizations restrict access by role."
    tags: ["isolation", "least-privilege"]
    difficulty: "advanced"
    why: "How does multi-group isolation mirror organizational access control in non-AI systems?"

  - id: "ch13-07-prove-value-009"
    type: "recall"
    front: "What is the professional quality test for a Silver-tier autonomous report?"
    back: "Would you share it with your boss, client, or colleague without embarrassment?"
    tags: ["quality-bar", "silver"]
    difficulty: "basic"

  - id: "ch13-07-prove-value-010"
    type: "recall"
    front: "Name any 3 of the 6 steps in the Silver report skill implementation guide."
    back: "Read source A, read source B, cross-reference for patterns, generate recommendations, format the report, deliver via channel"
    tags: ["implementation", "silver"]
    difficulty: "intermediate"
