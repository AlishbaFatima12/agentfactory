deck:
  id: "ch13-02-employee-skill"
  title: "Teach Your Employee a Skill"
  description: "Key concepts from Chapter 13 Lesson 2 — skill authoring, domain decision rules, YAML frontmatter, and expert knowledge encoding"
  tags: ["nanoclaw", "skill-md", "decision-rules", "expertise"]
  version: 1

cards:
  - id: "ch13-02-employee-skill-001"
    type: "recall"
    front: "What is the correct file path structure for a custom NanoClaw skill?"
    back: "`.claude/skills/your-skill-name/SKILL.md`"
    tags: ["file-structure", "skills"]
    difficulty: "basic"

  - id: "ch13-02-employee-skill-002"
    type: "thinking"
    front: "Why should a skill encode decision rules rather than task steps?"
    back: "Steps describe a sequence anyone can follow. Decision rules encode the judgment an expert applies — like 'flag invoices deviating 15% from vendor history.' Steps produce generic output; decision rules produce expert-level output that requires experience to replicate."
    tags: ["decision-rules", "expertise"]
    difficulty: "intermediate"
    why: "What is the difference between automating a process and encoding expertise?"

  - id: "ch13-02-employee-skill-003"
    type: "recall"
    front: "What two YAML frontmatter fields are required in a NanoClaw SKILL.md file?"
    back: "`name` and `description`"
    tags: ["yaml", "skill-structure"]
    difficulty: "basic"

  - id: "ch13-02-employee-skill-004"
    type: "recall"
    front: "What six content sections should a well-structured SKILL.md contain?"
    back: "1. Title and purpose\n2. When to use\n3. Decision rules\n4. Input format\n5. Output format\n6. Edge cases"
    tags: ["skill-structure", "sections"]
    difficulty: "intermediate"

  - id: "ch13-02-employee-skill-005"
    type: "thinking"
    front: "A consultant's proposal-builder skill produces generic deliverable lists. How would adding decision rules fix this?"
    back: "Decision rules like 'estimate effort using the firm's standard complexity multipliers' and 'flag deliverables requiring skills outside team capacity' inject firm-specific judgment. Without these rules, the skill operates on general knowledge rather than the consultant's actual methodology."
    tags: ["decision-rules", "domain-specificity"]
    difficulty: "intermediate"
    why: "How do you identify which professional decisions are worth encoding versus leaving to general AI capability?"

  - id: "ch13-02-employee-skill-006"
    type: "recall"
    front: "What should the description field in a SKILL.md YAML frontmatter start with?"
    back: "\"This skill should be used when...\""
    tags: ["yaml", "conventions"]
    difficulty: "basic"

  - id: "ch13-02-employee-skill-007"
    type: "thinking"
    front: "Why does the lesson require at least 5 domain decision rules instead of allowing fewer?"
    back: "Fewer than 5 rules typically means the skill encodes surface-level knowledge only. Real professional judgment involves multiple interacting checks — missing one creates blind spots where the skill produces amateur-level output on edge cases."
    tags: ["decision-rules", "quality-bar"]
    difficulty: "intermediate"
    why: "How would you test whether your decision rules are detailed enough?"

  - id: "ch13-02-employee-skill-008"
    type: "thinking"
    front: "Why is testing a skill with realistic inputs more valuable than reviewing the SKILL.md file for correctness?"
    back: "A SKILL.md can look correct on paper but fail in practice because rules interact unpredictably with real inputs. Testing reveals gaps between what you wrote and what the agent actually does — the same reason software tests catch bugs that code reviews miss."
    tags: ["testing", "validation"]
    difficulty: "advanced"
    why: "What types of skill defects are invisible in a code review but obvious in testing?"

  - id: "ch13-02-employee-skill-009"
    type: "recall"
    front: "How is a NanoClaw skill invoked from WhatsApp?"
    back: "Via `/your-skill-name` command"
    tags: ["invocation", "whatsapp"]
    difficulty: "basic"

  - id: "ch13-02-employee-skill-010"
    type: "thinking"
    front: "Why does the lesson emphasize edge cases as a required section in SKILL.md?"
    back: "Edge cases are where professional judgment matters most — a recruiter screening a career-changer's resume or an accountant handling a partial payment. Without explicit edge case handling, the skill defaults to generic behavior precisely when domain expertise is most needed."
    tags: ["edge-cases", "expertise"]
    difficulty: "advanced"
    why: "How do edge cases in your profession differ from edge cases in software testing?"
