deck:
  id: "ch13-04-bronze-capstone"
  title: "Bronze Capstone: First Real Day"
  description: "Key concepts from Chapter 13 Lesson 4 — structured evaluation, rubric-based assessment, ambiguity testing, and iterative improvement"
  tags: ["nanoclaw", "evaluation", "capstone", "testing"]
  version: 1

cards:
  - id: "ch13-04-bronze-capstone-001"
    type: "recall"
    front: "What six dimensions does the Bronze capstone evaluation rubric measure?"
    back: "1. Domain accuracy\n2. Appropriate tone\n3. Skill usage\n4. Connection usage\n5. Clarification behavior\n6. Iteration quality"
    tags: ["rubric", "evaluation"]
    difficulty: "intermediate"

  - id: "ch13-04-bronze-capstone-002"
    type: "thinking"
    front: "Why must at least one test task be deliberately ambiguous?"
    back: "Ambiguous tasks test whether the employee asks for clarification instead of guessing. An employee that guesses on 'handle this tax situation' without asking the jurisdiction could produce dangerously wrong advice — clarification behavior separates safe from unsafe AI."
    tags: ["ambiguity", "safety"]
    difficulty: "intermediate"
    why: "How does clarification behavior relate to professional liability?"

  - id: "ch13-04-bronze-capstone-003"
    type: "recall"
    front: "What two deliverable files does the Bronze capstone require for the project repository?"
    back: "`conversation-log.md` and `evaluation.md`"
    tags: ["deliverables", "bronze"]
    difficulty: "basic"

  - id: "ch13-04-bronze-capstone-004"
    type: "thinking"
    front: "Why does the capstone require at least one response improved through follow-up iteration?"
    back: "Iteration tests the feedback loop — whether the employee adapts when corrected. A system that produces the same quality regardless of feedback cannot improve, which means the professional must accept first-draft quality forever instead of refining toward expertise."
    tags: ["iteration", "feedback"]
    difficulty: "intermediate"
    why: "What does iteration quality reveal about the effectiveness of your CLAUDE.md configuration?"

  - id: "ch13-04-bronze-capstone-005"
    type: "recall"
    front: "What is the recommended task order for structured AI employee evaluation?"
    back: "1. Routine (identity/tone)\n2. Skill-heavy (L02 skill)\n3. Connection-dependent (L03)\n4. Ambiguous (clarification)\n5. Complex (everything combined)"
    tags: ["testing-order", "methodology"]
    difficulty: "intermediate"

  - id: "ch13-04-bronze-capstone-006"
    type: "thinking"
    front: "How does using real professional tasks instead of hypothetical scenarios improve evaluation quality?"
    back: "Real tasks carry the nuance and ambiguity of actual work — details that hypothetical scenarios miss. An accountant reviewing a real invoice discovers edge cases their SKILL.md handles incorrectly, while a made-up invoice tests only the obvious paths."
    tags: ["real-tasks", "evaluation-quality"]
    difficulty: "advanced"
    why: "What types of defects are invisible in hypothetical testing but surface with real data?"

  - id: "ch13-04-bronze-capstone-007"
    type: "thinking"
    front: "Why is the evaluation goal 'honest assessment' rather than 'perfect score'?"
    back: "A perfect score means the test was too easy or the assessment was dishonest. The purpose is identifying gaps between expected and actual behavior so the employee can be improved. Honest low scores on specific dimensions provide more actionable information than inflated high scores."
    tags: ["self-assessment", "honesty"]
    difficulty: "intermediate"
    why: "How does honest self-assessment improve the next iteration of your AI employee?"

  - id: "ch13-04-bronze-capstone-008"
    type: "recall"
    front: "What four requirements must the Bronze capstone test tasks collectively satisfy?"
    back: "1. Use L02 skill\n2. Use L03 connection\n3. Include ambiguous task\n4. Total 3-5 real professional tasks"
    tags: ["requirements", "bronze"]
    difficulty: "basic"
