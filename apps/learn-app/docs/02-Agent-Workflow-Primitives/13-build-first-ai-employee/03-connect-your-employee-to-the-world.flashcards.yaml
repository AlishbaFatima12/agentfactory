deck:
  id: "ch13-03-connect-world"
  title: "Connect Your Employee to the World"
  description: "Key concepts from Chapter 13 Lesson 3 — channel integration, MCP servers, and data boundary analysis"
  tags: ["nanoclaw", "channels", "mcp", "data-boundaries"]
  version: 1

cards:
  - id: "ch13-03-connect-world-001"
    type: "recall"
    front: "What are the two paths for connecting a NanoClaw employee to external systems?"
    back: "1. Add a channel (Telegram, Gmail, Slack, Discord)\n2. Add an MCP server (domain-specific tool access)"
    tags: ["channels", "mcp", "integration-paths"]
    difficulty: "basic"

  - id: "ch13-03-connect-world-002"
    type: "thinking"
    front: "Why should connection choice be driven by professional domain fit rather than technical ease?"
    back: "An easy-to-add channel that does not match the profession's workflow creates capability without value. An accountant adding Discord gains nothing, while adding Gmail enables invoice processing — the connection must match where professional work actually happens."
    tags: ["connection-choice", "domain-fit"]
    difficulty: "intermediate"
    why: "How would you evaluate the ROI of a potential integration before building it?"

  - id: "ch13-03-connect-world-003"
    type: "recall"
    front: "What NanoClaw commands add communication channels?"
    back: "Built-in `/add-*` commands (e.g., `/add-telegram`, `/add-gmail`, `/add-slack`)"
    tags: ["channels", "commands"]
    difficulty: "basic"

  - id: "ch13-03-connect-world-004"
    type: "thinking"
    front: "Why does the lesson require documenting what data crosses the container boundary?"
    back: "Container boundaries are security perimeters. Without documentation, professionals cannot assess what client or sensitive data their AI employee exposes to external services. This awareness is a prerequisite for responsible deployment in regulated professions."
    tags: ["data-boundaries", "security"]
    difficulty: "intermediate"
    why: "What would a client or employer want to know about your AI employee's data exposure?"

  - id: "ch13-03-connect-world-005"
    type: "recall"
    front: "What three questions should you answer when analyzing data boundaries for a NanoClaw connection?"
    back: "1. What data goes OUT?\n2. What data comes IN?\n3. What is stored inside the container?"
    tags: ["data-boundaries", "analysis"]
    difficulty: "intermediate"

  - id: "ch13-03-connect-world-006"
    type: "thinking"
    front: "A teacher adds Slack for parent communication. What data boundary risk is most critical?"
    back: "Student personal information could cross the boundary if the employee references student data in parent messages. The boundary must prevent the employee from including information about other students or internal assessment notes in external-facing communications."
    tags: ["data-boundaries", "profession-specific"]
    difficulty: "advanced"
    why: "How do data boundary requirements differ between internal-facing and external-facing channels?"

  - id: "ch13-03-connect-world-007"
    type: "thinking"
    front: "Why choose an MCP server over a channel when both could serve a profession?"
    back: "Channels enable communication (send/receive messages). MCP servers enable tool access (read data, execute actions). If the professional need is accessing external data or systems rather than messaging, MCP provides direct programmatic access instead of message-based workarounds."
    tags: ["channels-vs-mcp", "architecture"]
    difficulty: "intermediate"
    why: "When would you need both a channel and an MCP server for the same integration?"

  - id: "ch13-03-connect-world-008"
    type: "recall"
    front: "What deliverable does Lesson 3 require for the project repository?"
    back: "Documentation of connection choice, data boundary analysis, and proof of working connection"
    tags: ["deliverables", "documentation"]
    difficulty: "basic"
