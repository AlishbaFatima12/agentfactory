deck:
  id: "p0-ch05-rewrite-diagnosis"
  title: "The Rewrite Diagnosis"
  description: "Key concepts from the strategic email diagnosis and rewriting exercise"
  tags: ["Part 0", "communication", "strategic-diagnosis", "email-rewriting"]
  version: 1

cards:
  - id: "p0-ch05-rewrite-diagnosis-001"
    front: "What kinds of errors does the Rewrite Diagnosis exercise train students to detect?"
    back: "Strategic errors: tone, emphasis, audience mismatch, and buried lead -- not grammar or spelling."
    tags: ["strategic-diagnosis", "communication-errors"]
    difficulty: "basic"

  - id: "p0-ch05-rewrite-diagnosis-002"
    front: "What three elements must the diagnosis document contain before rewriting the email?"
    back: "1. Strategic errors identified\n2. Predicted recipient reaction\n3. Predicted behavioral outcome"
    tags: ["diagnosis", "deliverable"]
    difficulty: "basic"

  - id: "p0-ch05-rewrite-diagnosis-003"
    front: "Why must the diagnosis be completed BEFORE the rewrite, not during or after?"
    back: "Because diagnosing forces analytical thinking about WHY the message fails. Students who jump straight to rewriting fix surface problems but miss the core strategic issue that makes the email ineffective."
    tags: ["diagnosis", "strategic-thinking"]
    difficulty: "intermediate"
    why: "How would you verify that a student actually diagnosed before rewriting rather than reverse-engineering the diagnosis after?"

  - id: "p0-ch05-rewrite-diagnosis-004"
    front: "An email is grammatically perfect but the recipient ignores it. How is this a strategic failure rather than a writing failure?"
    back: "Because the email failed its purpose despite good writing. Strategic failures are about wrong emphasis, audience mismatch, or buried lead -- problems invisible to grammar checkers but fatal to communication."
    tags: ["strategic-vs-grammatical", "communication"]
    difficulty: "intermediate"
    why: "What tool or method could detect strategic failures that grammar tools miss?"

  - id: "p0-ch05-rewrite-diagnosis-005"
    front: "Why is predicting the recipient's behavioral outcome more useful than predicting their emotional response?"
    back: "Emotions are internal and transient. Behavioral outcomes (what they DO or don't do) are the measurable consequence that determines whether the communication achieved its purpose."
    tags: ["behavioral-outcome", "communication"]
    difficulty: "advanced"
    why: "Can a recipient feel positively about an email but still take the wrong action?"

  - id: "p0-ch05-rewrite-diagnosis-006"
    front: "How does Chapter 2's Error Taxonomy apply to communication diagnosis?"
    back: "Students use the same diagnostic rigor but detect communication errors (wrong emphasis, audience mismatch) instead of factual or logical errors."
    tags: ["error-taxonomy", "cross-chapter"]
    difficulty: "intermediate"

  - id: "p0-ch05-rewrite-diagnosis-007"
    front: "Which assessment layer does the Rewrite Diagnosis exercise use?"
    back: "Layer 2 (Reasoning Receipt)."
    tags: ["assessment-layers"]
    difficulty: "basic"

  - id: "p0-ch05-rewrite-diagnosis-008"
    front: "Why is the poorly written email in this exercise generated by AI to be subtly wrong in tone rather than grammar?"
    back: "Because surface quality makes strategic errors harder to spot. A polished email forces students to look past good writing to find the strategic failure underneath -- the real-world skill this exercise trains."
    tags: ["exercise-design", "strategic-diagnosis"]
    difficulty: "advanced"
    why: "Would the exercise be more or less effective if the email also had obvious grammar mistakes?"
