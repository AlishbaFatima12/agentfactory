deck:
  id: "p0-intro-forward-map"
  title: "Forward Map and Score Card"
  description: "How the ten chapters connect and the Thinking Score Card system for tracking growth"
  tags: ["Part 0", "forward map", "score card", "chapter connections"]
  version: 1

cards:
  - id: "p0-intro-forward-map-001"
    front: "In Part 0, what format from Chapter 1 becomes the universal starting point for Chapters 2, 4, 7, and 9?"
    back: "The Prediction Lock format."
    tags: ["prediction-lock", "forward-map"]
    difficulty: "basic"

  - id: "p0-intro-forward-map-002"
    front: "What are the five dimensions of the Thinking Score Card, each scored 1-10?"
    back: "1. Independent Thinking\n2. Critical Evaluation\n3. Reasoning Depth\n4. Originality\n5. Self-Awareness"
    tags: ["score-card", "dimensions"]
    difficulty: "basic"

  - id: "p0-intro-forward-map-003"
    front: "Which Chapter 3 technique applies in Chapters 7, 8, and 9 for tracing consequences across stakeholders, creative designs, and uncertain environments?"
    back: "The Cascade Map technique."
    tags: ["cascade-map", "forward-map"]
    difficulty: "intermediate"

  - id: "p0-intro-forward-map-004"
    front: "Why does Part 0 use five Score Card dimensions instead of a single overall thinking score?"
    back: "Single scores hide strengths and weaknesses. Five dimensions let students track which specific thinking skills improve and which plateau, making growth patterns visible across 40 exercises."
    tags: ["score-card", "assessment-design"]
    difficulty: "intermediate"
    why: "How would a student use dimension-level data differently than a single score?"

  - id: "p0-intro-forward-map-005"
    front: "Which chapter's skill is described as 'your operating system for Parts 2-10' for navigating unfamiliar technologies?"
    back: "Chapter 10: Learning How to Learn (Personal Learning Framework)."
    tags: ["meta-learning", "forward-map"]
    difficulty: "basic"

  - id: "p0-intro-forward-map-006"
    front: "A student skips Chapter 6 (Working With AI). How does this affect their work in Chapters 8, 9, and 10?"
    back: "They lack the Collaboration Log format, the override instinct for rejecting bad AI output, and the three-path comparison mental model -- all tools those chapters explicitly build upon."
    tags: ["forward-map", "dependencies"]
    difficulty: "advanced"
    why: "Which of these three missing skills would cause the most immediate problems?"

  - id: "p0-intro-forward-map-007"
    front: "What does the Thinking Score Card's Independent Thinking dimension measure?"
    back: "Whether the student produced genuine thought before or beyond AI -- evidence of predictions, original analysis, or ideas AI would not generate independently."
    tags: ["score-card", "independent-thinking"]
    difficulty: "intermediate"

  - id: "p0-intro-forward-map-008"
    front: "How many total exercises does Part 0 contain across all 10 chapters?"
    back: "40 exercises (4 per chapter, 10 chapters)."
    tags: ["Part 0", "structure"]
    difficulty: "basic"

  - id: "p0-intro-forward-map-009"
    front: "Why does the forward map call Chapter 9's Reversal Trigger the 'most transferable skill' to building-focused parts?"
    back: "Every architectural, design, and strategic decision in Parts 2-10 involves incomplete information. The Reversal Trigger -- knowing what would make you change your mind -- applies to every decision under uncertainty."
    tags: ["reversal-trigger", "forward-map"]
    difficulty: "advanced"
    why: "How does a Reversal Trigger differ from simply changing your mind when new data arrives?"

  - id: "p0-intro-forward-map-010"
    front: "What does the Thinking Score Card's Self-Awareness dimension measure?"
    back: "Whether the student accurately understands their own strengths, weaknesses, and confidence levels -- evidence of calibrated confidence and honest gap identification."
    tags: ["score-card", "self-awareness"]
    difficulty: "intermediate"

  - id: "p0-intro-forward-map-011"
    front: "Chapter 7's Stakeholder Cost Matrix applies to which future parts of the book?"
    back: "Parts 5-10, whenever building AI systems that affect real people."
    tags: ["stakeholder-cost-matrix", "forward-map"]
    difficulty: "basic"

  - id: "p0-intro-forward-map-012"
    front: "Why is the Originality dimension a meaningful signal of cognitive engagement rather than just creativity?"
    back: "When students receive the same problem and AI tools, those who outsourced produce nearly identical outputs. Divergence from standard AI output proves the student added genuine thinking beyond what AI would generate alone."
    tags: ["score-card", "originality", "divergence"]
    difficulty: "intermediate"
    why: "Could a student deliberately produce originality without genuine thinking? How?"
