<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 720" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <radialGradient id="bg1" cx="85%" cy="15%" r="40%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg2" cx="10%" cy="75%" r="35%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg3" cx="80%" cy="80%" r="30%">
      <stop offset="0%" stop-color="#f9a8d4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f9a8d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg4" cx="30%" cy="10%" r="25%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <filter id="s1"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity="0.12"/></filter>
    <filter id="s2"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#db2777"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1050" height="720" fill="#fefdfb"/>
  <rect width="1050" height="720" fill="url(#bg1)"/>
  <rect width="1050" height="720" fill="url(#bg2)"/>
  <rect width="1050" height="720" fill="url(#bg3)"/>
  <rect width="1050" height="720" fill="url(#bg4)"/>

  <!-- Small decorative circles scattered -->
  <circle cx="900" cy="100" r="30" fill="#c084fc" opacity="0.08"/>
  <circle cx="920" cy="130" r="15" fill="#f472b6" opacity="0.1"/>
  <circle cx="130" cy="620" r="25" fill="#38bdf8" opacity="0.08"/>
  <circle cx="100" cy="590" r="12" fill="#2dd4a8" opacity="0.1"/>
  <circle cx="880" cy="600" r="20" fill="#f5a623" opacity="0.08"/>

  <!-- Title -->
  <text x="525" y="50" text-anchor="middle" font-size="32" font-weight="800" fill="#1a1a1a" letter-spacing="-0.5">The Five-Layer Cake of AI</text>

  <!-- ================================================================ -->
  <!-- LAYER 1: ENERGY — bottom, widest                                  -->
  <!-- Front face (tall rounded rect)                                    -->
  <!-- ================================================================ -->
  <g filter="url(#s1)">
    <!-- Front -->
    <path d="M 280,575 L 280,625 Q 280,640 295,640 L 725,640 Q 740,640 740,625 L 740,575 Z" fill="#e8921a"/>
    <!-- Top surface -->
    <path d="M 280,575 L 310,545 L 770,545 L 740,575 Z" fill="#f5a623"/>
    <!-- Right side -->
    <path d="M 740,575 L 770,545 L 770,610 Q 770,625 770,625 L 740,640 L 740,575 Z" fill="#c47a15"/>
    <!-- Top surface highlight -->
    <path d="M 310,545 L 340,525 L 740,525 L 770,545 Z" fill="#fcc96d" opacity="0.4"/>
  </g>
  <!-- ICONS on top: lightning bolts, sun, wind turbine -->
  <!-- Lightning bolt 1 -->
  <polygon points="420,540 430,525 425,535 435,520" fill="#fff" opacity="0.6" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="440,558 448,540 444,550 452,532 448,545 456,528" fill="#fde68a" opacity="0.7"/>
  <!-- Sun -->
  <circle cx="520" cy="540" r="12" fill="#fde68a" opacity="0.6"/>
  <circle cx="520" cy="540" r="7" fill="#f59e0b" opacity="0.5"/>
  <line x1="520" y1="524" x2="520" y2="520" stroke="#fde68a" stroke-width="2" opacity="0.5"/>
  <line x1="520" y1="556" x2="520" y2="560" stroke="#fde68a" stroke-width="2" opacity="0.5"/>
  <line x1="504" y1="540" x2="500" y2="540" stroke="#fde68a" stroke-width="2" opacity="0.5"/>
  <line x1="536" y1="540" x2="540" y2="540" stroke="#fde68a" stroke-width="2" opacity="0.5"/>
  <!-- Power tower -->
  <line x1="620" y1="555" x2="620" y2="525" stroke="#fff" stroke-width="2.5" opacity="0.5"/>
  <line x1="610" y1="530" x2="630" y2="530" stroke="#fff" stroke-width="2" opacity="0.5"/>
  <line x1="612" y1="538" x2="628" y2="538" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
  <!-- Lightning bolt 2 -->
  <polygon points="680,555 688,538 684,547 692,530 688,542 696,525" fill="#fde68a" opacity="0.6"/>

  <!-- Label -->
  <text x="265" y="580" text-anchor="end" font-size="17" font-weight="800" fill="#1a1a1a">Layer 1: Energy</text>
  <text x="265" y="598" text-anchor="end" font-size="12" fill="#555">The foundational power required</text>
  <text x="265" y="613" text-anchor="end" font-size="12" fill="#555">to run all AI systems,</text>
  <text x="265" y="628" text-anchor="end" font-size="12" fill="#555">supercomputers, and data centers.</text>

  <!-- ================================================================ -->
  <!-- LAYER 2: CHIPS                                                    -->
  <!-- ================================================================ -->
  <g filter="url(#s1)">
    <path d="M 310,470 L 310,520 Q 310,530 322,530 L 698,530 Q 710,530 710,520 L 710,470 Z" fill="#1fb890"/>
    <path d="M 310,470 L 338,442 L 738,442 L 710,470 Z" fill="#2dd4a8"/>
    <path d="M 710,470 L 738,442 L 738,502 L 710,530 Z" fill="#189e7c"/>
    <path d="M 338,442 L 360,426 L 720,426 L 738,442 Z" fill="#6ee7c2" opacity="0.35"/>
  </g>
  <!-- ICONS: circuit board, chip, processor -->
  <!-- Main chip -->
  <rect x="460" y="435" width="36" height="30" rx="3" fill="#fff" opacity="0.35" stroke="#fff" stroke-width="1"/>
  <rect x="467" y="441" width="22" height="18" rx="2" fill="#1fb890" opacity="0.6" stroke="#fff" stroke-width="0.8"/>
  <!-- Chip pins -->
  <line x1="468" y1="433" x2="468" y2="427" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
  <line x1="476" y1="433" x2="476" y2="427" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
  <line x1="484" y1="433" x2="484" y2="427" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
  <line x1="468" y1="467" x2="468" y2="473" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
  <line x1="476" y1="467" x2="476" y2="473" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
  <line x1="484" y1="467" x2="484" y2="473" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
  <line x1="458" y1="444" x2="452" y2="444" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
  <line x1="458" y1="452" x2="452" y2="452" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
  <line x1="498" y1="444" x2="504" y2="444" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
  <line x1="498" y1="452" x2="504" y2="452" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
  <!-- Circuit traces -->
  <line x1="510" y1="445" x2="560" y2="445" stroke="#fff" stroke-width="1.5" opacity="0.3"/>
  <line x1="540" y1="445" x2="540" y2="460" stroke="#fff" stroke-width="1.5" opacity="0.3"/>
  <line x1="540" y1="460" x2="580" y2="460" stroke="#fff" stroke-width="1.5" opacity="0.3"/>
  <circle cx="580" cy="460" r="3" fill="#fff" opacity="0.35"/>
  <line x1="560" y1="445" x2="560" y2="435" stroke="#fff" stroke-width="1.5" opacity="0.3"/>
  <circle cx="560" cy="435" r="3" fill="#fff" opacity="0.35"/>
  <!-- Second smaller chip -->
  <rect x="610" y="438" width="24" height="20" rx="2" fill="#fff" opacity="0.25" stroke="#fff" stroke-width="0.8"/>
  <rect x="615" y="443" width="14" height="10" rx="1" fill="#1fb890" opacity="0.5"/>
  <line x1="400" y1="450" x2="450" y2="450" stroke="#fff" stroke-width="1" opacity="0.25"/>
  <line x1="420" y1="450" x2="420" y2="440" stroke="#fff" stroke-width="1" opacity="0.25"/>
  <circle cx="420" cy="438" r="2.5" fill="#fff" opacity="0.3"/>

  <!-- Label -->
  <text x="295" y="478" text-anchor="end" font-size="17" font-weight="800" fill="#1a1a1a">Layer 2: Chips</text>
  <text x="295" y="496" text-anchor="end" font-size="12" fill="#555">The specialized semiconductors</text>
  <text x="295" y="511" text-anchor="end" font-size="12" fill="#555">and processors that perform the</text>
  <text x="295" y="526" text-anchor="end" font-size="12" fill="#555">complex calculations for AI tasks.</text>

  <!-- ================================================================ -->
  <!-- LAYER 3: INFRASTRUCTURE                                           -->
  <!-- ================================================================ -->
  <g filter="url(#s1)">
    <path d="M 340,365 L 340,415 Q 340,425 352,425 L 668,425 Q 680,425 680,415 L 680,365 Z" fill="#2098d4"/>
    <path d="M 340,365 L 366,339 L 706,339 L 680,365 Z" fill="#38bdf8"/>
    <path d="M 680,365 L 706,339 L 706,399 L 680,425 Z" fill="#1a7eb5"/>
    <path d="M 366,339 L 386,325 L 692,325 L 706,339 Z" fill="#7dd3fc" opacity="0.35"/>
  </g>
  <!-- ICONS: server racks, cloud, data center building -->
  <!-- Server rack 1 -->
  <rect x="420" y="330" width="22" height="32" rx="2" fill="#fff" opacity="0.35"/>
  <line x1="424" y1="338" x2="438" y2="338" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
  <line x1="424" y1="343" x2="438" y2="343" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
  <line x1="424" y1="348" x2="438" y2="348" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
  <line x1="424" y1="353" x2="438" y2="353" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
  <circle cx="437" cy="338" r="1.5" fill="#4ade80" opacity="0.7"/>
  <circle cx="437" cy="343" r="1.5" fill="#4ade80" opacity="0.7"/>
  <circle cx="437" cy="348" r="1.5" fill="#fbbf24" opacity="0.7"/>
  <!-- Server rack 2 -->
  <rect x="448" y="330" width="22" height="32" rx="2" fill="#fff" opacity="0.3"/>
  <line x1="452" y1="338" x2="466" y2="338" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
  <line x1="452" y1="343" x2="466" y2="343" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
  <line x1="452" y1="348" x2="466" y2="348" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
  <line x1="452" y1="353" x2="466" y2="353" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
  <circle cx="465" cy="338" r="1.5" fill="#4ade80" opacity="0.7"/>
  <circle cx="465" cy="343" r="1.5" fill="#4ade80" opacity="0.7"/>
  <!-- Cloud shape -->
  <ellipse cx="540" cy="345" rx="20" ry="12" fill="#fff" opacity="0.3"/>
  <ellipse cx="530" cy="347" rx="14" ry="10" fill="#fff" opacity="0.25"/>
  <ellipse cx="552" cy="347" rx="14" ry="10" fill="#fff" opacity="0.25"/>
  <!-- Data center building -->
  <rect x="600" y="332" width="30" height="28" rx="2" fill="#fff" opacity="0.3"/>
  <rect x="605" y="336" width="8" height="6" rx="1" fill="#38bdf8" opacity="0.4"/>
  <rect x="617" y="336" width="8" height="6" rx="1" fill="#38bdf8" opacity="0.4"/>
  <rect x="605" y="346" width="8" height="6" rx="1" fill="#38bdf8" opacity="0.4"/>
  <rect x="617" y="346" width="8" height="6" rx="1" fill="#38bdf8" opacity="0.4"/>
  <rect x="612" y="355" width="6" height="5" rx="0" fill="#38bdf8" opacity="0.35"/>

  <!-- Label -->
  <text x="325" y="375" text-anchor="end" font-size="17" font-weight="800" fill="#1a1a1a">Layer 3: Infrastructure</text>
  <text x="325" y="393" text-anchor="end" font-size="12" fill="#555">The physical data centers and</text>
  <text x="325" y="408" text-anchor="end" font-size="12" fill="#555">supercomputers that house, cool,</text>
  <text x="325" y="423" text-anchor="end" font-size="12" fill="#555">and operate the AI hardware.</text>

  <!-- ================================================================ -->
  <!-- LAYER 4: MODELS                                                   -->
  <!-- ================================================================ -->
  <g filter="url(#s1)">
    <path d="M 370,260 L 370,310 Q 370,320 382,320 L 638,320 Q 650,320 650,310 L 650,260 Z" fill="#8b3ed4"/>
    <path d="M 370,260 L 394,236 L 674,236 L 650,260 Z" fill="#a855f7"/>
    <path d="M 650,260 L 674,236 L 674,296 L 650,320 Z" fill="#7630b5"/>
    <path d="M 394,236 L 412,224 L 664,224 L 674,236 Z" fill="#c084fc" opacity="0.35"/>
  </g>
  <!-- ICONS: neural network, brain, code -->
  <!-- Neural network nodes -->
  <circle cx="440" cy="238" r="6" fill="#fff" opacity="0.4"/>
  <circle cx="480" cy="228" r="6" fill="#fff" opacity="0.35"/>
  <circle cx="520" cy="242" r="6" fill="#fff" opacity="0.4"/>
  <circle cx="560" cy="230" r="6" fill="#fff" opacity="0.35"/>
  <circle cx="600" cy="240" r="6" fill="#fff" opacity="0.4"/>
  <!-- Connections -->
  <line x1="446" y1="237" x2="474" y2="230" stroke="#fff" stroke-width="1.5" opacity="0.35"/>
  <line x1="486" y1="229" x2="514" y2="240" stroke="#fff" stroke-width="1.5" opacity="0.35"/>
  <line x1="526" y1="241" x2="554" y2="232" stroke="#fff" stroke-width="1.5" opacity="0.35"/>
  <line x1="566" y1="231" x2="594" y2="239" stroke="#fff" stroke-width="1.5" opacity="0.35"/>
  <!-- Second row of nodes -->
  <circle cx="460" cy="255" r="5" fill="#fff" opacity="0.3"/>
  <circle cx="500" cy="250" r="5" fill="#fff" opacity="0.25"/>
  <circle cx="540" cy="256" r="5" fill="#fff" opacity="0.3"/>
  <circle cx="580" cy="252" r="5" fill="#fff" opacity="0.25"/>
  <!-- Cross connections -->
  <line x1="442" y1="243" x2="456" y2="252" stroke="#fff" stroke-width="1" opacity="0.25"/>
  <line x1="482" y1="233" x2="498" y2="247" stroke="#fff" stroke-width="1" opacity="0.25"/>
  <line x1="522" y1="247" x2="537" y2="253" stroke="#fff" stroke-width="1" opacity="0.25"/>
  <line x1="562" y1="235" x2="577" y2="249" stroke="#fff" stroke-width="1" opacity="0.25"/>
  <!-- Code bracket -->
  <text x="630" y="252" font-size="18" fill="#fff" opacity="0.25" font-weight="300">{}</text>

  <!-- Label -->
  <text x="355" y="272" text-anchor="end" font-size="17" font-weight="800" fill="#1a1a1a">Layer 4: Models</text>
  <text x="355" y="290" text-anchor="end" font-size="12" fill="#555">The software algorithms and neural</text>
  <text x="355" y="305" text-anchor="end" font-size="12" fill="#555">networks (including open-source) that</text>
  <text x="355" y="320" text-anchor="end" font-size="12" fill="#555">form the intelligence of AI.</text>

  <!-- ================================================================ -->
  <!-- LAYER 5: APPLICATIONS — top, highlighted                          -->
  <!-- ================================================================ -->
  <g filter="url(#s1)">
    <path d="M 400,155 L 400,205 Q 400,215 412,215 L 608,215 Q 620,215 620,205 L 620,155 Z" fill="#d63384"/>
    <path d="M 400,155 L 422,133 L 642,133 L 620,155 Z" fill="#ec4899"/>
    <path d="M 620,155 L 642,133 L 642,193 L 620,215 Z" fill="#be2d74"/>
    <path d="M 422,133 L 438,121 L 634,121 L 642,133 Z" fill="#f9a8d4" opacity="0.4"/>
  </g>
  <!-- ICONS: phone, laptop, chat bubble, dashboard -->
  <!-- Phone -->
  <rect x="448" y="124" width="16" height="26" rx="3" fill="#fff" opacity="0.45"/>
  <rect x="451" y="128" width="10" height="16" rx="1" fill="#ec4899" opacity="0.4"/>
  <circle cx="456" cy="147" r="1.5" fill="#fff" opacity="0.5"/>
  <!-- Laptop -->
  <rect x="480" y="130" width="28" height="18" rx="2" fill="#fff" opacity="0.4"/>
  <rect x="483" y="133" width="22" height="12" rx="1" fill="#ec4899" opacity="0.35"/>
  <rect x="476" y="148" width="36" height="3" rx="1.5" fill="#fff" opacity="0.35"/>
  <!-- Chat bubble -->
  <rect x="525" y="126" width="24" height="16" rx="6" fill="#fff" opacity="0.4"/>
  <polygon points="530,142 534,148 538,142" fill="#fff" opacity="0.4"/>
  <line x1="530" y1="132" x2="544" y2="132" stroke="#ec4899" stroke-width="1.5" opacity="0.4"/>
  <line x1="530" y1="137" x2="540" y2="137" stroke="#ec4899" stroke-width="1.5" opacity="0.4"/>
  <!-- Dashboard/chart -->
  <rect x="565" y="126" width="26" height="22" rx="2" fill="#fff" opacity="0.35"/>
  <rect x="569" y="138" width="4" height="6" rx="1" fill="#ec4899" opacity="0.45"/>
  <rect x="575" y="134" width="4" height="10" rx="1" fill="#ec4899" opacity="0.45"/>
  <rect x="581" y="131" width="4" height="13" rx="1" fill="#ec4899" opacity="0.45"/>
  <!-- Person icon -->
  <circle cx="612" cy="130" r="5" fill="#fff" opacity="0.3"/>
  <path d="M 605,147 Q 612,140 619,147" fill="#fff" opacity="0.25"/>

  <!-- Label -->
  <text x="385" y="168" text-anchor="end" font-size="17" font-weight="800" fill="#1a1a1a">Layer 5: Applications</text>
  <text x="385" y="186" text-anchor="end" font-size="12" fill="#555">The end-user products and services</text>
  <text x="385" y="201" text-anchor="end" font-size="12" fill="#555">that leverage AI to solve problems</text>
  <text x="385" y="216" text-anchor="end" font-size="12" fill="#555">and provide value.</text>

  <!-- ===== "THIS BOOK" callout ===== -->
  <rect x="680" y="100" width="210" height="42" rx="10" fill="#db2777" filter="url(#s2)"/>
  <text x="785" y="127" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">THIS BOOK LIVES HERE</text>
  <line x1="678" y1="121" x2="645" y2="140" stroke="#db2777" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Footer -->
  <text x="525" y="690" text-anchor="middle" font-size="12" fill="#aaa" font-style="italic">Panaversity — The AI Agent Factory</text>
</svg>